name: Azure Static Web Apps CI/CD (TEST)

on:
  push:
    branches:
      - dev

jobs:
  build_and_deploy_test:
    runs-on: ubuntu-latest
    name: Build and Deploy to TEST
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli
      - name: Deploy via SWA CLI
        run: |
          swa deploy ./static-site \
            --api-location ./api \
            --api-language python \
            --api-version 3.11 \
            --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_TEST }}
