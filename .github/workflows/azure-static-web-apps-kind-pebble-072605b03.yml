name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'test/**'
      - 'fix/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    env:
      IS_PREVIEW: ${{ github.ref != 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Bump version
        if: github.ref == 'refs/heads/main'
        run: |
          FILE="static-site/version.json"
          BUILD=$(jq '.build' "$FILE")
          NEW_BUILD=$((BUILD + 1))
          MAJOR=1
          MINOR=$((NEW_BUILD / 100))
          PATCH=$((NEW_BUILD % 100))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "{\"version\":\"${VERSION}\",\"build\":${NEW_BUILD}}" > "$FILE"
          echo "Updated to: Version ${VERSION} (Build ${NEW_BUILD})"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_072605B03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "static-site" # App source code path
          api_location: "api" # Api source code path - now set to 'api'
          output_location: "" # Built app content directory - optional
          production_branch: "main"
          deployment_environment: ${{ github.ref == 'refs/heads/main' && '' || github.head_ref || github.ref_name }}
          ###### End of Repository/Build Configurations ######
      - name: Commit version bump
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static-site/version.json
          git diff --cached --quiet || git commit -m "chore: bump to v$(jq -r '.version' static-site/version.json) [skip ci]"
          git push || true

  set_preview_env_settings:
    needs: build_and_deploy_job
    if: >
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    name: Set Preview Dev-DB Settings
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set DV_DEFAULT_URL to Dev environment
        run: |
          ENV_NAME="${{ github.event.pull_request.number || github.ref_name }}"
          echo "Setting Dev-DB for preview environment: $ENV_NAME"
          az staticwebapp appsettings set \
            --name dorfladen-website \
            --environment-name "$ENV_NAME" \
            --setting-names "DV_DEFAULT_URL=https://org392a4789.crm16.dynamics.com"
          echo "Preview environment configured to use DEV Dataverse"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_072605B03 }}
          action: "close"
          app_location: "static-site"
