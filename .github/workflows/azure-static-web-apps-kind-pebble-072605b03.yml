name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Bump version
        run: |
          FILE="static-site/version.json"
          BUILD=$(jq '.build' "$FILE")
          NEW_BUILD=$((BUILD + 1))
          MAJOR=1
          MINOR=$((NEW_BUILD / 100))
          PATCH=$((NEW_BUILD % 100))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "{\"version\":\"${VERSION}\",\"build\":${NEW_BUILD}}" > "$FILE"
          echo "Updated to: Version ${VERSION} (Build ${NEW_BUILD})"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_072605B03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "static-site" # App source code path
          api_location: "api" # Api source code path - now set to 'api'
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static-site/version.json
          git diff --cached --quiet || git commit -m "chore: bump to v$(jq -r '.version' static-site/version.json) [skip ci]"
          git push || true

  set_preview_env_settings:
    needs: build_and_deploy_job
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Set Isolated Preview Settings
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set Preview environment settings
        run: |
          PRODUCTION_SETTINGS="$(az staticwebapp appsettings list \
            --name dorfladen-website --resource-group rg-dorfladen \
            --subscription 89dd5962-2356-4f41-aa6b-ab6c0e054877 \
            --output json --only-show-errors)"
          OFFER_SETTINGS=()
          for KEY in STORAGE_CONN CMS_AUTH_TOKEN CMS_PW_HASH SHOP_JWT_SECRET; do
            VALUE="$(jq -r --arg key "$KEY" '.properties[$key] // empty' <<< "$PRODUCTION_SETTINGS")"
            if [ -z "$VALUE" ]; then
              echo "::error::Required preview setting is missing: $KEY"
              exit 1
            fi
            echo "::add-mask::$VALUE"
            OFFER_SETTINGS+=("$KEY=$VALUE")
          done
          az staticwebapp appsettings set \
            --name dorfladen-website \
            --resource-group rg-dorfladen \
            --subscription 89dd5962-2356-4f41-aa6b-ab6c0e054877 \
            --environment-name ${{ github.event.pull_request.number }} \
            --setting-names \
              "${OFFER_SETTINGS[@]}" \
              "ANGEBOTE_NAMESPACE=preview-${{ github.event.pull_request.number }}" \
              "ANGEBOTE_WAAGE_SEND_ENABLED=false" \
              "DV_DEFAULT_URL=https://orgab4e2f00.crm16.dynamics.com" \
            --output none --only-show-errors
          echo "Preview configured: existing Dataverse mapping, private offer namespace, managed scale sends disabled"

  set_production_offer_namespace:
    needs: build_and_deploy_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Set Production Offer Namespace
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Validate production settings and set offer namespace
        run: |
          PRODUCTION_SETTINGS="$(az staticwebapp appsettings list \
            --name dorfladen-website --resource-group rg-dorfladen \
            --subscription 89dd5962-2356-4f41-aa6b-ab6c0e054877 \
            --output json --only-show-errors)"
          for KEY in STORAGE_CONN CMS_AUTH_TOKEN CMS_PW_HASH SHOP_JWT_SECRET; do
            VALUE="$(jq -r --arg key "$KEY" '.properties[$key] // empty' <<< "$PRODUCTION_SETTINGS")"
            if [ -z "$VALUE" ]; then
              echo "::error::Required production setting is missing: $KEY"
              exit 1
            fi
            echo "::add-mask::$VALUE"
          done
          az staticwebapp appsettings set \
            --name dorfladen-website \
            --resource-group rg-dorfladen \
            --subscription 89dd5962-2356-4f41-aa6b-ab6c0e054877 \
            --setting-names "ANGEBOTE_NAMESPACE=production" \
            --output none --only-show-errors
          echo "Production offer namespace configured; existing settings preserved"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_072605B03 }}
          action: "close"
