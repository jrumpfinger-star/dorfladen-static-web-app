name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Bump version
        run: |
          FILE="static-site/version.json"
          BUILD=$(jq '.build' "$FILE")
          NEW_BUILD=$((BUILD + 1))
          MAJOR=1
          MINOR=$((NEW_BUILD / 100))
          PATCH=$((NEW_BUILD % 100))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "{\"version\":\"${VERSION}\",\"build\":${NEW_BUILD}}" > "$FILE"
          echo "Updated to: Version ${VERSION} (Build ${NEW_BUILD})"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_072605B03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "static-site" # App source code path
          api_location: "api" # Api source code path - now set to 'api'
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static-site/version.json
          git diff --cached --quiet || git commit -m "chore: bump to v$(jq -r '.version' static-site/version.json) [skip ci]"
          git push || true

  set_preview_env_settings:
    needs: build_and_deploy_job
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Set Preview Dev-DB Settings
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set Preview environment settings
        run: |
          az staticwebapp appsettings set \
            --name dorfladen-website \
            --environment-name ${{ github.event.pull_request.number }} \
            --setting-names \
              "DV_DEFAULT_URL=https://orgab4e2f00.crm16.dynamics.com" \
              "SHOP_JWT_SECRET=${{ secrets.SHOP_JWT_SECRET }}"
          echo "Preview environment configured with DEV Dataverse + Shop secrets"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_PEBBLE_072605B03 }}
          action: "close"
