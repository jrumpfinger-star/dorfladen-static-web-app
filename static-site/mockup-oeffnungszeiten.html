<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öffnungszeiten – Dorfladen Oberornau</title>
<link rel="stylesheet" href="/css/mockup.css">
</head>
<body>
<div id="mockup-header"></div>

<div class="m-page-header">
  <h1>🕐 Öffnungszeiten</h1>
  <p>Dorfladen & Postfiliale</p>
</div>

<div class="m-content">
  <h2>🛒 Dorfladen</h2>
  <div class="m-card">
    <table class="m-hours-tbl" id="tbl-laden"></table>
  </div>

  <h2>📦 Postfiliale</h2>
  <div class="m-card">
    <table class="m-hours-tbl" id="tbl-post"></table>
  </div>

  <div class="m-card" style="margin-top:12px;text-align:center">
    <p style="font-size:.88rem;color:var(--text-sec);margin:0">Außer an gesetzlichen Feiertagen<br>Änderungen werden unter <a href="/mockup-aktuelles.html" style="color:var(--pri);font-weight:600">Aktuelles</a> bekanntgegeben.</p>
  </div>

  <div style="margin-top:20px">
    <a href="tel:+4980826229991" class="m-btn m-btn-pri">📞 Anrufen</a>
  </div>
</div>

<div id="mockup-footer"></div>
<script src="/js/mockup-shared.js"></script>
<script>
initMockupPage('oeffnungszeiten');
(function(){
  var days=['So','Mo','Di','Mi','Do','Fr','Sa'];
  var laden=[
    {d:'Mo',t:'06:30–14:00 & 16:30–19:00'},
    {d:'Di',t:'06:30–14:00'},
    {d:'Mi',t:'06:30–14:00 & 16:30–19:00'},
    {d:'Do',t:'06:30–14:00 & 16:30–19:00'},
    {d:'Fr',t:'06:30–14:00 & 16:30–19:00'},
    {d:'Sa',t:'07:00–13:00'},
    {d:'So',t:'Geschlossen',closed:true}
  ];
  var post=[
    {d:'Mo',t:'09:00–14:00 & 16:30–19:00'},
    {d:'Di',t:'09:00–14:00'},
    {d:'Mi',t:'09:00–14:00 & 16:30–19:00'},
    {d:'Do',t:'09:00–14:00 & 16:30–19:00'},
    {d:'Fr',t:'09:00–14:00 & 16:30–19:00'},
    {d:'Sa',t:'09:00–13:00'},
    {d:'So',t:'Geschlossen',closed:true}
  ];
  var todayDay=days[new Date().getDay()];
  function render(data,elId){
    var html='';
    data.forEach(function(r){
      var isTd=r.d===todayDay;
      html+='<tr'+(isTd?' class="today-row"':'')+'>';
      html+='<td>'+r.d+'</td>';
      html+='<td class="'+(r.closed?'hrs-closed':'hrs-time')+'">'+r.t+'</td>';
      html+='</tr>';
    });
    document.getElementById(elId).innerHTML=html;
  }
  render(laden,'tbl-laden');
  render(post,'tbl-post');
})();
</script>
</body>
</html>
