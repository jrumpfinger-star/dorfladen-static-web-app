<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mittagstisch-Bestellungen – Dorfladen</title>
  <style>
    :root{--c-pri:#2d5016;--c-green:#2e7d4f;--c-red:#dc2626;--c-bg:#f5f5f5;--c-card:#fff;--c-text:#1f2937;--c-muted:#6b7280;--radius:12px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--c-bg);color:var(--c-text)}

    .header{background:linear-gradient(135deg,#2d5016,#3a6b1e);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
    .header h1{font-size:18px;font-weight:800;flex:1}
    .header a{color:#fff;text-decoration:none;font-size:13px;opacity:.8}

    .toolbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .toolbar input[type=date]{padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit}
    .toolbar select{padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit}
    .toolbar .refresh-btn{padding:8px 14px;background:var(--c-green);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
    .toolbar .print-btn{padding:8px 14px;background:#374151;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}

    .stats{display:flex;gap:12px;padding:12px 16px;flex-wrap:wrap}
    .stat{background:#fff;border-radius:10px;padding:12px 16px;flex:1;min-width:100px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .stat-val{font-size:24px;font-weight:800}
    .stat-label{font-size:11px;color:var(--c-muted);font-weight:600;text-transform:uppercase}
    .stat.green .stat-val{color:var(--c-green)}
    .stat.orange .stat-val{color:#e65100}
    .stat.red .stat-val{color:var(--c-red)}

    .orders{padding:12px 16px}
    .order-card{background:#fff;border-radius:var(--radius);box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:10px;overflow:hidden;border-left:4px solid transparent}
    .order-card.status-0{border-left-color:#f59e0b}
    .order-card.status-1{border-left-color:var(--c-green)}
    .order-card.status-2{border-left-color:var(--c-red)}
    .order-card.status-3{border-left-color:#6b7280}
    .order-top{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}
    .order-nr{font-size:12px;font-weight:700;color:var(--c-muted);min-width:90px}
    .order-name{font-weight:700;flex:1;font-size:14px}
    .order-dish{font-size:13px;color:var(--c-text);flex:2}
    .order-qty{font-size:14px;font-weight:700;color:var(--c-green);min-width:30px;text-align:center}
    .order-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
    .badge-neu{background:#fef3c7;color:#92400e}
    .badge-ok{background:#dcfce7;color:#166534}
    .badge-cancel{background:#fef2f2;color:#991b1b}
    .badge-done{background:#f3f4f6;color:#6b7280}
    .order-mitnehmen{font-size:10px;background:#dbeafe;color:#1d4ed8;padding:2px 6px;border-radius:4px;font-weight:700}

    .order-detail{display:none;padding:0 16px 12px;border-top:1px solid #f3f4f6}
    .order-detail.open{display:block}
    .detail-row{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}
    .detail-label{font-weight:600;color:var(--c-muted);min-width:80px}
    .action-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
    .action-btn{padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
    .btn-confirm{background:var(--c-green);color:#fff}
    .btn-cancel{background:var(--c-red);color:#fff}
    .btn-done{background:#6b7280;color:#fff}
    .reply-input{width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;font-family:inherit;margin-top:6px}

    .empty{text-align:center;padding:40px 20px;color:var(--c-muted)}

    @media print{
      .header,.toolbar,.action-row,.reply-input,.order-badge{display:none!important}
      .order-detail{display:block!important}
      .order-card{break-inside:avoid;border:1px solid #ccc;margin-bottom:8px}
      .stats{display:none}
      body{background:#fff}
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🍽 Mittagstisch-Bestellungen</h1>
  <a href="/">← Startseite</a>
</div>

<div class="toolbar">
  <input type="date" id="filter-date" title="Datum filtern">
  <select id="filter-status">
    <option value="">Alle Status</option>
    <option value="0">🟡 Neu</option>
    <option value="1">✅ Bestätigt</option>
    <option value="2">❌ Storniert</option>
    <option value="3">✔ Abgeholt</option>
  </select>
  <button class="refresh-btn" onclick="loadOrders()">🔄 Aktualisieren</button>
  <button class="print-btn" onclick="window.print()">🖨 Drucken</button>
</div>

<div class="stats" id="stats-row"></div>
<div class="orders" id="orders-list">
  <div class="empty">Laden…</div>
</div>

<script>
(function(){
  var API = '/api';
  var orders = [];

  function formatDate(d){
    if(!d) return '';
    var dt = new Date(d);
    return dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'});
  }
  function formatTime(d){
    if(!d) return '';
    var dt = new Date(d);
    return dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  }
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

  var STATUS_LABELS = {0:'Neu',1:'Bestätigt',2:'Storniert',3:'Abgeholt'};
  var BADGE_CLASSES = {0:'badge-neu',1:'badge-ok',2:'badge-cancel',3:'badge-done'};

  // Default date = today
  var today = new Date().toISOString().split('T')[0];
  document.getElementById('filter-date').value = today;

  window.loadOrders = function(){
    var datum = document.getElementById('filter-date').value;
    var status = document.getElementById('filter-status').value;
    var url = API + '/lunch-order';
    var params = [];
    if(datum) params.push('datum=' + datum);
    if(status !== '') params.push('status=' + status);
    if(params.length) url += '?' + params.join('&');

    document.getElementById('orders-list').innerHTML = '<div class="empty">⏳ Laden…</div>';

    fetch(url)
      .then(function(r){return r.json();})
      .then(function(res){
        if(!res.success){
          document.getElementById('orders-list').innerHTML = '<div class="empty">Fehler: ' + esc(res.error) + '</div>';
          return;
        }
        orders = res.orders || [];
        renderOrders();
        renderStats();
      })
      .catch(function(e){
        document.getElementById('orders-list').innerHTML = '<div class="empty">Fehler: ' + esc(e.message) + '</div>';
      });
  };

  function renderStats(){
    var neu = orders.filter(function(o){return o.status===0;}).length;
    var ok = orders.filter(function(o){return o.status===1;}).length;
    var total = orders.reduce(function(s,o){return s + (o.menge||1);},0);
    var umsatz = orders.filter(function(o){return o.status!==2;}).reduce(function(s,o){return s + (o.preis||0)*(o.menge||1);},0);

    document.getElementById('stats-row').innerHTML =
      '<div class="stat orange"><div class="stat-val">' + neu + '</div><div class="stat-label">Offen</div></div>' +
      '<div class="stat green"><div class="stat-val">' + ok + '</div><div class="stat-label">Bestätigt</div></div>' +
      '<div class="stat"><div class="stat-val">' + total + '</div><div class="stat-label">Portionen</div></div>' +
      '<div class="stat"><div class="stat-val">' + umsatz.toFixed(2).replace('.',',') + ' €</div><div class="stat-label">Umsatz</div></div>';
  }

  function renderOrders(){
    if(orders.length === 0){
      document.getElementById('orders-list').innerHTML = '<div class="empty">Keine Bestellungen für dieses Datum.</div>';
      return;
    }

    var html = '';
    orders.forEach(function(o,idx){
      var statusBadge = '<span class="order-badge ' + (BADGE_CLASSES[o.status]||'') + '">' + (STATUS_LABELS[o.status]||'?') + '</span>';
      var mitnehmenBadge = o.mitnehmen ? ' <span class="order-mitnehmen">📦 Mitnehmen</span>' : '';

      html += '<div class="order-card status-' + o.status + '">';
      html += '<div class="order-top" onclick="toggleDetail(' + idx + ')">';
      html += '<div class="order-nr">' + esc(o.bestellnummer) + '</div>';
      html += '<div class="order-name">' + esc(o.name) + '</div>';
      html += '<div class="order-dish">' + esc(o.gericht) + mitnehmenBadge + '</div>';
      html += '<div class="order-qty">×' + (o.menge||1) + '</div>';
      html += statusBadge;
      html += '</div>';

      html += '<div class="order-detail" id="detail-' + idx + '">';
      html += '<div class="detail-row"><span class="detail-label">E-Mail:</span> ' + esc(o.email) + '</div>';
      if(o.telefon) html += '<div class="detail-row"><span class="detail-label">Telefon:</span> <a href="tel:' + esc(o.telefon) + '">' + esc(o.telefon) + '</a></div>';
      html += '<div class="detail-row"><span class="detail-label">Preis:</span> ' + ((o.preis||0)*(o.menge||1)).toFixed(2).replace('.',',') + ' €</div>';
      html += '<div class="detail-row"><span class="detail-label">Bestellt:</span> ' + formatDate(o.bestellt_am) + ' ' + formatTime(o.bestellt_am) + '</div>';
      if(o.anmerkung) html += '<div class="detail-row"><span class="detail-label">Anmerkung:</span> <em>' + esc(o.anmerkung) + '</em></div>';
      if(o.bestaetigung_text) html += '<div class="detail-row"><span class="detail-label">Antwort:</span> ' + esc(o.bestaetigung_text) + '</div>';
      if(o.wochentag_label) html += '<div class="detail-row"><span class="detail-label">Tag:</span> ' + esc(o.wochentag_label) + '</div>';

      if(o.status === 0){
        html += '<input class="reply-input" id="reply-' + idx + '" placeholder="Optionale Rückmeldung an Kunden…">';
        html += '<div class="action-row">';
        html += '<button class="action-btn btn-confirm" onclick="updateStatus(' + idx + ',1)">✅ Bestätigen</button>';
        html += '<button class="action-btn btn-cancel" onclick="updateStatus(' + idx + ',2)">❌ Stornieren</button>';
        html += '</div>';
      } else if(o.status === 1){
        html += '<div class="action-row">';
        html += '<button class="action-btn btn-done" onclick="updateStatus(' + idx + ',3)">✔ Abgeholt</button>';
        html += '<button class="action-btn btn-cancel" onclick="updateStatus(' + idx + ',2)">❌ Stornieren</button>';
        html += '</div>';
      }

      html += '</div></div>';
    });
    document.getElementById('orders-list').innerHTML = html;
  }

  window.toggleDetail = function(idx){
    var el = document.getElementById('detail-' + idx);
    if(el) el.classList.toggle('open');
  };

  window.updateStatus = function(idx, newStatus){
    var o = orders[idx];
    if(!o) return;
    var replyEl = document.getElementById('reply-' + idx);
    var reply = replyEl ? replyEl.value.trim() : '';

    fetch(API + '/lunch-order/' + o.id, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({status: newStatus, bestaetigung_text: reply})
    })
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.success){
        loadOrders(); // Refresh
      } else {
        alert('Fehler: ' + (res.error || 'Unbekannt'));
      }
    })
    .catch(function(e){alert('Fehler: ' + e.message);});
  };

  // Auto-refresh every 30s
  setInterval(loadOrders, 30000);

  // Initial load
  loadOrders();
})();
</script>
</body>
</html>
