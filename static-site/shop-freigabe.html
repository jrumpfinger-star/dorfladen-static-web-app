<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dorfladen – Artikelfreigabe</title>
<style>
:root{--green:#2e7d4f;--green2:#1f5c39;--bg:#f4f7f5;--card:#fff;--border:#dfe7e2;--text:#24352b;--muted:#6b7f72;--warn:#f59e0b;--red:#dc2626;--blue:#2563eb}
*{box-sizing:border-box;margin:0}body{background:var(--bg);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text)}

/* ── Top bar ── */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--green);font-size:15px}
.brand-icon{width:34px;height:34px;border-radius:10px;background:#e9f5ee;display:grid;place-items:center;font-size:20px}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.primary:hover{background:var(--green2)}
.btn.small{padding:5px 8px;font-size:12px}
.btn.red{color:var(--red);border-color:var(--red)}.btn.red:hover{background:#fef2f2}

/* ── Toolbar ── */
.toolbar{position:sticky;top:57px;z-index:15;background:#fff;border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-wrap{position:relative;flex:0 1 320px;min-width:180px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 30px 8px 32px;font-size:13px;outline:none;box-sizing:border-box}
.search:focus{border-color:var(--green)}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px;display:none}
.search-clear:hover{color:#111}
.stats{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.filter-btn{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;background:#fff;transition:.15s}
.filter-btn:hover,.filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}

/* ── Warengruppe Accordion ── */
.wrap{max-width:1400px;margin:0 auto;padding:12px 18px 80px}
.wg{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden}
.wg-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;font-weight:800;font-size:14px;transition:background .12s}
.wg-head:hover{background:#f8fbf9}
.wg-arrow{font-size:11px;color:var(--muted);transition:transform .2s;width:16px}
.wg.open .wg-arrow{transform:rotate(90deg)}
.wg-count{margin-left:auto;display:flex;gap:6px;align-items:center}
.wg-badge{font-size:11px;padding:2px 7px;border-radius:99px;font-weight:800}
.badge-total{background:#e5e7eb;color:#374151}
.badge-on{background:#dcfce7;color:#166534}
.wg-body{display:none;border-top:1px solid var(--border)}
.wg.open .wg-body{display:block}

/* ── Article rows ── */
.art-table{width:100%;border-collapse:collapse;font-size:13px}
.art-table th{text-align:left;padding:6px 8px;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.art-row{border-bottom:1px solid #f3f4f6;transition:background .1s}
.art-row:hover{background:#f8fbf9}
.art-row.enabled{background:#f0faf3}
.art-row td{padding:5px 8px;vertical-align:middle}
.art-cb{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
.art-img{width:36px;height:36px;border-radius:6px;object-fit:contain;background:#f9fafb;border:1px solid #e5e7eb;cursor:pointer}
.art-img-empty{width:36px;height:36px;border-radius:6px;background:#f3f4f6;border:1px dashed #d1d5db;display:grid;place-items:center;font-size:14px;color:#9ca3af;cursor:pointer}
.art-name{font-weight:700;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art-code{font-size:11px;color:var(--muted)}
.art-price{font-weight:700;white-space:nowrap}
.art-date{width:110px}
.art-date input{width:100%;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:12px;font-family:inherit}
.art-actions{display:flex;gap:4px}

/* ── Image upload overlay ── */
.img-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;place-items:center}
.img-overlay.show{display:grid}
.img-dialog{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.img-dialog h3{margin-bottom:12px;font-size:16px}
.img-preview{width:100%;max-height:280px;object-fit:contain;border-radius:8px;background:#f9fafb;border:1px solid var(--border);margin-bottom:12px}
.img-drop{border:2px dashed var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--muted);cursor:pointer;transition:.2s;margin-bottom:12px}
.img-drop:hover,.img-drop.drag{border-color:var(--green);background:#f0faf3}
.img-actions{display:flex;gap:8px;justify-content:flex-end}

/* ── Toast ── */
.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;z-index:200}

/* ── Batch bar ── */
.batch-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 18px;display:none;align-items:center;gap:12px;z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.batch-bar.show{display:flex}

@media(max-width:768px){
  .art-table th:nth-child(4),.art-row td:nth-child(4){display:none}
  .art-name{max-width:160px}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="brand-icon">🛒</div><div>Artikelfreigabe</div></div>
  <div class="spacer"></div>
  <a class="btn" href="/shop-admin">Bestellungen</a>
  <a class="btn" href="/cms">CMS</a>
  <button class="btn primary" id="btn-save">Änderungen speichern</button>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search" id="search" placeholder="Suchen…" autocomplete="off">
    <button class="search-clear" id="search-clear" title="Suche leeren">&times;</button>
  </div>
  <button class="filter-btn active" data-filter="all">Alle</button>
  <button class="filter-btn" data-filter="enabled">Freigegeben</button>
  <button class="filter-btn" data-filter="disabled">Nicht freigegeben</button>
  <div class="stats" id="stats">Lade…</div>
</div>

<div class="wrap" id="wrap">
  <div style="padding:40px;text-align:center;color:var(--muted)">Lade Artikelstamm…</div>
</div>

<!-- Batch action bar -->
<div class="batch-bar" id="batch-bar">
  <span id="batch-count" style="font-weight:800"></span>
  <input type="date" id="batch-date" style="border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px" title="Ablaufdatum für alle markierten setzen">
  <button class="btn small primary" id="batch-enable">Alle freigeben</button>
  <button class="btn small red" id="batch-disable">Alle sperren</button>
  <div class="spacer"></div>
  <button class="btn small" id="batch-clear">Auswahl aufheben</button>
</div>

<!-- Image upload dialog -->
<div class="img-overlay" id="img-overlay">
  <div class="img-dialog">
    <h3 id="img-title">Produktbild</h3>
    <img class="img-preview" id="img-preview" src="" alt="Vorschau" style="display:none">
    <div class="img-drop" id="img-drop">
      📷 Bild hierhin ziehen oder klicken
      <input type="file" id="img-file" accept="image/*" style="display:none">
    </div>
    <div class="img-actions">
      <button class="btn small red" id="img-delete" style="display:none">Bild löschen</button>
      <div class="spacer"></div>
      <button class="btn small" id="img-cancel">Abbrechen</button>
      <button class="btn small primary" id="img-upload" style="display:none">Hochladen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="shop-images.js"></script>
<script>
(function(){
  var API='/api';
  var allArticles=[];     // from Artikelstamm
  var freigabeMap={};     // strichcode → {id, aktiv, gueltig_bis, ...}
  var pendingChanges={};  // strichcode → {action:'enable'|'disable'|'update', gueltig_bis}
  var activeFilter='all';
  var searchTerm='';
  var imgStrichcode='';
  var imgFileData=null;
  var imgCache={};  // strichcode → base64/url

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none';},2500);}

  // ── Load data ──
  function loadData(){
    Promise.all([
      fetch(API+'/shop-freigabe?articles=1').then(function(r){return r.json();}),
      fetch(API+'/shop-freigabe').then(function(r){return r.json();})
    ]).then(function(res){
      allArticles=res[0].articles||[];
      freigabeMap={};
      (res[1].freigaben||[]).forEach(function(f){
        freigabeMap[f.strichcode]=f;
      });
      pendingChanges={};
      render();
    }).catch(function(e){
      document.getElementById('wrap').innerHTML='<div style="padding:40px;text-align:center;color:var(--red)">Fehler: '+esc(e.message)+'</div>';
    });
  }

  // ── Filtering ──
  function filteredArticles(){
    var term=searchTerm.toLowerCase();
    return allArticles.filter(function(a){
      // search filter
      if(term){
        var hay=(a.bezeichnung+' '+a.strichcode+' '+a.edeka_nr+' '+a.warengruppe).toLowerCase();
        if(hay.indexOf(term)<0) return false;
      }
      // enabled/disabled filter
      var isEnabled=isArticleEnabled(a.strichcode);
      if(activeFilter==='enabled'&&!isEnabled) return false;
      if(activeFilter==='disabled'&&isEnabled) return false;
      return true;
    });
  }

  function isArticleEnabled(sc){
    var p=pendingChanges[sc];
    if(p){
      if(p.action==='enable') return true;
      if(p.action==='disable') return false;
    }
    var f=freigabeMap[sc];
    return f&&f.aktiv;
  }

  function isKurzfristig(sc){
    var p=pendingChanges[sc];
    if(p&&p.kurzfristig!==undefined) return p.kurzfristig;
    var f=freigabeMap[sc];
    return f&&f.kurzfristig;
  }

  function getGueltigBis(sc){
    var p=pendingChanges[sc];
    if(p&&p.gueltig_bis!==undefined) return p.gueltig_bis||'';
    var f=freigabeMap[sc];
    return (f&&f.gueltig_bis)?f.gueltig_bis.substring(0,10):'';
  }

  // ── Group by Warengruppe ──
  function groupByWarengruppe(articles){
    var groups={};
    articles.forEach(function(a){
      var wg=a.warengruppe||'Sonstige';
      if(!groups[wg]) groups[wg]={name:wg,items:[],enabledCount:0,totalInStamm:0};
      groups[wg].items.push(a);
      if(isArticleEnabled(a.strichcode)) groups[wg].enabledCount++;
    });
    // Sort groups: ones with enabled articles first, then alphabetical
    var keys=Object.keys(groups).sort(function(a,b){
      var ea=groups[a].enabledCount,eb=groups[b].enabledCount;
      if(ea>0&&eb===0) return -1;
      if(eb>0&&ea===0) return 1;
      return a.localeCompare(b);
    });
    return keys.map(function(k){return groups[k];});
  }

  // ── Render ──
  function render(){
    var articles=filteredArticles();
    var groups=groupByWarengruppe(articles);
    var totalEnabled=0;
    allArticles.forEach(function(a){if(isArticleEnabled(a.strichcode))totalEnabled++;});
    document.getElementById('stats').textContent=totalEnabled+' freigegeben / '+allArticles.length+' Artikel';

    var wrap=document.getElementById('wrap');
    if(!groups.length){
      wrap.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">Keine Artikel gefunden.</div>';
      return;
    }

    var html='';
    groups.forEach(function(g){
      var isOpen=g.enabledCount>0||searchTerm.length>0;
      // Limit visible items to keep DOM small; show expand button for large groups
      var maxVisible=50;
      var hasMore=g.items.length>maxVisible;

      html+='<div class="wg'+(isOpen?' open':'')+'" data-wg="'+esc(g.name)+'">';
      html+='<div class="wg-head"><span class="wg-arrow">▶</span>'+esc(g.name);
      html+='<div class="wg-count">';
      if(g.enabledCount>0) html+='<span class="wg-badge badge-on">'+g.enabledCount+' aktiv</span>';
      html+='<span class="wg-badge badge-total">'+g.items.length+'</span>';
      var allChecked=g.enabledCount===g.items.length;
      html+='<input type="checkbox" class="wg-cb" data-wg-cb="'+esc(g.name)+'" title="Alle in '+esc(g.name)+'" style="width:18px;height:18px;accent-color:var(--green);cursor:pointer;margin-left:6px"'+(allChecked?' checked':'')+'>';
      html+='</div></div>';
      html+='<div class="wg-body"><table class="art-table"><thead><tr>';
      html+='<th style="width:30px"></th><th style="width:42px">Bild</th><th>Artikel</th><th>Preis</th><th style="width:50px" title="Nur kurz verfügbar">Kurz</th><th style="width:120px">Gültig bis</th><th style="width:30px"></th>';
      html+='</tr></thead><tbody>';

      var visible=hasMore?g.items.slice(0,maxVisible):g.items;
      visible.forEach(function(a){
        var en=isArticleEnabled(a.strichcode);
        var gb=getGueltigBis(a.strichcode);
        var changed=!!pendingChanges[a.strichcode];
        html+='<tr class="art-row'+(en?' enabled':'')+'" data-sc="'+esc(a.strichcode)+'">';
        html+='<td><input type="checkbox" class="art-cb" data-sc="'+esc(a.strichcode)+'"'+(en?' checked':'')+'></td>';
        var imgHtml=imgCache[a.strichcode]
        ?'<img class="art-img" data-img-sc="'+esc(a.strichcode)+'" src="'+imgCache[a.strichcode]+'" title="Bild bearbeiten">'
        :'<div class="art-img-empty" data-img-sc="'+esc(a.strichcode)+'" id="fimg-'+esc(a.strichcode)+'" title="Bild bearbeiten">📷</div>';
      html+='<td>'+imgHtml+'</td>';
        html+='<td><div class="art-name">'+esc(a.bezeichnung)+'</div><div class="art-code">'+esc(a.strichcode)+(a.edeka_nr?' · '+esc(a.edeka_nr):'')+'</div></td>';
        html+='<td class="art-price">'+Number(a.preis).toFixed(2)+' €</td>';
        var kf=isKurzfristig(a.strichcode);
        html+='<td style="text-align:center"><input type="checkbox" class="art-kf" data-kf-sc="'+esc(a.strichcode)+'" title="Nur kurz verfügbar"'+(kf?' checked':'')+(en?'':' disabled')+'></td>';
        html+='<td class="art-date"><input type="date" value="'+esc(gb)+'" data-date-sc="'+esc(a.strichcode)+'" title="Ablaufdatum"'+(en?'':' disabled')+'></td>';
        html+='<td></td>';
        html+='</tr>';
      });
      if(hasMore){
        html+='<tr><td colspan="7" style="text-align:center;padding:8px"><button class="btn small show-all-btn" data-wg="'+esc(g.name)+'">Alle '+(g.items.length)+' anzeigen</button></td></tr>';
      }
      html+='</tbody></table></div></div>';
    });
    wrap.innerHTML=html;
    bindEvents();
    // Load images for visible articles
    loadImages(articles);
  }

  // ── Bind events ──
  function bindEvents(){
    // Accordion toggle
    document.querySelectorAll('.wg-head').forEach(function(head){
      head.addEventListener('click',function(){
        head.parentElement.classList.toggle('open');
      });
    });

    // Warengruppe select/deselect all
    document.querySelectorAll('.wg-cb').forEach(function(cb){
      cb.addEventListener('click',function(e){e.stopPropagation();});
      cb.addEventListener('change',function(e){
        var wgName=cb.getAttribute('data-wg-cb');
        var checked=cb.checked;
        var wgEl=cb.closest('.wg');
        if(!wgEl) return;
        // Toggle all article checkboxes in this group
        wgEl.querySelectorAll('.art-cb').forEach(function(artCb){
          if(artCb.checked!==checked){
            artCb.checked=checked;
            var sc=artCb.getAttribute('data-sc');
            toggleArticle(sc,checked);
            var dateInput=document.querySelector('[data-date-sc="'+sc+'"]');
            if(dateInput) dateInput.disabled=!checked;
            var row=artCb.closest('.art-row');
            if(row) row.classList.toggle('enabled',checked);
          }
        });
        // Also toggle articles not yet in DOM (groups with >50 items)
        allArticles.forEach(function(a){
          if((a.warengruppe||'Sonstige')===wgName){
            var currentlyEnabled=isArticleEnabled(a.strichcode);
            if(currentlyEnabled!==checked){
              toggleArticle(a.strichcode,checked);
            }
          }
        });
        updateStats();
        updateSaveBtn();
      });
    });

    // Checkbox toggle
    document.querySelectorAll('.art-cb').forEach(function(cb){
      cb.addEventListener('change',function(){
        var sc=cb.getAttribute('data-sc');
        toggleArticle(sc,cb.checked);
        // Enable/disable date + kurzfristig inputs
        var dateInput=document.querySelector('[data-date-sc="'+sc+'"]');
        if(dateInput) dateInput.disabled=!cb.checked;
        var kfInput=document.querySelector('[data-kf-sc="'+sc+'"]');
        if(kfInput) kfInput.disabled=!cb.checked;
        // Update row style
        var row=cb.closest('.art-row');
        if(row) row.classList.toggle('enabled',cb.checked);
        updateStats();
      });
    });

    // Kurzfristig toggle
    document.querySelectorAll('.art-kf').forEach(function(cb){
      cb.addEventListener('change',function(){
        var sc=cb.getAttribute('data-kf-sc');
        if(!pendingChanges[sc]) pendingChanges[sc]={action:'update'};
        pendingChanges[sc].kurzfristig=cb.checked;
        updateSaveBtn();
      });
    });

    // Date change
    document.querySelectorAll('[data-date-sc]').forEach(function(input){
      input.addEventListener('change',function(){
        var sc=input.getAttribute('data-date-sc');
        setGueltigBis(sc,input.value);
      });
    });

    // Image click
    document.querySelectorAll('[data-img-sc]').forEach(function(el){
      el.addEventListener('click',function(e){
        e.stopPropagation();
        openImageDialog(el.getAttribute('data-img-sc'));
      });
    });

    // Show all button
    document.querySelectorAll('.show-all-btn').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        var wgName=btn.getAttribute('data-wg');
        expandGroup(wgName);
      });
    });
  }

  function expandGroup(wgName){
    var articles=filteredArticles().filter(function(a){return (a.warengruppe||'Sonstige')===wgName;});
    var wgEl=document.querySelector('[data-wg="'+wgName+'"]');
    if(!wgEl) return;
    var tbody=wgEl.querySelector('tbody');
    if(!tbody) return;
    // Remove "show all" row
    var showRow=tbody.querySelector('.show-all-btn');
    if(showRow) showRow.closest('tr').remove();
    // Add remaining rows
    var existing=tbody.querySelectorAll('.art-row').length;
    articles.slice(existing).forEach(function(a){
      var en=isArticleEnabled(a.strichcode);
      var gb=getGueltigBis(a.strichcode);
      var tr=document.createElement('tr');
      tr.className='art-row'+(en?' enabled':'');
      tr.setAttribute('data-sc',a.strichcode);
      var eImgHtml=imgCache[a.strichcode]
        ?'<img class="art-img" data-img-sc="'+esc(a.strichcode)+'" src="'+imgCache[a.strichcode]+'" title="Bild bearbeiten">'
        :'<div class="art-img-empty" data-img-sc="'+esc(a.strichcode)+'" id="fimg-'+esc(a.strichcode)+'" title="Bild bearbeiten">📷</div>';
      tr.innerHTML='<td><input type="checkbox" class="art-cb" data-sc="'+esc(a.strichcode)+'"'+(en?' checked':'')+'></td>'
        +'<td>'+eImgHtml+'</td>'
        +'<td><div class="art-name">'+esc(a.bezeichnung)+'</div><div class="art-code">'+esc(a.strichcode)+(a.edeka_nr?' · '+esc(a.edeka_nr):'')+'</div></td>'
        +'<td class="art-price">'+Number(a.preis).toFixed(2)+' €</td>'
        +'<td style="text-align:center"><input type="checkbox" class="art-kf" data-kf-sc="'+esc(a.strichcode)+'" title="Nur kurz verfügbar"'+(isKurzfristig(a.strichcode)?' checked':'')+(en?'':' disabled')+'></td>'
        +'<td class="art-date"><input type="date" value="'+esc(gb)+'" data-date-sc="'+esc(a.strichcode)+'" title="Ablaufdatum"'+(en?'':' disabled')+'></td>'
        +'<td></td>';
      tbody.appendChild(tr);
    });
    bindEvents();
  }

  // ── Toggle / update ──
  function toggleArticle(sc,enabled){
    var f=freigabeMap[sc];
    var art=allArticles.find(function(a){return a.strichcode===sc;});
    if(enabled){
      pendingChanges[sc]=pendingChanges[sc]||{};
      pendingChanges[sc].action='enable';
      if(art){
        pendingChanges[sc].warengruppe=art.warengruppe;
        pendingChanges[sc].bezeichnung=art.bezeichnung;
        pendingChanges[sc].edeka_nr=art.edeka_nr;
      }
    } else {
      if(f){
        pendingChanges[sc]=pendingChanges[sc]||{};
        pendingChanges[sc].action='disable';
      } else {
        delete pendingChanges[sc];
      }
    }
    updateSaveBtn();
  }

  function setGueltigBis(sc,val){
    pendingChanges[sc]=pendingChanges[sc]||{};
    pendingChanges[sc].gueltig_bis=val;
    updateSaveBtn();
  }

  function updateSaveBtn(){
    var count=Object.keys(pendingChanges).length;
    var btn=document.getElementById('btn-save');
    btn.textContent=count>0?'Speichern ('+count+')':'Änderungen speichern';
    btn.style.background=count>0?'var(--green)':'';
  }

  function updateStats(){
    var totalEnabled=0;
    allArticles.forEach(function(a){if(isArticleEnabled(a.strichcode))totalEnabled++;});
    document.getElementById('stats').textContent=totalEnabled+' freigegeben / '+allArticles.length+' Artikel';
  }

  // ── Save changes ──
  function saveChanges(){
    var keys=Object.keys(pendingChanges);
    if(!keys.length){toast('Keine Änderungen');return;}
    var enableItems=[];
    var disableItems=[];
    keys.forEach(function(sc){
      var p=pendingChanges[sc];
      if(p.action==='disable'){
        disableItems.push(sc);
      } else {
        var item={
          strichcode:sc,
          aktiv:true,
          gueltig_bis:p.gueltig_bis||null,
          warengruppe:p.warengruppe||'',
          bezeichnung:p.bezeichnung||'',
          edeka_nr:p.edeka_nr||''
        };
        if(p.kurzfristig!==undefined) item.kurzfristig=p.kurzfristig;
        enableItems.push(item);
      }
    });
    var btn=document.getElementById('btn-save');
    btn.textContent='Speichert…';btn.disabled=true;
    var promises=[];
    if(enableItems.length){
      promises.push(fetch(API+'/shop-freigabe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:enableItems})}));
    }
    disableItems.forEach(function(sc){
      promises.push(fetch(API+'/shop-freigabe?strichcode='+encodeURIComponent(sc),{method:'DELETE'}));
    });
    Promise.all(promises).then(function(){
      toast(keys.length+' Änderung(en) gespeichert');
      btn.disabled=false;
      loadData();
    }).catch(function(e){
      toast('Fehler: '+e.message);
      btn.disabled=false;
      updateSaveBtn();
    });
  }

  // ── Image dialog ──
  function openImageDialog(sc){
    imgStrichcode=sc;
    imgFileData=null;
    var art=allArticles.find(function(a){return a.strichcode===sc;});
    document.getElementById('img-title').textContent='Bild: '+(art?art.bezeichnung:sc);
    document.getElementById('img-preview').style.display='none';
    document.getElementById('img-upload').style.display='none';
    document.getElementById('img-delete').style.display='none';
    document.getElementById('img-file').value='';
    // Show existing image from cache
    var prev=document.getElementById('img-preview');
    if(imgCache[sc]){
      prev.src=imgCache[sc];
      prev.style.display='block';
      document.getElementById('img-delete').style.display='inline-flex';
    } else {
      prev.style.display='none';
    }
    document.getElementById('img-overlay').classList.add('show');
  }

  function closeImageDialog(){
    document.getElementById('img-overlay').classList.remove('show');
    imgStrichcode='';imgFileData=null;
  }

  function compressImage(base64Str,maxWidth,maxHeight,callback){
    if(!base64Str){callback('');return;}
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      var scale=Math.min(maxWidth/w,maxHeight/h,1);
      var canvas=document.createElement('canvas');
      canvas.width=Math.round(w*scale);
      canvas.height=Math.round(h*scale);
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      var isPng=base64Str.indexOf('data:image/png')===0;
      var compressed=isPng?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',0.75);
      callback(compressed);
    };
    img.onerror=function(){callback(base64Str);};
    img.src=base64Str;
  }

  function handleImageFile(file){
    if(!file||!file.type.startsWith('image/')) return;
    var reader=new FileReader();
    reader.onload=function(e){
      compressImage(e.target.result,500,500,function(compressedB64){
        imgFileData=compressedB64;
        var prev=document.getElementById('img-preview');
        prev.src=imgFileData;
        prev.style.display='block';
        document.getElementById('img-upload').style.display='inline-flex';
      });
    };
    reader.readAsDataURL(file);
  }

  function uploadImage(){
    if(!imgFileData||!imgStrichcode) return;
    var sc=imgStrichcode;
    var data=imgFileData;
    var btn=document.getElementById('img-upload');
    btn.disabled=true;
    btn.textContent='Lädt…';
    // Upload to werbebilder API (stores in SharePoint StrichcodeBilder folder)
    fetch(API+'/werbebilder',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({dl_artikelnummer:sc,dl_bild_base64:data})
    }).then(function(r){
      return r.json().then(function(res){return {ok:r.ok,status:r.status,res:res};});
    }).then(function(out){
      var res=out.res||{};
      if(res.success){
        imgCache[sc]=data;
        imgRequested[sc]=true;
        toast('Bild gespeichert');
        closeImageDialog();
        // Update the thumbnail in the list
        var imgEl=document.querySelector('[data-img-sc="'+sc+'"]')||document.getElementById('fimg-'+sc);
        if(imgEl){
          var img=document.createElement('img');
          img.className='art-img';
          img.src=data;
          img.setAttribute('data-img-sc',sc);
          img.title='Bild bearbeiten';
          img.addEventListener('click',function(e){e.stopPropagation();openImageDialog(sc);});
          imgEl.replaceWith(img);
        }
      } else {
        toast('Fehler: '+(res.error||('HTTP '+out.status)));
      }
      btn.disabled=false;
      btn.textContent='Hochladen';
    }).catch(function(e){
      toast('Fehler: '+e.message);
      btn.disabled=false;
      btn.textContent='Hochladen';
    });
  }

  // ── Load images from SharePoint via werbebilder API ──
  var imgLoadRun=0;
  function loadImages(articles){
    var runId=++imgLoadRun;
    var toLoad=[];
    articles.forEach(function(a){
      if(imgCache[a.strichcode]) return;
      toLoad.push({artikelnummer:a.strichcode,edeka_nr:'',strichcode:a.strichcode});
    });
    if(!toLoad.length) return;
    ShopImages.loadBatch(toLoad,{
      apiBase:API,
      batchSize:20,
      cacheKey:function(info){return info.strichcode;},
      runCheck:function(){return runId===imgLoadRun;},
      onImage:function(sc,src){
        imgCache[sc]=src;
        var el=document.getElementById('fimg-'+sc);
        if(el){
          var img=document.createElement('img');
          img.className='art-img';
          img.src=src;
          img.setAttribute('data-img-sc',sc);
          img.title='Bild bearbeiten';
          img.addEventListener('click',function(e){e.stopPropagation();openImageDialog(sc);});
          el.replaceWith(img);
        }
      }
    });
  }

  // ── Event listeners ──
  document.getElementById('btn-save').addEventListener('click',saveChanges);
  var searchInput=document.getElementById('search');
  var searchClear=document.getElementById('search-clear');
  searchInput.addEventListener('input',function(){
    searchTerm=this.value.trim();
    searchClear.style.display=searchTerm?'block':'none';
    render();
  });
  searchClear.addEventListener('click',function(){
    searchInput.value='';searchTerm='';searchClear.style.display='none';render();searchInput.focus();
  });
  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      activeFilter=btn.getAttribute('data-filter');
      document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      render();
    });
  });

  // Image dialog events
  document.getElementById('img-cancel').addEventListener('click',closeImageDialog);
  document.getElementById('img-overlay').addEventListener('click',function(e){if(e.target===this)closeImageDialog();});
  document.getElementById('img-upload').addEventListener('click',uploadImage);
  var dropZone=document.getElementById('img-drop');
  var fileInput=document.getElementById('img-file');
  dropZone.addEventListener('click',function(){fileInput.click();});
  fileInput.addEventListener('change',function(){if(this.files[0])handleImageFile(this.files[0]);});
  dropZone.addEventListener('dragover',function(e){e.preventDefault();dropZone.classList.add('drag');});
  dropZone.addEventListener('dragleave',function(){dropZone.classList.remove('drag');});
  dropZone.addEventListener('drop',function(e){e.preventDefault();dropZone.classList.remove('drag');if(e.dataTransfer.files[0])handleImageFile(e.dataTransfer.files[0]);});

  // Batch actions
  document.getElementById('batch-enable').addEventListener('click',function(){
    document.querySelectorAll('.art-cb:not(:checked)').forEach(function(cb){
      if(cb.offsetParent!==null){cb.checked=true;cb.dispatchEvent(new Event('change'));}
    });
  });
  document.getElementById('batch-disable').addEventListener('click',function(){
    document.querySelectorAll('.art-cb:checked').forEach(function(cb){
      if(cb.offsetParent!==null){cb.checked=false;cb.dispatchEvent(new Event('change'));}
    });
  });

  // ── Init ──
  loadData();
})();
</script>
</body>
</html>
