<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestellstatus – Dorfladen Oberornau</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2d5016">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <meta property="og:title" content="📋 Bestellstatus – Dorfladen Oberornau">
  <meta property="og:description" content="Den aktuellen Status deiner Bestellung beim Dorfladen einsehen.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://kind-pebble-072605b03.7.azurestaticapps.net/images/icon-512.png">
  <meta property="og:site_name" content="Dorfladen Oberornau">
  <meta property="og:locale" content="de_DE">
  <style>
    :root{--c-pri:#2d5016;--c-green:#2e7d4f;--c-green-light:#dcfce7;--c-red:#dc2626;--c-orange:#e65100;--c-bg:#f5f0eb;--c-card:#fff;--c-text:#2c2c2c;--c-muted:#6b7280;--radius:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--c-bg);color:var(--c-text);min-height:100vh}

    .bs-header{background:linear-gradient(135deg,#2d5016 0%,#3a6b1e 100%);color:#fff;padding:20px 20px 28px;text-align:center}
    .bs-header h1{font-size:20px;font-weight:800;margin-bottom:4px}
    .bs-header p{font-size:13px;opacity:.8}
    .bs-logo{width:48px;height:48px;margin:0 auto 10px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:24px}

    .bs-container{max-width:480px;margin:-16px auto 0;padding:0 16px 40px;position:relative}

    .bs-card{background:var(--c-card);border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,.08);padding:24px;margin-bottom:16px}
    .bs-card h2{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}

    /* Status badge */
    .bs-status{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:700}
    .bs-status.st-0{background:#fef3c7;color:#92400e}
    .bs-status.st-1{background:var(--c-green-light);color:var(--c-green)}
    .bs-status.st-2{background:#fecaca;color:#991b1b}
    .bs-status.st-3{background:#e0e7ff;color:#3730a3}

    .bs-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6}
    .bs-row:last-child{border-bottom:none}
    .bs-row .bs-label{font-size:13px;color:var(--c-muted);font-weight:600}
    .bs-row .bs-value{font-size:15px;font-weight:700;text-align:right;max-width:60%}

    .bs-msg{background:#f0fdf4;border-radius:12px;padding:14px 16px;margin-top:12px;border-left:4px solid var(--c-green)}
    .bs-msg.warn{background:#fef2f2;border-left-color:var(--c-red)}
    .bs-msg .bs-msg-label{font-size:11px;font-weight:700;color:var(--c-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
    .bs-msg .bs-msg-text{font-size:14px;line-height:1.5}

    .bs-comment-box{margin-top:16px}
    .bs-comment-box label{font-size:13px;font-weight:700;color:var(--c-muted);display:block;margin-bottom:6px}
    .bs-comment-box textarea{width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:12px;font-size:15px;font-family:inherit;resize:none;min-height:80px;outline:none;transition:border-color .15s;overflow:hidden}
    .bs-comment-box textarea:focus{border-color:var(--c-green)}
    .bs-comment-box button{margin-top:10px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--c-green);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
    .bs-comment-box button:active{transform:scale(.98);opacity:.9}
    .bs-comment-box button:disabled{opacity:.5;cursor:default}
    .bs-comment-sent{color:var(--c-green);font-size:13px;font-weight:700;margin-top:8px;display:none}

    .bs-login{text-align:center}
    .bs-login label{font-size:13px;font-weight:700;color:var(--c-muted);display:block;margin-bottom:6px;text-align:left}
    .bs-login input{width:100%;padding:14px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:16px;font-family:inherit;outline:none;margin-bottom:12px;transition:border-color .15s}
    .bs-login input:focus{border-color:var(--c-green)}
    .bs-login button{width:100%;padding:14px;border:none;border-radius:12px;background:var(--c-green);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    .bs-login button:active{transform:scale(.98)}
    .bs-error{color:var(--c-red);font-size:13px;font-weight:600;margin-top:8px;display:none}

    .bs-empty{text-align:center;padding:40px 20px;color:var(--c-muted)}
    .bs-empty-icon{font-size:48px;margin-bottom:12px}

    .bs-link{display:block;text-align:center;margin-top:16px;color:var(--c-green);font-size:14px;font-weight:600;text-decoration:none}
    .bs-link:hover{text-decoration:underline}

    .bs-timeline{display:flex;gap:4px;align-items:center;margin-top:10px;flex-wrap:wrap}
    .bs-tl-item{display:flex;align-items:center;gap:4px}
    .bs-tl-item:not(:last-child)::after{content:'›';color:#d1d5db;font-size:14px;font-weight:700;margin-left:4px}
    .bs-tl-dot{width:10px;height:10px;border-radius:50%;border:2px solid #e5e7eb;background:#fff;flex-shrink:0}
    .bs-tl-item.done .bs-tl-dot{background:var(--c-green);border-color:var(--c-green)}
    .bs-tl-item.active .bs-tl-dot{background:#3b82f6;border-color:#3b82f6}
    .bs-tl-item.cancelled .bs-tl-dot{background:var(--c-red);border-color:var(--c-red)}
    .bs-tl-label{font-size:12px;font-weight:600;color:var(--c-muted)}
    .bs-tl-item.done .bs-tl-label{color:var(--c-green)}
    .bs-tl-item.active .bs-tl-label{color:#3b82f6}
    .bs-tl-item.cancelled .bs-tl-label{color:var(--c-red)}
    .bs-tl-time{font-size:11px;color:var(--c-muted)}

    @media(max-width:480px){
      .bs-container{padding:0 12px 30px}
      .bs-card{padding:18px}
    }
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="bs-header" style="position:relative">
    <a href="javascript:void(0)" onclick="history.length>1?history.back():location.href='/'" style="position:absolute;top:12px;right:12px;color:rgba(255,255,255,.8);text-decoration:none;font-size:28px;line-height:1;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.12)" title="Schließen">✕</a>
    <div class="bs-logo"><i data-lucide="store" style="width:28px;height:28px"></i></div>
    <h1>Dorfladen Oberornau</h1>
    <p>Bestellstatus</p>
  </div>

  <div class="bs-container">
    <!-- Login/Lookup form (shown when no order loaded) -->
    <div class="bs-card" id="bs-login-card">
      <h2><i data-lucide="clipboard-list" style="width:20px;height:20px"></i> Bestellung aufrufen</h2>
      <div class="bs-login">
        <label for="bs-nr">Bestellnummer</label>
        <input type="text" id="bs-nr" placeholder="z.B. MT-260621-BF0D4 oder FM-..." autocomplete="off" oninput="bsUpdateAuthField()">
        <div id="bs-auth-email-wrap">
          <label for="bs-email">E-Mail-Adresse</label>
          <input type="email" id="bs-email" placeholder="ihre@email.de" autocomplete="email">
        </div>
        <div id="bs-auth-telefon-wrap" style="display:none">
          <label for="bs-telefon">Telefonnummer</label>
          <input type="tel" id="bs-telefon" placeholder="z.B. 0171 1234567" autocomplete="tel">
        </div>
        <button onclick="lookupOrder()">Bestellung anzeigen</button>
        <div class="bs-error" id="bs-login-error"></div>
      </div>
    </div>

    <!-- Order detail (hidden until loaded) -->
    <div id="bs-detail" style="display:none">
      <div class="bs-card">
        <h2><i data-lucide="utensils" style="width:20px;height:20px"></i> <span id="bs-gericht">–</span></h2>
        <div id="bs-status-row" style="text-align:center;margin-bottom:16px"></div>
        <div id="bs-info-rows"></div>
      </div>

      <!-- Cancel button (only for Fleisch orders in status Neu) -->
      <div class="bs-card" id="bs-cancel-card" style="display:none;text-align:center">
        <button id="bs-cancel-btn" onclick="cancelOrder()" style="background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5;padding:12px 28px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:6px"><i data-lucide="x-circle" style="width:16px;height:16px"></i> Bestellung stornieren</button>
        <p style="font-size:12px;color:#9ca3af;margin-top:8px">M&ouml;glich, solange die Bestellung noch nicht best&auml;tigt wurde.</p>
      </div>

      <!-- Messages from staff -->
      <div class="bs-card" id="bs-messages-card" style="display:none">
        <h2><i data-lucide="message-circle" style="width:20px;height:20px"></i> Nachrichten</h2>
        <div id="bs-messages"></div>
      </div>

      <!-- Customer comment -->
      <div class="bs-card" id="bs-comment-card">
        <h2><i data-lucide="pencil" style="width:20px;height:20px"></i> Nachricht an den Dorfladen</h2>
        <div class="bs-comment-box">
          <textarea id="bs-comment" placeholder="Haben Sie eine Frage oder Anmerkung?" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
          <button id="bs-comment-btn" onclick="sendComment()">Nachricht senden</button>
          <div class="bs-comment-sent" id="bs-comment-sent"><i data-lucide="check-circle" style="width:14px;height:14px;vertical-align:middle"></i> Nachricht gesendet!</div>
        </div>
      </div>

      <a href="javascript:void(0)" onclick="history.length>1?history.back():location.href='/'" class="bs-link"><i data-lucide="arrow-left" style="width:14px;height:14px;vertical-align:middle"></i> Zurück</a>
    </div>
  </div>

<script>
var _order = null;
var _orderType = 'mt'; // 'mt' or 'fm'

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

function getParam(name){
  var url = new URL(window.location.href);
  return url.searchParams.get(name) || '';
}

function isFleisch(nr){ return (nr||'').toUpperCase().indexOf('FM-')===0; }

// Toggle auth field based on order number prefix
function bsUpdateAuthField(){
  var nr = document.getElementById('bs-nr').value.trim();
  var fm = isFleisch(nr);
  document.getElementById('bs-auth-email-wrap').style.display = fm ? 'none' : '';
  document.getElementById('bs-auth-telefon-wrap').style.display = fm ? '' : 'none';
}

function lookupOrder(){
  var nr = document.getElementById('bs-nr').value.trim();
  var errEl = document.getElementById('bs-login-error');
  errEl.style.display = 'none';

  var fm = isFleisch(nr);
  _orderType = fm ? 'fm' : 'mt';

  if(fm){
    var telefon = document.getElementById('bs-telefon').value.trim();
    if(!nr || !telefon){
      errEl.textContent = 'Bitte Bestellnummer und Telefonnummer eingeben.';
      errEl.style.display = 'block';
      return;
    }
    try{ localStorage.setItem('fm_nr', nr); localStorage.setItem('fm_telefon', telefon); }catch(e){}
    var apiUrl = '/api/fleisch-order?nr='+encodeURIComponent(nr)+'&telefon='+encodeURIComponent(telefon);
  } else {
    var email = document.getElementById('bs-email').value.trim().toLowerCase();
    if(!nr || !email){
      errEl.textContent = 'Bitte Bestellnummer und E-Mail eingeben.';
      errEl.style.display = 'block';
      return;
    }
    try{ localStorage.setItem('bs_email', email); localStorage.setItem('bs_nr', nr); }catch(e){}
    var apiUrl = '/api/lunch-order?nr='+encodeURIComponent(nr)+'&email='+encodeURIComponent(email);
  }

  fetch(apiUrl)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.success){
        errEl.textContent = 'Bestellung nicht gefunden. Bitte Eingaben prüfen.';
        errEl.style.display = 'block';
        return;
      }
      // FM returns .bestellung, MT returns .order
      _order = data.bestellung || data.order;
      if(!_order){
        errEl.textContent = 'Bestellung nicht gefunden.';
        errEl.style.display = 'block';
        return;
      }
      if(fm) renderFleischOrder(_order); else renderOrder(_order);
    })
    .catch(function(e){
      errEl.textContent = 'Fehler: ' + e.message;
      errEl.style.display = 'block';
    });
}

// ── Timeline helper ──
function buildTimeline(steps, stepIdx, isCancelled){
  var h='<div class="bs-timeline">';
  if(isCancelled){
    h+='<div class="bs-tl-item cancelled"><div class="bs-tl-dot"></div><div class="bs-tl-label">❌ Storniert</div></div>';
  } else {
    for(var i=0;i<steps.length;i++){
      var cls=stepIdx>i?'done':stepIdx===i?'active':'';
      h+='<div class="bs-tl-item '+cls+'"><div class="bs-tl-dot"></div>';
      h+='<div class="bs-tl-label">'+(cls?steps[i].icon+' ':'')+steps[i].label+'</div>';
      h+='</div>';
    }
  }
  h+='</div>';
  return h;
}

// ── Mittagstisch rendering ──
var STATUS_LABELS = {0:'Eingegangen',1:'Bestätigt',2:'Storniert',3:'Abgeholt'};
var STATUS_ICONS = {0:'⏳',1:'✅',2:'❌',3:'📦'};
var MT_STEPS=[{icon:'<i data-lucide="clock" style="width:13px;height:13px;vertical-align:middle"></i>',label:'Eingegangen'},{icon:'<i data-lucide="check-circle" style="width:13px;height:13px;vertical-align:middle"></i>',label:'Bestätigt'},{icon:'<i data-lucide="package" style="width:13px;height:13px;vertical-align:middle"></i>',label:'Abgeholt'}];

function renderOrder(o){
  document.getElementById('bs-login-card').style.display = 'none';
  document.getElementById('bs-detail').style.display = 'block';

  document.getElementById('bs-gericht').textContent = o.gericht || '–';

  // Map MT status to timeline step: 0→0, 1→1, 3→2; 2=Storniert
  var mtTlMap={0:0,1:1,3:2};
  var tlIdx=mtTlMap[o.status]!=null?mtTlMap[o.status]:0;
  document.getElementById('bs-status-row').innerHTML = buildTimeline(MT_STEPS, tlIdx, o.status===2);

  var rows = '';
  rows += '<div class="bs-row"><span class="bs-label">Bestellnummer</span><span class="bs-value">'+esc(o.bestellnummer)+'</span></div>';
  rows += '<div class="bs-row"><span class="bs-label">Menge</span><span class="bs-value">'+o.menge+' Portion'+(o.menge>1?'en':'')+'</span></div>';
  rows += '<div class="bs-row"><span class="bs-label">Preis</span><span class="bs-value">'+(o.preis||0).toFixed(2).replace('.',',')+' €</span></div>';
  if(o.datum){
    var dp = o.datum.split('-');
    rows += '<div class="bs-row"><span class="bs-label">Datum</span><span class="bs-value">'+dp[2]+'.'+dp[1]+'.'+dp[0]+'</span></div>';
  }
  if(o.mitnehmen) rows += '<div class="bs-row"><span class="bs-label">Art</span><span class="bs-value">📦 Zum Mitnehmen</span></div>';
  if(o.anmerkung) rows += '<div class="bs-row"><span class="bs-label">Ihre Anmerkung</span><span class="bs-value">'+esc(o.anmerkung)+'</span></div>';
  document.getElementById('bs-info-rows').innerHTML = rows;

  renderMessages(o);
  // Show cancel button for Eingegangen (0) MT orders
  document.getElementById('bs-cancel-card').style.display = (o.status === 0 && _orderType === 'mt') ? '' : 'none';
  if(o.status === 2 || o.status === 3) document.getElementById('bs-comment-card').style.display = 'none';
  if(window.lucide) lucide.createIcons();
}

// ── Fleisch rendering ──
var FM_STATUS_LABELS = {0:'Neu',1:'Bestätigt',2:'Bestätigt',3:'Abgeholt',4:'Storniert'};
var FM_STATUS_ICONS = {0:'⏳',1:'✔️',2:'✅',3:'📦',4:'❌'};
var FM_STATUS_CLASS = {0:'st-0',1:'st-3',2:'st-1',3:'st-1',4:'st-2'};
var FM_STEPS=[{icon:'<i data-lucide="clock" style="width:13px;height:13px;vertical-align:middle"></i>',label:'Neu'},{icon:'<i data-lucide="shopping-cart" style="width:13px;height:13px;vertical-align:middle"></i>',label:'In Bestellung'},{icon:'<i data-lucide="check-circle" style="width:13px;height:13px;vertical-align:middle"></i>',label:'Eingetroffen'},{icon:'<i data-lucide="package" style="width:13px;height:13px;vertical-align:middle"></i>',label:'Abgeholt'}];

function fmtP(v){ return (v||0).toFixed(2).replace('.',','); }

function renderFleischOrder(o){
  document.getElementById('bs-login-card').style.display = 'none';
  document.getElementById('bs-detail').style.display = 'block';

  document.getElementById('bs-gericht').innerHTML = '<i data-lucide="beef" style="width:18px;height:18px;vertical-align:middle"></i> Fleisch-Vorbestellung';

  var st = o.status||0;
  // FM status 0-3 map directly to step index, 4=Storniert
  document.getElementById('bs-status-row').innerHTML = buildTimeline(FM_STEPS, st>3?0:st, st===4);

  var rows = '';
  rows += '<div class="bs-row"><span class="bs-label">Bestellnummer</span><span class="bs-value">'+esc(o.bestellnummer)+'</span></div>';
  if(o.liefertag){
    var lp = o.liefertag.split('-');
    rows += '<div class="bs-row"><span class="bs-label">Liefertag</span><span class="bs-value">'+lp[2]+'.'+lp[1]+'.'+lp[0]+'</span></div>';
  }
  rows += '<div class="bs-row"><span class="bs-label">Name</span><span class="bs-value">'+esc(o.name)+'</span></div>';

  // Positionen
  var pos = o.positionen||[];
  if(pos.length){
    rows += '<div style="margin-top:12px;padding-top:8px;border-top:2px solid #f3f4f6">';
    rows += '<div style="font-size:13px;font-weight:700;color:var(--c-muted);margin-bottom:8px">Positionen</div>';
    pos.forEach(function(p){
      var preis = p.rabattpreis || (p.menge_kg * p.preis_kg);
      rows += '<div class="bs-row"><span class="bs-label">'+esc(p.bezeichnung)+' ('+p.menge_kg.toFixed(1).replace('.',',')+' kg)</span><span class="bs-value">'+fmtP(preis)+' €</span></div>';
    });
    rows += '</div>';
  }

  if(o.rabatt_summe > 0){
    rows += '<div class="bs-row" style="color:#2e7d4f;font-weight:600"><span class="bs-label">Ersparnis</span><span class="bs-value">-'+fmtP(o.rabatt_summe)+' €</span></div>';
  }
  rows += '<div class="bs-row" style="font-weight:700;font-size:15px"><span class="bs-label">Gesamt</span><span class="bs-value">'+fmtP(o.gesamtsumme)+' €</span></div>';

  if(o.anmerkung) rows += '<div class="bs-row"><span class="bs-label">Anmerkung</span><span class="bs-value">'+esc(o.anmerkung)+'</span></div>';
  rows += '<div style="margin-top:8px;font-size:12px;color:var(--c-muted)">Bezahlung: Bar bei Abholung im Laden</div>';
  document.getElementById('bs-info-rows').innerHTML = rows;

  renderMessages(o);
  // Show cancel button only for status Neu (0)
  document.getElementById('bs-cancel-card').style.display = (st === 0 && _orderType === 'fm') ? '' : 'none';
  // Hide comment for terminal states
  if(st === 3 || st === 4) document.getElementById('bs-comment-card').style.display = 'none';
  if(window.lucide) lucide.createIcons();
}

// ── Messages (shared) ──
function renderMessages(o){
  var msgHtml = '';
  var hasMessages = false;
  if(o.bestaetigung_text){
    hasMessages = true;
    var cls = (o.status===2 || o.status===4) ? 'bs-msg warn' : 'bs-msg';
    msgHtml += '<div class="'+cls+'"><div class="bs-msg-label">Dorfladen</div><div class="bs-msg-text">'+esc(o.bestaetigung_text)+'</div></div>';
  }
  if(o.personal_antwort){
    hasMessages = true;
    msgHtml += '<div class="bs-msg" style="margin-top:8px"><div class="bs-msg-label"><i data-lucide="message-circle" style="width:12px;height:12px;vertical-align:middle"></i> Antwort vom Dorfladen</div><div class="bs-msg-text">'+esc(o.personal_antwort)+'</div></div>';
  }
  if(o.kunde_kommentar){
    hasMessages = true;
    msgHtml += '<div class="bs-msg" style="margin-top:8px;background:#eff6ff;border-left-color:#3b82f6"><div class="bs-msg-label">Ihre Nachricht</div><div class="bs-msg-text">'+esc(o.kunde_kommentar)+'</div></div>';
  }
  if(hasMessages){
    document.getElementById('bs-messages-card').style.display = '';
    document.getElementById('bs-messages').innerHTML = msgHtml;
  }
}

// ── Cancel Order (customer self-service) ──
function cancelOrder(){
  if(!_order) return;
  var grund = prompt('Möchten Sie diese Bestellung wirklich stornieren?\n\nBitte geben Sie einen Grund an:');
  if(grund === null) return;
  if(!grund.trim()){ alert('Bitte geben Sie einen Stornierungsgrund an.'); return; }

  var btn = document.getElementById('bs-cancel-btn');
  btn.disabled = true;
  btn.textContent = 'Wird storniert…';

  var apiUrl, payload;
  if(_orderType === 'fm'){
    apiUrl = '/api/fleisch-order';
    payload = {id: _order.id, status: 4, kunde_storno: true, storno_grund: 'Kundengrund: ' + grund.trim()};
  } else {
    apiUrl = '/api/lunch-order/' + _order.id;
    payload = {status: 2, kunde_storno: true, storno_grund: 'Kundengrund: ' + grund.trim()};
  }

  fetch(apiUrl, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(data.success){
      btn.innerHTML = '<i data-lucide="check-circle" style="width:16px;height:16px"></i> Storniert';
      if(window.lucide) lucide.createIcons();
      btn.style.background = '#d1fae5';
      btn.style.color = '#065f46';
      btn.style.borderColor = '#6ee7b7';
      setTimeout(function(){ lookupOrder(); }, 1500);
    } else {
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="x-circle" style="width:16px;height:16px"></i> Bestellung stornieren';
      if(window.lucide) lucide.createIcons();
      alert(data.error || 'Stornierung fehlgeschlagen');
    }
  })
  .catch(function(e){
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="x-circle" style="width:16px;height:16px"></i> Bestellung stornieren';
    if(window.lucide) lucide.createIcons();
    alert('Fehler: ' + e.message);
  });
}

// ── Send Comment ──
function sendComment(){
  if(!_order) return;
  var text = document.getElementById('bs-comment').value.trim();
  if(!text){
    alert('Bitte geben Sie eine Nachricht ein.');
    return;
  }

  var btn = document.getElementById('bs-comment-btn');
  btn.disabled = true;
  btn.textContent = 'Wird gesendet…';

  var apiBase = _orderType === 'fm' ? '/api/fleisch-order' : '/api/lunch-order';
  var body = _orderType === 'fm'
    ? {id: _order.id, kunde_kommentar: text}
    : {kunde_kommentar: text};
  var fetchUrl = _orderType === 'fm' ? apiBase : apiBase + '/' + _order.id;

  fetch(fetchUrl, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    btn.disabled = false;
    btn.textContent = 'Nachricht senden';
    if(data.success){
      document.getElementById('bs-comment').value = '';
      document.getElementById('bs-comment-sent').style.display = 'block';
      setTimeout(function(){ document.getElementById('bs-comment-sent').style.display = 'none'; }, 4000);
      lookupOrder();
    } else {
      alert('Fehler: ' + (data.error || 'Konnte nicht gesendet werden'));
    }
  })
  .catch(function(e){
    btn.disabled = false;
    btn.textContent = 'Nachricht senden';
    alert('Fehler: ' + e.message);
  });
}

// ── Auto-load ──
(function(){
  var nr = getParam('nr');

  // FM: try telefon from params or localStorage
  if(isFleisch(nr)){
    var telefon = getParam('telefon');
    if(!telefon){ try{ telefon = localStorage.getItem('fm_telefon')||''; }catch(e){} }
    if(nr) document.getElementById('bs-nr').value = nr;
    if(telefon) document.getElementById('bs-telefon').value = telefon;
    bsUpdateAuthField();
    if(nr && telefon) lookupOrder();
    return;
  }

  // MT: try email from params or localStorage
  var email = getParam('email');
  if(!nr || !email){
    try{
      nr = nr || localStorage.getItem('bs_nr') || '';
      email = email || localStorage.getItem('bs_email') || '';
    }catch(e){}
  }

  if(nr) document.getElementById('bs-nr').value = nr;
  if(email) document.getElementById('bs-email').value = email;
  bsUpdateAuthField();
  if(nr && email) lookupOrder();
})();
</script>
