<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilder – Dorfladen Oberornau</title>
<link rel="stylesheet" href="/css/mockup.css">
</head>
<body>
<div id="mockup-header"></div>

<div class="m-page-header">
  <h1>📷 Bilder</h1>
  <p>Eindrücke aus dem Dorfladen</p>
</div>

<div class="m-content">
  <div class="m-gallery">
    <div style="background:var(--pri-light);border-radius:var(--radius);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2rem">🏪</div>
    <div style="background:#fff3e0;border-radius:var(--radius);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2rem">🍞</div>
    <div style="background:#e8f5e9;border-radius:var(--radius);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2rem">🥬</div>
    <div style="background:#fce4ec;border-radius:var(--radius);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2rem">🥩</div>
    <div style="background:#e3f2fd;border-radius:var(--radius);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2rem">☕</div>
    <div style="background:#fff8e1;border-radius:var(--radius);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2rem">📦</div>
  </div>
  <p style="font-size:.82rem;color:var(--text-sec);text-align:center;margin-top:12px">Platzhalter – echte Bilder werden aus der Galerie geladen</p>
</div>

<div id="mockup-footer"></div>
<script src="/js/mockup-shared.js"></script>
<script>initMockupPage('bilder');</script>
</body>
</html>
