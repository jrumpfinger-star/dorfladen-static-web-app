" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8" text-anchor="start">dorfladen-oberornau.de</text><text x="20" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8" text-anchor="start">So heißt das Symbol später auf</text><text x="20" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8" text-anchor="start">Ihrem Startbildschirm. Der Name</text><text x="20" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8" text-anchor="start">lässt sich hier noch ändern.</text><text x="150.0" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#dc2626" font-weight="600" text-anchor="middle">Oben rechts auf „Hinzufügen“ tippen</text></svg>