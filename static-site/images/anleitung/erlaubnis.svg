<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Die Nachfrage des Browsers, ob Benachrichtigungen erlaubt sind"><title>Die Nachfrage des Browsers, ob Benachrichtigungen erlaubt sind</title><rect x="4" y="4" width="292" height="292" rx="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><rect x="26" y="30" width="44" height="44" rx="12" fill="#e8f0e3" stroke="#e8f0e3" stroke-width="0"/><g transform="translate(37,41)" fill="none" stroke="#2d5016" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a6 6 0 0 0-6 6v4l-2 3h16l-2-3v-4a6 6 0 0 0-6-6z"/><path d="M9 20a2 2 0 0 0 4 0"/></g><text x="84" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#1f2937" font-weight="600" text-anchor="start">dorfladen-oberornau.de</text><text x="84" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8" text-anchor="start">möchte Ihnen Mitteilungen senden</text><rect x="26" y="108" width="248" height="60" rx="10" fill="#f1f5f9" stroke="#f1f5f9" stroke-width="0"/><text x="40" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8" text-anchor="start">Sie können jederzeit einzeln</text><text x="40" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#94a3b8" text-anchor="start">festlegen, was Sie bekommen.</text><text x="78" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Nicht erlauben</text><rect x="160" y="194" width="110" height="34" rx="17" fill="#2d5016" stroke="#2d5016" stroke-width="0"/><text x="215" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Erlauben</text><circle cx="215" cy="