<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── ALTERNATIVE 7: THE ORGANIC BRANCH / BOUQUET ── -->
  <!-- Ein natürlicher Zweig mit 5 Blättern. Symbolisiert Frische, Ernte und Natur. -->
  <!-- Extrem gut lesbare, massive Typografie. -->

  <!-- ── ORGANISCHER ZWEIG MIT 5 BLÄTTERN ── -->
  <g transform="translate(15, 0)">
    <!-- Der geschwungene Zweig/Ast -->
    <path d="M 12 75 C 32 65, 48 35, 62 10" fill="none" stroke="#123026" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Blatt 1 (unten links) -->
    <path d="M 22 65 C 10 65, 4 50, 16 42 C 24 45, 26 58, 22 65 Z" fill="#1e463a" />
    
    <!-- Blatt 2 (unten rechts) -->
    <path d="M 36 55 C 48 58, 54 45, 42 35 C 34 38, 32 50, 36 55 Z" fill="#5ea88a" />
    
    <!-- Blatt 3 (Mitte links) -->
    <path d="M 38 40 C 26 40, 20 25, 32 17 C 40 20, 42 33, 38 40 Z" fill="#1e463a" />
    
    <!-- Blatt 4 (Mitte rechts) -->
    <path d="M 52 30 C 64 32, 70 18, 58 10 C 50 12, 48 25, 52 30 Z" fill="#5ea88a" />
    
    <!-- Blatt 5 (Spitzenblatt, oben) -->
    <path d="M 62 10 C 58 -2, 48 -4, 46 8 C 50 14, 58 14, 62 10 Z" fill="#3d7e6a" />
  </g>

  <!-- ── TYPOGRAFIE (Hervorragende Fernwirkung & Lesbarkeit) ── -->
  <g transform="translate(112, 0)">
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#11291f" 
          letter-spacing="0.5">DORFLADEN</text>
          
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#bd8b5c" 
          letter-spacing="4">OBERORNAU</text>
  </g>
</svg>
