<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── REBUILD 1: THE MODERN GOLDEN-SAGE SEAL (Inspiration Image 2 / Option 2) ── -->
  <!-- Runder, edler Siegel-Rahmen mit nach oben wachsenden Blütenblättern. -->
  <!-- Extrem lesbarer, warmer Champagner-Text auf dunklem Grund. -->

  <defs>
    <!-- Premium Verläufe -->
    <linearGradient id="sealGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd8b5c" />
      <stop offset="100%" stop-color="#e0b880" />
    </linearGradient>
    <linearGradient id="sealGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d7e6a" />
      <stop offset="100%" stop-color="#5ea88a" />
    </linearGradient>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ── DAS GOLD-SIEGEL (Zentrum bei x=48, y=45) ── -->
  <g transform="translate(10, 0)" filter="url(#sealShadow)">
    <g transform="translate(48, 45)">
      <!-- Äußerer goldener Kreisring -->
      <circle cx="0" cy="0" r="35" fill="none" stroke="url(#sealGold)" stroke-width="2" />
      
      <!-- Innerer dünner Zier-Kreis -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#faf6f0" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4" />
      
      <!-- Blütenblätter wachsen organisch nach oben (Kein Propeller!) -->
      <!-- Mittleres Blatt (aufrecht) -->
      <path d="M 0 5 C -5 -8, -5 -22, 0 -25 C 5 -22, 5 -8, 0 5 Z" fill="url(#sealGold)" />
      
      <!-- Linke Blätter -->
      <path d="M -2 8 C -12 0, -15 -12, -8 -18 C -2 -14, -2 -2, -2 8 Z" fill="url(#sealGreen)" />
      <path d="M -3 14 C -18 10, -20 0, -12 -5 C -6 -4, -4 4, -3 14 Z" fill="url(#sealGreen)" opacity="0.8" />
      
      <!-- Rechte Blätter -->
      <path d="M 2 8 C 12 0, 15 -12, 8 -18 C 2 -14, 2 -2, 2 8 Z" fill="url(#sealGreen)" />
      <path d="M 3 14 C 18 10, 20 0, 12 -5 C 6 -4, 4 4, 3 14 Z" fill="url(#sealGreen)" opacity="0.8" />

      <!-- Kleines Verbindungsherz unten im Siegel -->
      <path d="M 0 16 C -3 12, -5 12, -5 9 C -5 7, -3 6, 0 9 C 3 6, 5 7, 5 9 C 5 12, 3 12, 0 16 Z" fill="url(#sealGold)" />
    </g>
  </g>

  <!-- ── EDLE & EXTREM LESBARE TYPOGRAFIE ── -->
  <g transform="translate(112, 0)">
    <!-- DORFLADEN in warmem, leuchtendem Champagner-Beige -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#faf6f0" 
          letter-spacing="0.5">DORFLADEN</text>
          
    <!-- OBERORNAU in harmonischem Gold -->
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#e0b880" 
          letter-spacing="4">OBERORNAU</text>
  </g>
</svg>
