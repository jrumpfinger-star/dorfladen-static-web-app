<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="100%">
  <!-- ── ALTERNATIVE 5: WARM-ORGANIC TERRA COTTA & SALBEI CONCEPT ── -->
  <!-- Weiche, einladende, handwerkliche Farben. Perfekte Kontraste für kleinste Darstellungen. -->

  <defs>
    <!-- Warmes Terrakotta / Ziegelrot-Verlauf -->
    <linearGradient id="terraGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#993d25" />
      <stop offset="100%" stop-color="#c96d53" />
    </linearGradient>
    
    <!-- Naturverbundener Salbeigrün-Verlauf -->
    <linearGradient id="sageOrganicGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a4d38" />
      <stop offset="100%" stop-color="#4e6e58" />
    </linearGradient>

    <!-- Subtiler Schatten für verbesserte Plastizität und Abhebung -->
    <filter id="cozyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.2" stdDeviation="1.2" flood-color="#231d1b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ── DIE 5 BLÜTENBLÄTTER (Terrakotta & Salbei Wechselspiel) ── -->
  <!-- Platziert links im Koordinatensystem (Zentrum bei x=50, y=45) -->
  <g transform="translate(10, 0)" filter="url(#cozyShadow)">
    <g transform="translate(48, 45)">
      <!-- Blatt 1 (oben) - Salbei -->
      <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" 
            fill="url(#sageOrganicGrad)" />
      
      <!-- Blatt 2 (oben rechts, rotiert um 72°) - Terra Cotta -->
      <g transform="rotate(72)">
        <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" 
              fill="url(#terraGrad)" />
      </g>
      
      <!-- Blatt 3 (unten rechts, rotiert um 144°) - Salbei -->
      <g transform="rotate(144)">
        <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" 
              fill="url(#sageOrganicGrad)" />
      </g>
      
      <!-- Blatt 4 (unten links, rotiert um 216°) - Terra Cotta -->
      <g transform="rotate(216)">
        <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" 
              fill="url(#terraGrad)" />
      </g>
      
      <!-- Blatt 5 (oben links, rotiert um 288°) - Salbei -->
      <g transform="rotate(288)">
        <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" 
              fill="url(#sageOrganicGrad)" />
      </g>
      
      <!-- Weicher Sandfarbener Kern im Zentrum -->
      <circle cx="0" cy="0" r="3.2" fill="#faf9f6" />
    </g>
  </g>

  <!-- ── TYPOGRAFIE (Warmes Espresso-Dunkelbraun für makellose Lesbarkeit) ── -->
  <g transform="translate(118, 0)">
    <!-- Hauptmarke "DORFLADEN" (Bolderer Schriftschnitt in tiefem Espresso) -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="26" 
          font-weight="900" 
          fill="#231d1b" 
          letter-spacing="3.5">DORFLADEN</text>
          
    <!-- "OBERORNAU" (Gleicher Espresso-Farbton für beruhigende Symmetrie und Lesbarkeit) -->
    <text x="1" y="62" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="12" 
          font-weight="750" 
          fill="#c96d53" 
          letter-spacing="5.5">OBERORNAU</text>
  </g>
</svg>
