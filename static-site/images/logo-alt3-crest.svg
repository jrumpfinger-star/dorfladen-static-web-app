<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="100%">
  <!-- ── ALTERNATIVE 3: ORGANIC CREST / SIEGEL CONCEPT ── -->
  <!-- Tradition trifft Moderne. Beständigkeit, Vertrauen und Manufaktur-Charakter. -->

  <defs>
    <!-- Weicher, edler Farbverlauf für das Siegel -->
    <linearGradient id="crestGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123026" />
      <stop offset="100%" stop-color="#2d7a5e" />
    </linearGradient>
  </defs>

  <!-- ── DAS INTEGRATIVE RUNDSiegel ── -->
  <g transform="translate(10, 0)">
    <g transform="translate(48, 45)">
      <!-- Äußerer, feiner Rahmen (Siegel-Ring) -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#bd8b5c" stroke-width="1.8" />
      
      <!-- Innerer, hauchdünner Begrenzungsring -->
      <circle cx="0" cy="0" r="33" fill="none" stroke="#1e463a" stroke-width="0.8" stroke-dasharray="2, 2" opacity="0.6" />
      
      <!-- Die 5 Blütenblätter (Kompakter im Siegel platziert) -->
      <!-- Blatt 1 (oben) -->
      <path d="M 0 0 C -7 -11, -7 -25, 0 -27 C 7 -25, 7 -11, 0 0 Z" 
            fill="url(#crestGrad)" />
      
      <!-- Blatt 2 (rotiert um 72°) -->
      <g transform="rotate(72)">
        <path d="M 0 0 C -7 -11, -7 -25, 0 -27 C 7 -25, 7 -11, 0 0 Z" 
              fill="#bd8b5c" />
      </g>
      
      <!-- Blatt 3 (rotiert um 144°) -->
      <g transform="rotate(144)">
        <path d="M 0 0 C -7 -11, -7 -25, 0 -27 C 7 -25, 7 -11, 0 0 Z" 
              fill="url(#crestGrad)" />
      </g>
      
      <!-- Blatt 4 (rotiert um 216°) -->
      <g transform="rotate(216)">
        <path d="M 0 0 C -7 -11, -7 -25, 0 -27 C 7 -25, 7 -11, 0 0 Z" 
              fill="#bd8b5c" />
      </g>
      
      <!-- Blatt 5 (rotiert um 288°) -->
      <g transform="rotate(288)">
        <path d="M 0 0 C -7 -11, -7 -25, 0 -27 C 7 -25, 7 -11, 0 0 Z" 
              fill="url(#crestGrad)" />
      </g>

      <!-- Heller Zentrumskern -->
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- ── TYPOGRAFIE (Ausbalanciert, edel, stabil) ── -->
  <g transform="translate(118, 0)">
    <!-- Hauptmarke "DORFLADEN" (Breit laufend, extrem wertig) -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="24" 
          font-weight="850" 
          fill="#1e463a" 
          letter-spacing="5">DORFLADEN</text>
          
    <!-- "OBERORNAU" (Als glasklare, edle Ergänzung) -->
    <text x="2" y="61" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
          font-size="11" 
          font-weight="600" 
          fill="#1e463a" 
          letter-spacing="7">OBERORNAU</text>
  </g>
</svg>
