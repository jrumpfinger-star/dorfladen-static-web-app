<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── ALTERNATIVE 10: THE DYNAMIC CHEVRON / WIND OF LEAVES (DARK VERSION) ── -->
  <!-- Ein dynamischer Windstrom aus 5 Blättern, vollkommen kontraststark auf dunklem Grund. -->

  <!-- ── DIE 5 BLÜTENBLÄTTER ALS DYNAMISCHER STRUSTROM ── -->
  <g transform="translate(10, 5)">
    <!-- Blatt 1 (links unten, klein) -->
    <path d="M 12 55 C 6 45, 6 35, 12 30 C 18 35, 18 45, 12 55 Z" fill="#a2dbbe" transform="rotate(-45, 12, 55)" />
    
    <!-- Blatt 2 (Mitte links) -->
    <path d="M 28 45 C 20 33, 20 18, 28 12 C 36 18, 36 33, 28 45 Z" fill="#3d7e6a" transform="rotate(-30, 28, 45)" />
    
    <!-- Blatt 3 (Mitte) -->
    <path d="M 46 38 C 38 24, 38 5, 46 0 C 54 5, 54 24, 46 38 Z" fill="#a2dbbe" transform="rotate(-15, 46, 38)" />
    
    <!-- Blatt 4 (Mitte rechts) -->
    <path d="M 64 32 C 56 18, 56 -1, 64 -6 C 72 -1, 72 18, 64 32 Z" fill="#3d7e6a" transform="rotate(5, 64, 32)" />
    
    <!-- Blatt 5 (rechts oben, sehr klein) -->
    <path d="M 80 25 C 74 15, 74 5, 80 0 C 86 5, 86 15, 80 25 Z" fill="#e0b880" transform="rotate(25, 80, 25)" />
  </g>

  <!-- ── TYPOGRAFIE IN WEISS & GOLD (Maximale Lesbarkeit) ── -->
  <g transform="translate(112, 0)">
    <!-- DORFLADEN in brillantem Weiß -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#ffffff" 
          letter-spacing="0.5">DORFLADEN</text>
          
    <!-- OBERORNAU in hellem Gold/Bronze -->
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#e0b880" 
          letter-spacing="4">OBERORNAU</text>
  </g>
</svg>