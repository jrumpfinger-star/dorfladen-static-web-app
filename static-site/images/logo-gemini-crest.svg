<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── REBUILD 3: THE RUSTIC HEART & PETAL CREST (Inspiration Image 1 / Design E) ── -->
  <!-- Wappenschild-Konzept mit integriertem Herz & Blättern für "Mit Herz & Hand". -->
  <!-- Höchste Gemütlichkeit, Kontraststärke und Markenidentität. -->

  <defs>
    <!-- Warmer Ocker- / Terrakotta-Verlauf -->
    <linearGradient id="cozyCrestGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c96d53" />
      <stop offset="100%" stop-color="#e0b880" />
    </linearGradient>
    <filter id="crestShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ── DAS WAPPEN (Zentrum bei x=48, y=45) ── -->
  <g transform="translate(10, 0)" filter="url(#crestShadow)">
    <g transform="translate(48, 45)">
      <!-- Wappenschild-Hintergrund in warmem Waldgrün -->
      <path d="M -30 -28 L 30 -28 C 30 -28, 32 10, 0 32 C -32 10, -30 -28, -30 -28 Z" fill="#1e463a" stroke="url(#cozyCrestGold)" stroke-width="2" />
      
      <!-- Herz- & Blättermotiv im Zentrum des Schildes -->
      <!-- Das Herz (Schnittpunkt unten) -->
      <path d="M 0 14 C -8 6, -12 6, -12 0 C -12 -5, -7 -9, 0 -2 C 7 -9, 12 -5, 12 0 C 12 6, 8 6, 0 14 Z" fill="url(#cozyCrestGold)" />
      
      <!-- 5 stilisierte Blätter fächern sich nach oben aus dem Herzen heraus -->
      <!-- Blatt Mitte -->
      <path d="M 0 -1 C -3 -8, -3 -18, 0 -21 C 3 -18, 3 -8, 0 -1 Z" fill="#faf6f0" />
      
      <!-- Blätter links -->
      <path d="M -2 2 C -8 -4, -12 -12, -7 -16 C -3 -12, -2 -5, -2 2 Z" fill="#5ea88a" />
      <path d="M -3 5 C -12 2, -15 -4, -10 -8 C -6 -6, -4 -1, -3 5 Z" fill="#a2dbbe" opacity="0.9" />
      
      <!-- Blätter rechts -->
      <path d="M 2 2 C 8 -4, 12 -12, 7 -16 C 3 -12, 2 -5, 2 2 Z" fill="#5ea88a" />
      <path d="M 3 5 C 12 2, 15 -4, 10 -8 C 6 -6, 4 -1, 3 5 Z" fill="#a2dbbe" opacity="0.9" />
    </g>
  </g>

  <!-- ── TYPOGRAFIE IN WEICH-SAND ── -->
  <g transform="translate(112, 0)">
    <!-- DORFLADEN in fettem, warmem Sand-Weiß -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#f4ebd0" 
          letter-spacing="0.5">DORFLADEN</text>
          
    <!-- OBERORNAU in kontraststarkem Terracotta-Ocker -->
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#e0b880" 
          letter-spacing="4">OBERORNAU</text>
  </g>
</svg>
