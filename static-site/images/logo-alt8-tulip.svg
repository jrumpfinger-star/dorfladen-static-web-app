<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── ALTERNATIVE 8: THE LOTUS / NESTED TULIP ── -->
  <!-- Kein Propeller! Die 5 Blätter sind als stilisierte Tulpenblüte ineinander verschachtelt. -->
  <!-- Extrem modern, symmetrisch und prestigeträchtig. Extra dicke, lesbare Typografie. -->

  <!-- ── DIE 5 BLÜTENBLÄTTER ALS NESTED TULIP ── -->
  <g transform="translate(10, 0)">
    <g transform="translate(48, 45)">
      <!-- Blatt 1 & 2 (Große, schützende Außenblätter) -->
      <!-- Links außen -->
      <path d="M 0 15 C -25 5, -28 -15, -15 -28 C -5 -25, -2 -10, 0 15 Z" fill="#1e463a" />
      <!-- Rechts außen -->
      <path d="M 0 15 C 25 5, 28 -15, 15 -28 C 5 -25, 2 -10, 0 15 Z" fill="#1e463a" />

      <!-- Blatt 3 & 4 (Innere, schwebende Zwischenblätter) -->
      <!-- Links innen -->
      <path d="M 0 15 C -14 -2, -18 -22, -8 -32 C -2 -24, 0 -10, 0 15 Z" fill="#5ea88a" />
      <!-- Rechts innen -->
      <path d="M 0 15 C 14 -2, 18 -22, 8 -32 C 2 -24, 0 -10, 0 15 Z" fill="#5ea88a" />

      <!-- Blatt 5 (Hauptblatt, stolz im Zentrum aufragend) -->
      <path d="M 0 15 C -6 -10, -6 -34, 0 -38 C 6 -34, 6 -10, 0 15 Z" fill="#bd8b5c" />
      
      <!-- Kleines Verbindungsband unten -->
      <path d="M -12 14 Q 0 18 12 14" fill="none" stroke="#123026" stroke-width="2.5" />
    </g>
  </g>

  <!-- ── TYPOGRAFIE (Hervorragende Lesbarkeit, klares, fettes Design) ── -->
  <g transform="translate(112, 0)">
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#11291f" 
          letter-spacing="0.5">DORFLADEN</text>
          
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#bd8b5c" 
          letter-spacing="4">OBERORNAU</text>
  </g>
</svg>
