<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" width="620" height="210">
  <!-- ── DORFLADEN OBERORNAU: Detailgetreuer Nachbau des Originallogos ── -->
  <!-- Elegante Kalligraphie + 3 Blätter symmetrisch (Fächer) ── -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sacramento&amp;family=Great+Vibes&amp;display=swap');
    </style>
  </defs>

  <!-- ══════════════════════════════════════ -->
  <!-- ══  TYPOGRAFIE                      ══ -->
  <!-- ══════════════════════════════════════ -->

  <!-- "Dorfladen" — elegante, runde Kalligraphie -->
  <text x="10" y="100" 
        font-family="'Great Vibes', 'Sacramento', 'Dancing Script', 'Segoe Script', cursive" 
        font-size="90" 
        fill="#8a6238">Dorfladen</text>

  <!-- "Oberornau" — gleiche Schrift, eingerückt -->
  <text x="90" y="190" 
        font-family="'Great Vibes', 'Sacramento', 'Dancing Script', 'Segoe Script', cursive" 
        font-size="84" 
        fill="#8a6238">Oberornau</text>

  <!-- ══════════════════════════════════════════════ -->
  <!-- ══  BLÄTTER (symmetrischer Fächer)          ══ -->
  <!-- ══════════════════════════════════════════════ -->
  <!-- Treffpunkt aller 3 Blätter: ein gemeinsamer Mittelpunkt -->
  <!-- Linkes braun: links-unten, Rechtes braun: rechts-unten (Spiegel), Grün: oben -->
  <g transform="translate(480, -2) scale(1.3)">

    <!-- Gemeinsamer Ursprungspunkt: ca. (45, 72) -->

    <!-- Linkes braunes Blatt: zeigt nach links-unten (7-Uhr) -->
    <path d="M 44 70 
             C 36 72, 18 78, 6 88 
             C -2 94, -4 104, 4 108 
             C 12 112, 24 104, 32 92 
             C 38 82, 42 74, 44 70 Z" 
          fill="#8a6238" />

    <!-- Rechtes braunes Blatt: zeigt nach rechts-unten (5-Uhr), Spiegel -->
    <path d="M 50 70 
             C 58 72, 76 78, 88 88 
             C 96 94, 98 104, 90 108 
             C 82 112, 70 104, 62 92 
             C 56 82, 52 74, 50 70 Z" 
          fill="#8a6238" />

    <!-- Grünes/Mint Blatt: zeigt nach oben (12-Uhr), schmaler -->
    <path d="M 42 68 
             C 40 56, 40 36, 46 18 
             C 48 10, 52 10, 54 18 
             C 60 36, 60 56, 58 68 
             C 54 72, 46 72, 42 68 Z" 
          fill="#3aae88" />

  </g>

</svg>
