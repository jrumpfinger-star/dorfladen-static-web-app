<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── REBUILD 4: THE GEOMETRIC "D" MONOGRAM (Inspiration Image 2 / Option 4) ── -->
  <!-- Hochmodernes Branding. Das edle große "D" bettet die Blütenblätter organisch ein. -->
  <!-- Maximal lesbare, fette Typografie daneben. -->

  <defs>
    <!-- Edler Gold-Verlauf -->
    <linearGradient id="monoGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd8b5c" />
      <stop offset="100%" stop-color="#e0b880" />
    </linearGradient>
  </defs>

  <!-- ── DAS MONOGRAMM "D" MIT BLÄTTERN (Zentrum bei x=48, y=45) ── -->
  <g transform="translate(10, 0)">
    <g transform="translate(48, 45)">
      <!-- Das große stilisierte "D" als edler Gold-Bogen -->
      <!-- Linker Balken des D -->
      <rect x="-24" y="-30" width="4.5" height="60" rx="2" fill="url(#monoGold)" />
      <!-- Der große schwingende Bogen des D -->
      <path d="M -24 -30 C 15 -30, 32 -15, 32 0 C 32 15, 15 30, -24 30" fill="none" stroke="url(#monoGold)" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- Die 5 Blütenblätter wachsen im Inneren des Bogens (Kein Propeller!) -->
      <!-- Mittleres aufrechtes Blatt -->
      <path d="M -6 16 C -11 6, -11 -6, -6 -10 C -1 -6, -1 6, -6 16 Z" fill="#5ea88a" />
      
      <!-- Linke Blätter -->
      <path d="M -8 18 C -16 11, -17 0, -12 -4 C -7 -1, -6 7, -8 18 Z" fill="#3d7e6a" />
      <path d="M -9 20 C -20 18, -20 10, -15 6 C -10 6, -8 12, -9 20 Z" fill="#1e463a" />
      
      <!-- Rechte Blätter -->
      <path d="M -4 18 C 4 11, 5 0, 0 -4 C -5 -1, -6 7, -4 18 Z" fill="#a2dbbe" />
      <path d="M -3 20 C 7 18, 7 10, 2 6 C -3 6, -5 12, -3 20 Z" fill="#e0b880" />
    </g>
  </g>

  <!-- ── TYPOGRAFIE IN BRILlANTEM ELFENBEIN ── -->
  <g transform="translate(112, 0)">
    <!-- DORFLADEN in fettem, warmem Elfenbein -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#faf9f6" 
          letter-spacing="0.5">DORFLADEN</text>
          
    <!-- OBERORNAU in harmonischem Gold -->
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#e0b880" 
          letter-spacing="4">OBERORNAU</text>
  </g>
</svg>
