<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130">
  <!-- ── DORFLADEN OBERORNAU: Marktstand + Blatt LINKS, Text RECHTS ── -->
  <!-- Icon gleiche Höhe wie Schriftblock, nah beieinander -->

  <defs>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(50)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#4a6070" stroke-width="1.0" opacity="0.6" />
    </pattern>
    <pattern id="hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4a6070" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- ══════════════════════════════════════════ -->
  <!-- ══  MARKTSTAND-ICON (links, ~120px hoch) ══ -->
  <!-- ══════════════════════════════════════════ -->
  <g transform="translate(4, 2) scale(0.72)">

    <!-- ── MARKISE (gestreift, trapezförmig) ── -->
    <g transform="translate(10, 5)">
      <path d="M 25 0 L 115 0 L 132 48 L 8 48 Z" 
            fill="#a8b030" stroke="#2e4a58" stroke-width="2.2" stroke-linejoin="round" />
      <path d="M 36 2 L 25 48" stroke="#d8d860" stroke-width="13" fill="none" opacity="0.85" />
      <path d="M 62 1 L 55 48" stroke="#d8d860" stroke-width="13" fill="none" opacity="0.85" />
      <path d="M 88 1 L 86 48" stroke="#d8d860" stroke-width="13" fill="none" opacity="0.85" />
      <path d="M 114 1 L 116 48" stroke="#d8d860" stroke-width="13" fill="none" opacity="0.85" />
      <line x1="25" y1="0" x2="115" y2="0" stroke="#2e4a58" stroke-width="2.5" stroke-linecap="round" />
      <line x1="25" y1="0" x2="8" y2="48" stroke="#2e4a58" stroke-width="2.2" stroke-linecap="round" />
      <line x1="115" y1="0" x2="132" y2="48" stroke="#2e4a58" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 8 48 C 8 48, 14 60, 24 48 C 34 36, 40 60, 50 48 C 60 36, 66 60, 76 48 C 86 36, 92 60, 102 48 C 112 36, 118 60, 126 48 C 132 40, 132 48, 132 48" 
            fill="none" stroke="#2e4a58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Stützpfosten -->
    <line x1="30" y1="53" x2="30" y2="78" stroke="#2e4a58" stroke-width="2.8" stroke-linecap="round" />
    <line x1="128" y1="53" x2="128" y2="78" stroke="#2e4a58" stroke-width="2.8" stroke-linecap="round" />

    <!-- Tisch / Stand -->
    <rect x="18" y="78" width="124" height="7" rx="2" fill="#7898a8" stroke="#2e4a58" stroke-width="1.8" />
    <rect x="23" y="85" width="114" height="50" rx="2" fill="#98b0bc" stroke="#2e4a58" stroke-width="2" />
    <rect x="23" y="85" width="114" height="50" rx="2" fill="url(#hatch)" />
    <rect x="23" y="85" width="114" height="50" rx="2" fill="url(#hatch2)" />

    <!-- Tischbeine -->
    <line x1="32" y1="135" x2="27" y2="160" stroke="#2e4a58" stroke-width="3.2" stroke-linecap="round" />
    <line x1="128" y1="135" x2="133" y2="160" stroke="#2e4a58" stroke-width="3.2" stroke-linecap="round" />

    <!-- Blatt (rechts oben) -->
    <g transform="translate(138, 10)">
      <path d="M 15 75 C 12 66, 8 58, 12 50" fill="none" stroke="#2d5a30" stroke-width="2.2" stroke-linecap="round" />
      <path d="M 12 50 C 4 42, -2 24, 6 10 C 12 2, 24 -3, 34 4 C 46 12, 50 28, 46 42 C 42 52, 32 58, 22 56 C 15 54, 12 52, 12 50 Z" 
            fill="none" stroke="#2d5a30" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
      <path d="M 12 50 C 4 42, -2 24, 6 10 C 12 2, 24 -3, 34 4 C 46 12, 50 28, 46 42 C 42 52, 32 58, 22 56 C 15 54, 12 52, 12 50 Z" 
            fill="#5aad50" opacity="0.25" />
      <path d="M 14 48 C 18 36, 24 22, 28 8" fill="none" stroke="#2d5a30" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 16 42 C 10 36, 6 30, 6 24" fill="none" stroke="#2d5a30" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 20 34 C 12 28, 8 20, 10 14" fill="none" stroke="#2d5a30" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 20 40 C 28 36, 36 30, 40 24" fill="none" stroke="#2d5a30" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 24 32 C 32 28, 40 20, 42 14" fill="none" stroke="#2d5a30" stroke-width="1.2" stroke-linecap="round" />
    </g>

  </g>

  <!-- ══════════════════════════════════════ -->
  <!-- ══  TYPOGRAFIE (rechts, eng am Icon) ══ -->
  <!-- ══════════════════════════════════════ -->

  <!-- "Dorfladen" -->
  <text x="155" y="58" 
        font-family="'Segoe Script', 'Brush Script MT', 'Apple Chancery', 'Lucida Handwriting', cursive" 
        font-size="48" 
        font-weight="700" 
        fill="#2a3e4a" 
        font-style="italic">Dorfladen</text>

  <!-- "Oberornau" -->
  <text x="162" y="105" 
        font-family="'Segoe Script', 'Brush Script MT', 'Apple Chancery', 'Lucida Handwriting', cursive" 
        font-size="42" 
        font-weight="700" 
        fill="#2a3e4a" 
        font-style="italic">Oberornau</text>

</svg>
