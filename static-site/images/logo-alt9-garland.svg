<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── ALTERNATIVE 9: THE ORGANIC WREATH / GARLAND (DARK HEADER VERSION) ── -->
  <!-- Ein halbkreisförmiger Ehrenkranz/Girlande, perfekt abgestimmt auf dunkle Statusleisten. -->

  <!-- ── DIE 5 BLÜTENBLÄTTER ALS KRANZ / GARLANDE ── -->
  <g transform="translate(10, 0)">
    <g transform="translate(48, 45)">
      <!-- Kranz-Zweig im Hintergrund -->
      <path d="M -30 -15 C -35 15, -15 32, 10 32 C 25 32, 35 20, 38 5" fill="none" stroke="#5ea88a" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

      <!-- Blatt 1 (links oben) -->
      <path d="M -26 -12 C -36 -2, -36 12, -26 18" fill="none" stroke="#3d7e6a" stroke-width="3" stroke-linecap="round" transform="rotate(-40, -26, 3)" />
      
      <!-- Blatt 2 (links unten) -->
      <path d="M -15 22 C -24 30, -10 38, -2 30 C 4 24, -4 16, -15 22 Z" fill="#a2dbbe" />
      
      <!-- Blatt 3 (Mitte unten) -->
      <path d="M 8 28 C 8 38, 22 38, 24 28 C 24 20, 14 18, 8 28 Z" fill="#3d7e6a" />
      
      <!-- Blatt 4 (rechts unten) -->
      <path d="M 28 22 C 34 30, 44 20, 36 12 C 30 14, 24 18, 28 22 Z" fill="#a2dbbe" />
      
      <!-- Blatt 5 (rechts oben) -->
      <path d="M 38 -2 C 40 8, 48 -2, 42 -8 C 36 -8, 34 -4, 38 -2 Z" fill="#e0b880" />
    </g>
  </g>

  <!-- ── TYPOGRAFIE IN WEISS & GOLD (Maximale Lesbarkeit) ── -->
  <g transform="translate(112, 0)">
    <!-- DORFLADEN in brillantem Weiß -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#ffffff" 
          letter-spacing="0.5">DORFLADEN</text>
          
    <!-- OBERORNAU in hellem Gold/Bronze -->
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#e0b880" 
          letter-spacing="4">OBERORNAU</text>
  </g>
</svg>