<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── ALTERNATIVE 6: THE CROWN / SUNBURST ARCH (DARK HEADER VERSION) ── -->
  <!-- 100% Lese-Garantie auf dunklem Hintergrund durch strahlendes Weiß und edles Gold. -->

  <defs>
    <!-- Leuchtende, kontraststarke Farbverläufe für dunkle Hintergründe -->
    <linearGradient id="crownGradLight1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d7e6a" />
      <stop offset="100%" stop-color="#5ea88a" />
    </linearGradient>
    <linearGradient id="crownGradLight2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ea88a" />
      <stop offset="100%" stop-color="#a2dbbe" />
    </linearGradient>
    
    <!-- Subtiler Schatten für das Abheben auf dunklem Grund -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- ── DIE 5 BLÜTENBLÄTTER ALS BOGEN / KRONE ── -->
  <g transform="translate(10, 5)" filter="url(#glowShadow)">
    <!-- Blatt 1 (links außen, klein) -->
    <path d="M 12 55 C 6 45, 6 25, 12 20 C 18 25, 18 45, 12 55 Z" fill="url(#crownGradLight1)" transform="rotate(-30, 12, 55)" />
    
    <!-- Blatt 2 (links, mittel) -->
    <path d="M 28 50 C 21 38, 21 15, 28 10 C 35 15, 35 38, 28 50 Z" fill="url(#crownGradLight2)" transform="rotate(-15, 28, 50)" />
    
    <!-- Blatt 3 (Mitte, groß & aufrecht) -->
    <path d="M 46 48 C 38 32, 38 4, 46 0 C 54 4, 54 32, 46 48 Z" fill="url(#crownGradLight1)" />
    
    <!-- Blatt 4 (rechts, mittel) -->
    <path d="M 64 50 C 57 38, 57 15, 64 10 C 71 15, 71 38, 64 50 Z" fill="url(#crownGradLight2)" transform="rotate(15, 64, 50)" />
    
    <!-- Blatt 5 (rechts außen, klein) -->
    <path d="M 80 55 C 74 45, 74 25, 80 20 C 86 25, 86 45, 80 55 Z" fill="url(#crownGradLight1)" transform="rotate(30, 80, 55)" />
    
    <!-- Verbindungs-Bogen unten in hellem Salbeigrün -->
    <path d="M 10 57 Q 46 62 82 57" fill="none" stroke="#5ea88a" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- ── TYPOGRAFIE IN WEISS & GOLD (Maximale Lesbarkeit) ── -->
  <g transform="translate(112, 0)">
    <!-- DORFLADEN in brillantem Weiß für perfekten Kontrast -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          fill="#ffffff" 
          letter-spacing="0.5">DORFLADEN</text>
          
    <!-- OBERORNAU in hellem, warmem Gold/Bronze -->
    <text x="2" y="62" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="800" 
          fill="#e0b880" 
          letter-spacing="4">OBERORNAU</text>
  </g>
</svg>