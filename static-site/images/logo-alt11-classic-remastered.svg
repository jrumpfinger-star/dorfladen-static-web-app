<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <!-- ── ALTERNATIVE 11: CLASSIC ORIGINAL REMASTERED (WARM SAND & SAGE) ── -->
  <!-- Das Logo-Blütenblatt ist das "O" in D-O-R-F-L-A-D-E-N! -->
  <!-- Extrem hohe Lesbarkeit durch weiches, warmes Sand-Beige statt sterilem Weiß. -->

  <defs>
    <!-- Weiche, organische Farbverläufe für die Blütenblätter -->
    <linearGradient id="remasterPetalGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ea88a" />
      <stop offset="100%" stop-color="#a2dbbe" />
    </linearGradient>
    <linearGradient id="remasterPetalGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d7e6a" />
      <stop offset="100%" stop-color="#5ea88a" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- ── TEXT "D" ── -->
    <text x="5" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f4ebd0" letter-spacing="1">D</text>

    <!-- ── DAS "O" ALS INTEGRATIVE 5-BLATT-BLÜTE (Zentrum bei x=50, y=34) ── -->
    <g transform="translate(48, 34)" scale="0.8">
      <!-- Blatt 1 (oben) -->
      <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" fill="url(#remasterPetalGrad1)" />
      <!-- Blatt 2 -->
      <g transform="rotate(72)">
        <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" fill="url(#remasterPetalGrad2)" />
      </g>
      <!-- Blatt 3 -->
      <g transform="rotate(144)">
        <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" fill="url(#remasterPetalGrad1)" />
      </g>
      <!-- Blatt 4 -->
      <g transform="rotate(216)">
        <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" fill="url(#remasterPetalGrad2)" />
      </g>
      <!-- Blatt 5 -->
      <g transform="rotate(288)">
        <path d="M 0 0 C -12 -18, -12 -38, 0 -42 C 12 -38, 12 -18, 0 0 Z" fill="url(#remasterPetalGrad1)" />
      </g>
      <!-- Edler, glänzender Kern -->
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>

    <!-- ── RESTLICHER TEXT "RFLADEN" (Startet nach der Blüte bei x=72) ── -->
    <text x="72" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f4ebd0" letter-spacing="1">RFLADEN</text>

    <!-- ── "OBERORNAU" (Perfekt horizontal zentriert darunter platziert) ── -->
    <text x="76" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#bd8b5c" letter-spacing="7">OBERORNAU</text>
  </g>
</svg>
