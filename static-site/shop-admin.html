<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Dorfladen – Shop Admin</title>
  <style>
    :root{--green:#2e7d4f;--green2:#1f5c39;--bg:#f4f7f5;--card:#fff;--border:#dfe7e2;--text:#24352b;--muted:#6b7f72;--warn:#f59e0b;--red:#dc2626;--blue:#2563eb;--urgent:#ef4444}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text)}
    .top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--green);font-size:15px}.brand-badge{width:32px;height:32px;border-radius:10px;background:#e9f5ee;display:grid;place-items:center;font-size:18px}.sub{font-size:11px;color:var(--muted);font-weight:400}
    .spacer{flex:1}.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}.btn:hover{border-color:var(--green);color:var(--green)}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.primary:hover{background:var(--green2)}.btn.small{padding:7px 9px;font-size:12px}.btn.red{color:#fff;background:var(--red);border-color:var(--red)}.btn-icon{font-style:normal}
    .wrap{max-width:1100px;margin:0 auto;padding:14px}.grid{display:flex;gap:8px;margin-bottom:10px;position:sticky;top:62px;z-index:9;background:var(--bg);padding-bottom:4px}.stat{min-width:90px;max-width:140px}.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer;transition:transform .12s,border-color .12s}.stat:hover{transform:translateY(-1px);border-color:var(--green)}.stat.active{border-color:var(--green);box-shadow:0 0 0 2px #d7efe0,0 2px 8px rgba(0,0,0,.03)}.stat .label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}.stat .value{font-size:22px;font-weight:800;margin-top:3px}.stat.open .value{color:var(--warn)}.stat.ready .value{color:var(--blue)}.stat.sum .value{color:var(--green)}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.03);overflow:hidden}.toolbar{padding:8px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}.toolbar-toggle{display:none}.toolbar-body{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1}.search{flex:1;max-width:320px;min-width:160px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px}.select{border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:#fff;font-weight:600;font-size:13px}
    .content{display:grid;grid-template-columns:280px 1fr;min-height:500px}
    .list{border-right:1px solid var(--border);overflow:auto;max-height:calc(100vh - 200px)}
    .right-pane{overflow:auto;max-height:calc(100vh - 200px)}
    /* Tabs */
    .tab-bar{border-bottom:1px solid var(--border);background:#f9fafb;position:sticky;top:0;z-index:2}
    .tab-bar-ctx{display:none;padding:6px 12px;font-size:11px;color:var(--text);background:#eaf6ef;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tab-bar-ctx .ctx-nr{font-weight:600;color:var(--green)}
    .tab-bar-ctx .ctx-name{color:var(--muted);margin-left:6px}
    .tab-bar-btns{display:flex}
    .tab-btn{flex:1;padding:12px 16px;border:none;background:none;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s}
    .tab-btn.active{color:var(--green);border-bottom-color:var(--green);background:#fff}
    .tab-btn:hover:not(.active){background:#f0f4f1}
    .tab-content{display:none;padding:12px}.tab-content.active{display:block}
    /* Order list */
    .order-group-hdr{padding:6px 12px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:#fff;background:var(--green);position:sticky;top:0;z-index:1}
    .order-group-hdr.urgent{background:var(--urgent);animation:pulse-bg 2s infinite}
    .order-group-hdr.today{background:#0369a1}
    @keyframes pulse-bg{0%,100%{opacity:1}50%{opacity:.85}}
    .order{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.order:hover{background:#f8fbf9}.order.active{background:#eaf6ef;border-left:4px solid var(--green);padding-left:8px}.order.urgent-row{border-left:3px solid var(--urgent)}
    .order-title{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.order-nr{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.2px}.order-meta{font-size:11px;color:var(--muted);margin-top:2px}.amount{font-weight:600;color:var(--green);font-size:13px}.status{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600}.s0{background:#fef3c7;color:#92400e}.s1{background:#dbeafe;color:#1d4ed8}.s2{background:#dcfce7;color:#166534}.s3{background:#e5e7eb;color:#374151}.s4{background:#fee2e2;color:#991b1b}
    .empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.kv{display:grid;grid-template-columns:80px 1fr;gap:3px 8px;font-size:12px;margin:8px 0}.kv b{color:var(--muted);font-size:11px}
    .items{margin-top:4px;display:flex;flex-direction:column;gap:3px}
    .item{display:grid;grid-template-columns:24px minmax(80px,1fr) 80px 110px;gap:6px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;align-items:center;background:#fff;cursor:pointer;font-size:12px}.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--green)}.item.packed{background:#eefaf3;border-color:#9bd7b4}.item-name{font-weight:600;font-size:12px}.item-code{font-size:9px;color:var(--muted)}.pack-qty{width:56px;text-align:right;border:2px solid var(--green);border-radius:5px;padding:3px 5px;font-size:14px;font-weight:700;color:var(--text);background:#f0fdf4}.pack-qty:disabled{border-color:var(--border);background:#f9fafb;color:var(--muted)}.pack-tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;margin-top:1px}.pack-tag-red{background:#fee2e2;color:#991b1b}.pack-tag-orange{background:#fef3c7;color:#92400e}.item.unavail{background:#fef2f2;border-color:#fecaca;opacity:.85}
    .actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.note{width:100%;min-height:40px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:12px}
    .pack-title{font-size:15px;font-weight:700;margin-bottom:6px}.pack-summary{font-size:12px;color:var(--muted);margin-bottom:6px}.pack-progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:6px 0 10px}.pack-progress div{height:100%;background:var(--green)}
    .toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}.loading{padding:40px;text-align:center;color:var(--muted)}
    /* Inline expand (accordion on mobile) */
    .order-expand{display:none;border-bottom:2px solid var(--green);background:#f8fbf9}
    .order-expand.open{display:block}
    .order-expand .expand-tabs{display:flex;border-bottom:1px solid var(--border);background:#f0f4f1}
    .order-expand .expand-tab{flex:1;padding:8px 10px;border:none;background:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
    .order-expand .expand-tab.active{color:var(--green);border-bottom-color:var(--green);background:#fff}
    .order-expand .expand-body{padding:12px}
    @media(max-width:1100px){.content{grid-template-columns:1fr}.list{border-right:0;max-height:none}.right-pane{display:none}}
    @media(max-width:600px){
      .top{padding:10px 12px;gap:6px;flex-wrap:nowrap}.brand{font-size:13px}.brand-badge{width:28px;height:28px;font-size:15px;border-radius:8px}.sub{display:none}.spacer{display:none}
      .top .btn{padding:8px 10px;font-size:18px;border-radius:8px;min-width:40px;text-align:center;line-height:1}.btn-label{display:none}.btn-icon{display:inline}
      .wrap{padding:10px 8px}
      .grid{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 0 6px;margin-bottom:10px;position:sticky;top:52px}.grid::-webkit-scrollbar{display:none}
      .stat{min-width:100px;max-width:none;flex-shrink:0;padding:10px 12px;border-radius:12px}.stat .label{font-size:10px}.stat .value{font-size:22px;margin-top:3px}
      .toolbar{padding:0;gap:0;flex-direction:column;border-bottom:none}
      .toolbar-toggle{display:flex!important;padding:8px 12px;gap:8px;align-items:center;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
      .toolbar-toggle span{margin-left:auto;font-size:10px}
      .toolbar-body{display:none;padding:10px;gap:8px;flex-direction:column}
      .toolbar-body.open{display:flex}
      .search{min-width:0;width:100%;padding:10px 12px;font-size:14px}.select{width:100%;padding:10px 12px}
      .toolbar .btn,.toolbar #show-history{width:100%;text-align:center}#show-history{margin-left:0!important}
      .content{grid-template-columns:1fr!important}
      .order{padding:10px;gap:4px}.order-title{font-size:12px;white-space:normal;word-break:break-word}.order-nr{font-size:9px}.order-meta{font-size:10px}.amount{font-size:12px}.status{font-size:10px;padding:3px 7px}
      .tab-content{padding:12px}
      .actions{gap:4px}.actions .btn{padding:7px 8px;font-size:11px;flex:1;min-width:0;text-align:center}
      .item{grid-template-columns:24px 1fr auto;gap:6px 8px;padding:8px;font-size:12px}.item>div:nth-child(3){text-align:left}.item>div:nth-child(4){grid-column:2/4;display:flex;align-items:center;gap:8px;justify-content:space-between}.item-name{font-size:12px}.item-code{font-size:9px}.pack-qty{width:54px;font-size:13px;padding:3px 4px}
      .pack-title{font-size:15px}.pack-summary{font-size:11px}
      .note{font-size:12px}
      .toast{left:12px;right:12px;bottom:12px;font-size:13px;text-align:center}
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><div class="brand-badge">📦</div><div><div>Shop Admin</div><div class="sub">Bestellungen, Packen & Status</div></div></div>
    <div class="spacer"></div>
    <a class="btn" href="/shop-freigabe" title="Artikelfreigabe verwalten"><span class="btn-icon">✅</span><span class="btn-label">Freigabe</span></a>
    <a class="btn" href="/cms" title="CMS – Inhalte bearbeiten"><span class="btn-icon">⚙</span><span class="btn-label">CMS</span></a>
    <a class="btn" href="/shop" title="Zum Online-Shop"><span class="btn-icon">🛒</span><span class="btn-label">Shop</span></a>
    <button class="btn primary" id="refresh-btn" title="Bestellungen neu laden"><span class="btn-icon">🔄</span><span class="btn-label">Aktualisieren</span></button>
  </div>
  <div class="wrap">
    <div class="grid">
      <div class="stat active" data-stat-filter="all"><div class="label">Bestellungen</div><div class="value" id="stat-count">-</div></div>
      <div class="stat open" data-stat-filter="open"><div class="label">Offen</div><div class="value" id="stat-open">-</div></div>
      <div class="stat ready" data-stat-filter="2"><div class="label">Abholbereit</div><div class="value" id="stat-ready">-</div></div>
    </div>
    <div class="panel">
      <div class="toolbar">
        <div class="toolbar-toggle" id="toolbar-toggle" style="display:none">🔍 Filter & Suche <span>▼</span></div>
        <div class="toolbar-body" id="toolbar-body">
          <input class="search" id="search" placeholder="Bestellnr., Name oder E-Mail suchen…">
          <select class="select" id="status-filter">
            <option value="all">Alle Status</option><option value="0">Neu</option><option value="1">In Bearbeitung</option><option value="2">Abholbereit</option><option value="3">Abgeholt</option><option value="4">Storniert</option>
          </select>
          <button class="btn" id="load-orders">Suchen</button>
          <button class="btn" id="show-history" style="margin-left:auto">📜 Historie</button>
        </div>
      </div>
      <div class="content">
        <div class="list" id="orders"><div class="loading">Lade Bestellungen…</div></div>
        <div class="right-pane" id="right-pane">
          <div class="tab-bar" id="tab-bar"><div class="tab-bar-ctx" id="tab-bar-ctx"></div><div class="tab-bar-btns"><button class="tab-btn active" data-tab="detail">📋 Bestellung</button><button class="tab-btn" data-tab="pack">📦 Packen</button></div></div>
          <div class="tab-content active" data-tab-content="detail" id="detail"><div class="empty"><div><h2>Bestellung ausw&auml;hlen</h2><p>Links eine Bestellung anklicken</p></div></div></div>
          <div class="tab-content" data-tab-content="pack" id="pack"><div class="empty"><div><h2>Packliste</h2><p>Nach Auswahl hier abhaken</p></div></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
(function(){
  var API='/api/shop-admin';
  // EAN-13 barcode SVG generator (with Code128B fallback for non-EAN codes)
  var EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  var EAN_G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  var EAN_R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  var EAN_PARITY=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
  function isEan13(s){return /^\d{13}$/.test(s);}
  function isEan8(s){return /^\d{8}$/.test(s);}
  function ean13Svg(code,h,bw){
    h=h||30;bw=bw||1;
    var d=code.split('').map(Number);
    var pat=EAN_PARITY[d[0]];
    var bits='101'; // start guard
    for(var i=0;i<6;i++) bits+=(pat[i]==='L'?EAN_L:EAN_G)[d[i+1]];
    bits+='01010'; // center guard
    for(var i=7;i<13;i++) bits+=EAN_R[d[i]];
    bits+='101'; // end guard
    var x=7*bw; // left quiet zone
    var rects='';
    for(var j=0;j<bits.length;j++){
      if(bits[j]==='1') rects+='<rect x="'+(x)+'" y="0" width="'+bw+'" height="'+h+'" fill="#000"/>';
      x+=bw;
    }
    var tw=x+7*bw; // right quiet zone
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+tw+' '+(h+10)+'" width="'+tw+'" height="'+(h+10)+'">';
    svg+=rects;
    svg+='<text x="'+(tw/2)+'" y="'+(h+9)+'" text-anchor="middle" font-size="8" font-family="monospace">'+esc(code)+'</text>';
    svg+='</svg>';
    return svg;
  }
  function ean8Svg(code,h,bw){
    h=h||30;bw=bw||1;
    var d=code.split('').map(Number);
    var bits='101';
    for(var i=0;i<4;i++) bits+=EAN_L[d[i]];
    bits+='01010';
    for(var i=4;i<8;i++) bits+=EAN_R[d[i]];
    bits+='101';
    var x=7*bw;var rects='';
    for(var j=0;j<bits.length;j++){
      if(bits[j]==='1') rects+='<rect x="'+(x)+'" y="0" width="'+bw+'" height="'+h+'" fill="#000"/>';
      x+=bw;
    }
    var tw=x+7*bw;
    var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+tw+' '+(h+10)+'" width="'+tw+'" height="'+(h+10)+'">';
    svg+=rects+'<text x="'+(tw/2)+'" y="'+(h+9)+'" text-anchor="middle" font-size="8" font-family="monospace">'+esc(code)+'</text></svg>';
    return svg;
  }
  function code128Svg(text,h,w){
    h=h||30;w=w||1;
    var C128B=[212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112];
    var keys=' !"#$%&\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~';
    var cs=104;var bars=[C128B[104]];
    for(var i=0;i<text.length;i++){var idx=keys.indexOf(text[i]);if(idx<0)idx=0;cs+=(idx)*(i+1);bars.push(C128B[idx]);}
    bars.push(C128B[cs%103]);bars.push(C128B[106]);bars.push(2);
    var x=0;var rects='';
    bars.forEach(function(pat){
      var s=String(pat);
      for(var j=0;j<s.length;j++){var bw=parseInt(s[j])*w;if(j%2===0)rects+='<rect x="'+x+'" y="0" width="'+bw+'" height="'+h+'" fill="#000"/>';x+=bw;}
    });
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+x+' '+(h+10)+'" width="'+x+'" height="'+(h+10)+'">'+rects+'<text x="'+(x/2)+'" y="'+(h+9)+'" text-anchor="middle" font-size="8" font-family="monospace">'+esc(text)+'</text></svg>';
  }
  function barcodeSvg(text,h,w){
    if(!text)return '';
    if(isEan13(text)) return ean13Svg(text,h||30,w||1);
    if(isEan8(text)) return ean8Svg(text,h||30,w||1);
    return code128Svg(text,h,w);
  }
  var orders=[];var selected=null;var activeStatFilter='all';var historyMode=false;var statusLabels={0:'Neu',1:'In Bearbeitung',2:'Abholbereit',3:'Abgeholt',4:'Storniert'};
  // Shop opening hours [openVM, closeVM, openNM, closeNM] indexed by JS weekday (0=So)
  var SHOP_HOURS=[null,[6.5,14,16.5,19],[6.5,14,null,null],[6.5,14,16.5,19],[6.5,14,16.5,19],[6.5,14,16.5,19],[7,13,null,null]];
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function tomorrowStr(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function money(v){return (Number(v)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});}
  function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none';},2500);}
  function statusBadge(s){return '<span class="status s'+s+'">'+esc(statusLabels[s]||'Unbekannt')+'</span>';}
  function setStats(summary){summary=summary||{};document.getElementById('stat-count').textContent=summary.count||0;document.getElementById('stat-open').textContent=summary.open||0;document.getElementById('stat-ready').textContent=summary.ready||0;}
  function fmtDateNice(raw){
    if(!raw) return '–';
    try{var d=new Date(raw.length===10?raw+'T12:00:00':raw);if(isNaN(d.getTime()))return raw;var tage=['So','Mo','Di','Mi','Do','Fr','Sa'];return tage[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.';}catch(e){return raw;}
  }
  function fmtDateTimeFull(raw){
    if(!raw) return '–';
    try{var d=new Date(raw);if(isNaN(d.getTime()))return raw;return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()+' um '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2)+' Uhr';}catch(e){return raw;}
  }
  function dayLabel(dateStr){
    if(!dateStr) return '–';
    var today=todayStr();var tom=tomorrowStr();
    if(dateStr===today) return 'Heute';
    if(dateStr===tom) return 'Morgen';
    try{var d=new Date(dateStr+'T12:00:00');var tage=['So','Mo','Di','Mi','Do','Fr','Sa'];return tage[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.';}catch(e){return dateStr;}
  }
  function isUrgent(o){
    // An order is urgent if: status<2 AND pickup is today within current opening period
    if(o.status>=2) return false;
    var ad=String(o.abholdatum||'').substring(0,10);
    if(ad!==todayStr()) return false;
    var now=new Date();var nowH=now.getHours()+now.getMinutes()/60;
    var dow=now.getDay();
    var hrs=SHOP_HOURS[dow];
    if(!hrs) return false;
    var period=(o.abhol_zeitslot||{}).period||'vm';

        var packIcon=pk.gepackt?'✅':'⬜';
        detailHtml+='<div style="display:grid;grid-template-columns:24px 1fr auto;gap:6px;padding:8px 10px;font-size:12px;border-bottom:1px solid #f3f4f6;align-items:center">';
        detailHtml+='<span>'+packIcon+'</span>';
        detailHtml+='<span style="font-weight:600">'+esc(p.bezeichnung)+'</span>';
        detailHtml+='<span style="white-space:nowrap;color:var(--muted)">'+esc(p.menge)+' '+esc(p.einheit||'Stk')+'</span>';
        detailHtml+='</div>';
      });
      detailHtml+='</div>';
    }
    if(isEditable){
      detailHtml+='<div class="actions"><button class="btn small" data-status="1">In Bearbeitung</button><button class="btn small" data-status="3">Abgeholt</button><button class="btn small red" data-status="4">Stornieren</button><button class="btn small" id="print-slip-detail">📄 Beipackzettel</button></div>';
      detailHtml+='<div style="font-size:11px;color:var(--muted);margin-bottom:4px">Anmerkung:</div><textarea class="note" id="note">'+esc(o.anmerkungen||'')+'</textarea>';
    } else {
      detailHtml+='<div class="actions"><button class="btn small" id="print-slip-detail">📄 Beipackzettel anzeigen</button></div>';
    }
    document.getElementById('detail').innerHTML=detailHtml;
    var packedCount=items.reduce(function(sum,p){return sum+(packFor(p).gepackt?1:0);},0);
    var pct=items.length?Math.round(packedCount/items.length*100):0;
    // Pack list with prices
    var packHtml='<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="pack-title" style="margin:0">Packliste</div><div class="pack-summary" style="margin:0">'+packedCount+'/'+items.length+' gepackt</div></div><div class="pack-progress" style="margin:4px 0 8px"><div style="width:'+pct+'%"></div></div>';
    packHtml+='<div class="items">';
    var summe=0;
    items.forEach(function(p,i){
      var pk=packFor(p);var checked=pk.gepackt?' checked':'';var cls=pk.gepackt?' packed':'';
      var ep=p.einzelpreis||0;
      var isKg=p.einheit==='kg'||p.gewichtsware;
      var bestMenge=p.menge||0;
      var packMenge=pk.gepackt_menge||bestMenge;
      if(isKg){bestMenge=Math.round(bestMenge*1000);packMenge=Math.round((pk.gepackt_menge||p.menge||0)*1000);}
      var gp=isKg?ep*(packMenge/100):ep*packMenge;summe+=gp;
      var disabled=isEditable?'':' disabled';
      var bc=p.strichcode||p.artikelnummer||'';
      var step=isKg?'10':'1';var unit=isKg?'g':'Stk';var min=isKg?'0':'0';
      packHtml+='<label class="item'+cls+'" data-item-row="'+i+'"><input type="checkbox" data-pack-index="'+i+'"'+checked+disabled+'><div><div class="item-name">'+esc(p.bezeichnung)+'</div><div class="item-code">'+esc(bc)+'</div><div data-tag-index="'+i+'"></div></div><div style="text-align:right;white-space:nowrap"><input type="number" class="pack-qty" data-qty-index="'+i+'" data-is-kg="'+(isKg?1:0)+'" data-ep="'+ep+'" data-best="'+bestMenge+'" value="'+packMenge+'" min="'+min+'" step="'+step+'"'+disabled+' onfocus="this.select()"> '+esc(unit)+'</div><div style="text-align:right;white-space:nowrap"><span style="font-size:11px;color:#6b7f72">× '+money(ep)+(isKg?'/100g':'')+' =</span><br><b data-price-index="'+i+'" style="font-size:14px">'+money(gp)+'</b></div></label>';
    });
    packHtml+='</div>';
    packHtml+='<div style="font-size:10px;color:#6b7f72;padding:4px 8px;margin-top:4px">ℹ Mengen können bei Gewichtsware geringfügig abweichen. Berechnet wird die tatsächlich gepackte Menge.</div>';
    packHtml+='<div style="text-align:right;font-size:16px;font-weight:900;padding:12px 12px 4px;border-top:2px solid #1e3a2f;margin-top:4px" id="pack-summe">Summe: '+money(summe)+'</div>';
    packHtml+='<div style="display:flex;gap:8px;margin-top:12px">';
    if(isEditable) packHtml+='<button class="btn primary" id="finish-pack" style="flex:1;padding:11px">✅ Fertig – Abholbereit</button>';
    packHtml+='<button class="btn" id="print-slip" style="padding:11px'+(isEditable?'':';flex:1')+'">🖨 Drucken</button></div>';
    document.getElementById('pack').innerHTML=packHtml;
    function updatePackTag(idx){
      var cb=document.querySelector('[data-pack-index="'+idx+'"]');
      var qtyInp=document.querySelector('[data-qty-index="'+idx+'"]');
      var tag=document.querySelector('[data-tag-index="'+idx+'"]');
      var row=document.querySelector('[data-item-row="'+idx+'"]');
      if(!tag) return;
      tag.innerHTML='';
      if(row) row.classList.remove('unavail');
      if(cb&&!cb.checked){
        tag.innerHTML='<span class="pack-tag pack-tag-red">✕ Nicht lieferbar</span>';
        if(row) row.classList.add('unavail');
      } else if(qtyInp){
        var best=parseFloat(qtyInp.getAttribute('data-best'))||0;
        var cur=parseFloat(qtyInp.value)||0;
        if(cur<best-0.5) tag.innerHTML='<span class="pack-tag pack-tag-orange">⚠ Teilmenge</span>';
      }
    }
    function recalcPackTotal(){
      var total=0;
      document.querySelectorAll('[data-qty-index]').forEach(function(q){
        var cb=document.querySelector('[data-pack-index="'+q.getAttribute('data-qty-index')+'"]');
        if(cb&&!cb.checked) return;
        var qep=parseFloat(q.getAttribute('data-ep'))||0;
        var qraw=parseFloat(q.value)||0;
        var qkg=q.getAttribute('data-is-kg')==='1';
        total+=qkg?qep*(qraw/100):qep*qraw;
      });
      var sumEl=document.getElementById('pack-summe');
      if(sumEl) sumEl.innerHTML='Summe: '+money(total);
    }
    // Wire qty inputs for live price update
    document.querySelectorAll('[data-qty-index]').forEach(function(inp){
      inp.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();});
      inp.addEventListener('change',function(){
        var idx=inp.getAttribute('data-qty-index');
        var isKg=inp.getAttribute('data-is-kg')==='1';
        var ep=parseFloat(inp.getAttribute('data-ep'))||0;
        var raw=parseFloat(inp.value)||0;
        var gp=isKg?ep*(raw/100):ep*raw;
        var priceEl=document.querySelector('[data-price-index="'+idx+'"]');
        if(priceEl) priceEl.textContent=money(gp);
        updatePackTag(idx);
        recalcPackTotal();
      });
    });
    // Wire checkboxes for tag updates
    document.querySelectorAll('[data-pack-index]').forEach(function(cb){
      cb.addEventListener('change',function(){
        var idx=cb.getAttribute('data-pack-index');
        updatePackTag(idx);
        recalcPackTotal();
      });
    });
    // Initial tag state
    items.forEach(function(p,i){updatePackTag(String(i));});
    // Wire status buttons
    document.querySelectorAll('[data-status]').forEach(function(b){b.addEventListener('click',function(){
      var newStatus=Number(b.getAttribute('data-status'));
      if(newStatus===4){
        // Stornierung: Auswahl-Modal mit Pflichtgrund
        var stornoReasons=['Artikel nicht mehr verfügbar','Kunde wünscht Stornierung','Ware nicht mehr frisch / abgelaufen','Lieferproblem beim Lieferanten','Bestellung doppelt aufgegeben','Sonstiger Grund'];
        var overlay=document.createElement('div');
        overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:grid;place-items:center';
        var modal=document.createElement('div');
        modal.style.cssText='background:#fff;border-radius:14px;padding:20px 24px;max-width:420px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.2)';
        modal.innerHTML='<div style="font-size:16px;font-weight:800;margin-bottom:4px">Bestellung stornieren</div>'
          +'<div style="font-size:12px;color:#6b7f72;margin-bottom:14px">'+esc(o.bestellnummer)+' – '+esc(o.kunde_name)+'</div>'
          +'<div style="font-size:13px;font-weight:700;margin-bottom:8px">Stornierungsgrund (Pflichtfeld):</div>'
          +'<div id="storno-opts" style="display:flex;flex-direction:column;gap:6px"></div>'
          +'<textarea id="storno-comment" placeholder="Zusätzlicher Kommentar (optional)…" rows="2" style="width:100%;margin-top:12px;border:1px solid #dfe7e2;border-radius:8px;padding:6px 8px;font-family:inherit;font-size:12px"></textarea>'
          +'<div style="display:flex;gap:8px;margin-top:14px"><button id="storno-cancel" style="flex:1;padding:10px;border:1px solid #dfe7e2;border-radius:10px;background:#fff;font-weight:700;cursor:pointer">Abbrechen</button>'
          +'<button id="storno-confirm" style="flex:1;padding:10px;border:none;border-radius:10px;background:#dc2626;color:#fff;font-weight:700;cursor:pointer;opacity:.4" disabled>Stornieren</button></div>';
        overlay.appendChild(modal);document.body.appendChild(overlay);
        var optsDiv=modal.querySelector('#storno-opts');var selectedReason='';
        stornoReasons.forEach(function(r){
          var opt=document.createElement('label');
          opt.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid #e5e7eb;border-radius:8px;cursor:pointer;font-size:13px;transition:border-color .15s';
          opt.innerHTML='<input type="radio" name="storno-reason" value="'+esc(r)+'" style="accent-color:#dc2626"> '+esc(r);
          opt.querySelector('input').addEventListener('change',function(){
            selectedReason=r;
            modal.querySelector('#storno-confirm').disabled=false;
            modal.querySelector('#storno-confirm').style.opacity='1';
            optsDiv.querySelectorAll('label').forEach(function(l){l.style.borderColor='#e5e7eb';l.style.background='';});
            opt.style.borderColor='#dc2626';opt.style.background='#fef2f2';
          });
          optsDiv.appendChild(opt);
        });
        modal.querySelector('#storno-cancel').addEventListener('click',function(){document.body.removeChild(overlay);});
        overlay.addEventListener('click',function(e){if(e.target===overlay) document.body.removeChild(overlay);});
        modal.querySelector('#storno-confirm').addEventListener('click',function(){
          if(!selectedReason) return;
          var comment=(modal.querySelector('#storno-comment').value||'').trim();
          var grund=selectedReason+(comment?' – '+comment:'');
          document.body.removeChild(overlay);
          var data={status:4,storno_grund:grund};
          if(document.getElementById('note')) data.anmerkungen=document.getElementById('note').value;
          fetch('/api/shop-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            bestellnummer:o.bestellnummer,kunde_email:o.kunde_email,kunde_name:o.kunde_name,
            abholdatum:o.abholdatum||'',type:'cancelled',storno_grund:grund
          })}).catch(function(){});
          updateOrder(data);
        });
        return;
      }
      if(newStatus===2){
        // Abholbereit: Benachrichtigung an Kunden
        fetch('/api/shop-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          bestellnummer:o.bestellnummer,kunde_email:o.kunde_email,kunde_name:o.kunde_name,
          abholdatum:o.abholdatum||'',type:'ready'
        })}).catch(function(){});
      }
      if(newStatus===3&&packedCount<items.length){
        if(!confirm('Achtung: Erst '+packedCount+' von '+items.length+' Positionen gepackt.\nTrotzdem als Abgeholt markieren?')) return;
      }
      var data={status:newStatus};
      if(document.getElementById('note')) data.anmerkungen=document.getElementById('note').value;
      updateOrder(data);
    });});
    // Wire Fertig button
    var finishBtn=document.getElementById('finish-pack');
    if(finishBtn){finishBtn.addEventListener('click',function(){
      var r=buildPackJson(items);
      if(r.packedCount<items.length){
        var missing=[];
        items.forEach(function(p,i){var cb=document.querySelector('[data-pack-index="'+i+'"]');if(!cb||!cb.checked) missing.push(p.bezeichnung);});
        var msg='Folgende Artikel sind nicht verfügbar:\n\n';
        missing.forEach(function(m){msg+='  ⚠ '+m+'\n';});
        msg+='\nDer Kunde ('+esc(o.kunde_email)+') wird per E-Mail informiert.\nTrotzdem als Abholbereit markieren?';
        if(!confirm(msg)) return;
        // Notify customer about missing items
        fetch('/api/shop-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bestellnummer:o.bestellnummer,kunde_email:o.kunde_email,kunde_name:o.kunde_name,abholdatum:o.abholdatum||'',type:'missing_items',missing_items:missing})}).catch(function(){});
      }
      var data={status:2,pack_json:r.pack};
      if(document.getElementById('note')) data.anmerkungen=document.getElementById('note').value;
      updateOrder(data);
    });}
    // Wire print buttons (packlist + detail)
    var printBtn=document.getElementById('print-slip');
    if(printBtn){printBtn.addEventListener('click',function(){printBeipackzettel(o,items);});}
    var printBtn2=document.getElementById('print-slip-detail');
    if(printBtn2){printBtn2.addEventListener('click',function(){printBeipackzettel(o,items);});}
  }
  function updateOrder(data){var selId=selected.id;data.id=selId;fetch(API,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();}).then(function(res){if(!res.success)throw new Error(res.error||'Fehler');toast('Gespeichert');return fetch(API+'?action=dashboard').then(function(r2){return r2.json();}).then(function(res2){if(!res2.success)throw new Error(res2.error||'Fehler');orders=res2.orders||[];statusLabels=res2.status_labels||statusLabels;setStats(res2.summary);renderOrders();selectOrder(selId);});}).catch(function(e){toast('Fehler: '+e.message);});}
  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){switchTab(b.getAttribute('data-tab'));});});
  // Toolbar toggle (mobile)
  var tbToggle=document.getElementById('toolbar-toggle');
  var tbBody=document.getElementById('toolbar-body');
  if(tbToggle&&tbBody){tbToggle.addEventListener('click',function(){tbBody.classList.toggle('open');tbToggle.querySelector('span').textContent=tbBody.classList.contains('open')?'▲':'▼';});}
  document.querySelectorAll('[data-stat-filter]').forEach(function(el){el.addEventListener('click',function(){activeStatFilter=el.getAttribute('data-stat-filter');document.getElementById('status-filter').value='all';renderOrders();});});document.getElementById('refresh-btn').addEventListener('click',loadDashboard);document.getElementById('load-orders').addEventListener('click',loadOrders);document.getElementById('search').addEventListener('keydown',function(e){if(e.key==='Enter')loadOrders();});document.getElementById('status-filter').addEventListener('change',loadOrders);
  document.getElementById('show-history').addEventListener('click',function(){historyMode=!historyMode;this.classList.toggle('primary',historyMode);this.textContent=historyMode?'📜 Historie ausblenden':'📜 Historie';renderOrders();});
  loadDashboard();
})();
</script>
</body>
</html>
