<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Dorfladen – Shop Admin</title>
  <style>
    :root{--green:#2e7d4f;--green2:#1f5c39;--bg:#f4f7f5;--card:#fff;--border:#dfe7e2;--text:#24352b;--muted:#6b7f72;--warn:#f59e0b;--red:#dc2626;--blue:#2563eb}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text)}
    .top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--green)}.brand-badge{width:38px;height:38px;border-radius:12px;background:#e9f5ee;display:grid;place-items:center;font-size:22px}.sub{font-size:12px;color:var(--muted);font-weight:500}
    .spacer{flex:1}.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.btn:hover{border-color:var(--green);color:var(--green)}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.primary:hover{background:var(--green2)}.btn.small{padding:7px 9px;font-size:12px}.btn.red{color:#fff;background:var(--red);border-color:var(--red)}
    .wrap{max-width:1700px;margin:0 auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.04);cursor:pointer;transition:transform .12s,border-color .12s}.stat:hover{transform:translateY(-1px);border-color:var(--green)}.stat.active{border-color:var(--green);box-shadow:0 0 0 2px #d7efe0,0 4px 18px rgba(0,0,0,.04)}.stat .label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.stat .value{font-size:30px;font-weight:900;margin-top:5px}.stat.open .value{color:var(--warn)}.stat.ready .value{color:var(--blue)}.stat.sum .value{color:var(--green)}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.04);overflow:hidden}.toolbar{padding:14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}.search{flex:1;min-width:220px;border:1px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14px}.select{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;font-weight:700}.content{display:grid;grid-template-columns:30% 35% 35%;min-height:680px}.list{border-right:1px solid var(--border);overflow:auto;max-height:calc(100vh - 245px)}.packcol{padding:18px;overflow:auto;max-height:calc(100vh - 245px);border-left:1px solid var(--border);background:#fbfdfc}.pack-title{font-size:18px;font-weight:900;margin-bottom:10px}.pack-summary{font-size:13px;color:var(--muted);margin-bottom:10px}.pack-progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:8px 0 12px}.pack-progress div{height:100%;background:var(--green)}
    .order{padding:12px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.order:hover{background:#f8fbf9}.order.active{background:#eaf6ef;border-left:4px solid var(--green);padding-left:12px}.order-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.order-meta{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:900;color:var(--green)}.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}.s0{background:#fef3c7;color:#92400e}.s1{background:#dbeafe;color:#1d4ed8}.s2{background:#dcfce7;color:#166534}.s3{background:#e5e7eb;color:#374151}.s4{background:#fee2e2;color:#991b1b}
    .detail{padding:18px;overflow:auto;max-height:calc(100vh - 245px)}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.detail h2{margin:0 0 6px}.kv{display:grid;grid-template-columns:120px 1fr;gap:6px;font-size:13px;margin:12px 0}.kv b{color:var(--muted)}.items{margin-top:10px;display:flex;flex-direction:column;gap:10px}.item{display:grid;grid-template-columns:36px 1fr 72px 78px;gap:8px;padding:12px;border:1px solid var(--border);border-radius:12px;align-items:center;background:#fff;cursor:pointer}.item input{width:22px;height:22px;accent-color:var(--green)}.item.packed{background:#eefaf3;border-color:#9bd7b4}.item-name{font-weight:900}.item-code{font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.note{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:inherit}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}.loading{padding:40px;text-align:center;color:var(--muted)}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}.list{border-right:0;max-height:none}.detail,.packcol{max-height:none;border-left:0;border-top:1px solid var(--border)}}
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><div class="brand-badge">📦</div><div><div>Shop Admin</div><div class="sub">Bestellungen, Packen & Status</div></div></div>
    <div class="spacer"></div>
    <a class="btn" href="/shop-freigabe">Artikelfreigabe</a>
    <a class="btn" href="/cms">CMS</a>
    <a class="btn" href="/shop">Shop</a>
    <button class="btn primary" id="refresh-btn">Aktualisieren</button>
  </div>
  <div class="wrap">
    <div class="grid">
      <div class="stat active" data-stat-filter="all"><div class="label">Bestellungen</div><div class="value" id="stat-count">-</div></div>
      <div class="stat open" data-stat-filter="open"><div class="label">Offen</div><div class="value" id="stat-open">-</div></div>
      <div class="stat ready" data-stat-filter="2"><div class="label">Abholbereit</div><div class="value" id="stat-ready">-</div></div>
      <div class="stat sum" data-stat-filter="revenue"><div class="label">Umsatz</div><div class="value" id="stat-sum">-</div></div>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="search" id="search" placeholder="Bestellnr., Name oder E-Mail suchen…">
        <select class="select" id="status-filter">
          <option value="all">Alle Status</option><option value="0">Neu</option><option value="1">In Bearbeitung</option><option value="2">Abholbereit</option><option value="3">Abgeholt</option><option value="4">Storniert</option>
        </select>
        <button class="btn" id="load-orders">Suchen</button>
      </div>
      <div class="content">
        <div class="list" id="orders"><div class="loading">Lade Bestellungen…</div></div>
        <div class="detail" id="detail"><div class="empty"><div><h2>Bestellung auswaehlen</h2><p>Links eine Bestellung anklicken.</p></div></div></div><div class="packcol" id="pack"><div class="empty"><div><h2>Packliste</h2><p>Nach Auswahl hier abhaken.</p></div></div></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
(function(){
  var API='/api/shop-admin';
  var orders=[];var selected=null;var activeStatFilter='all';var statusLabels={0:'Neu',1:'In Bearbeitung',2:'Abholbereit',3:'Abgeholt',4:'Storniert'};
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function money(v){return (Number(v)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});}
  function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(function(){el.style.display='none';},2500);}
  function statusBadge(s){return '<span class="status s'+s+'">'+esc(statusLabels[s]||'Unbekannt')+'</span>';}
  function setStats(summary){summary=summary||{};document.getElementById('stat-count').textContent=summary.count||0;document.getElementById('stat-open').textContent=summary.open||0;document.getElementById('stat-ready').textContent=summary.ready||0;document.getElementById('stat-sum').textContent=money(summary.summe||0);}
  function loadDashboard(){document.getElementById('orders').innerHTML='<div class="loading">Lade Bestellungen…</div>';fetch(API+'?action=dashboard').then(function(r){return r.json();}).then(function(res){if(!res.success)throw new Error(res.error||'Fehler');orders=res.orders||[];statusLabels=res.status_labels||statusLabels;setStats(res.summary);renderOrders();}).catch(function(e){document.getElementById('orders').innerHTML='<div class="loading">Fehler: '+esc(e.message)+'</div>';});}
  function loadOrders(){activeStatFilter='all';var q=document.getElementById('search').value.trim();var s=document.getElementById('status-filter').value;var url=API+'?action=orders&limit=300&status='+encodeURIComponent(s);if(q)url+='&q='+encodeURIComponent(q);document.getElementById('orders').innerHTML='<div class="loading">Suche…</div>';fetch(url).then(function(r){return r.json();}).then(function(res){if(!res.success)throw new Error(res.error||'Fehler');orders=res.orders||[];statusLabels=res.status_labels||statusLabels;setStats({count:res.summary.count,open:(res.summary.status['0']||0)+(res.summary.status['1']||0),ready:res.summary.status['2']||0,summe:res.summary.summe});renderOrders();}).catch(function(e){document.getElementById('orders').innerHTML='<div class="loading">Fehler: '+esc(e.message)+'</div>';});}
  function filteredOrders(){return orders.filter(function(o){if(activeStatFilter==='all')return true;if(activeStatFilter==='open')return o.status===0||o.status===1;if(activeStatFilter==='revenue')return o.status!==4;return String(o.status)===String(activeStatFilter);});}
  function updateStatActive(){document.querySelectorAll('[data-stat-filter]').forEach(function(el){el.classList.toggle('active',el.getAttribute('data-stat-filter')===activeStatFilter);});}
  function renderOrders(){var el=document.getElementById('orders');var list=filteredOrders();updateStatActive();if(!list.length){el.innerHTML='<div class="loading">Keine Bestellungen gefunden.</div>';return;}el.innerHTML=list.map(function(o){return '<div class="order '+(selected&&selected.id===o.id?'active':'')+'" data-id="'+esc(o.id)+'"><div><div class="order-title">'+esc(o.bestellnummer)+' ? '+esc(o.kunde_name||o.kunde_email)+'</div><div class="order-meta">Abholung '+esc(o.abholdatum||'-')+' ? '+(o.positionen_count||0)+' Positionen</div></div><div style="text-align:right"><div class="amount">'+money(o.gesamtsumme)+'</div>'+statusBadge(o.status)+'</div></div>';}).join('');el.querySelectorAll('.order').forEach(function(row){row.addEventListener('click',function(){selectOrder(row.getAttribute('data-id'));});});}
  function selectOrder(id){var o=orders.find(function(x){return x.id===id;});if(!o)return;fetch(API+'?action=order&id='+encodeURIComponent(id)).then(function(r){return r.json();}).then(function(res){selected=res.order||o;renderOrders();renderDetail();});}
  function renderDetail(){
    var o=selected;if(!o)return;
    var items=o.positionen||[];
    var packItems=(o.pack_data&&o.pack_data.items)||[];
    function packFor(p){
      var key=String(p.artikelnummer||p.strichcode||p.bezeichnung||'');
      return packItems.find(function(x){return String(x.artikelnummer||x.strichcode||x.bezeichnung||'')===key;})||{};
    }
    document.getElementById('detail').innerHTML='<h2>'+esc(o.bestellnummer)+'</h2><div>'+statusBadge(o.status)+' <b style="margin-left:8px">'+money(o.gesamtsumme)+'</b></div><div class="kv"><b>Kunde</b><span>'+esc(o.kunde_name)+'<br>'+esc(o.kunde_email)+'</span><b>Bestellt</b><span>'+esc(o.bestelldatum||'-')+'</span><b>Abholung</b><span>'+esc(o.abholdatum||'-')+'</span><b>Anmerkung</b><span>'+esc(o.anmerkungen||'-')+'</span></div><div class="actions"><button class="btn small" data-status="1">In Bearbeitung</button><button class="btn small primary" data-status="2">Abholbereit</button><button class="btn small" data-status="3">Abgeholt</button><button class="btn small red" data-status="4">Stornieren</button><button class="btn small" id="save-pack">Packdaten speichern</button><a class="btn small" href="pack.html?id='+encodeURIComponent(o.id)+'" target="_blank">Packansicht oeffnen</a></div><textarea class="note" id="note">'+esc(o.anmerkungen||'')+'</textarea>';
    var packedCount=items.reduce(function(sum,p){return sum+(packFor(p).gepackt?1:0);},0);
    var pct=items.length?Math.round(packedCount/items.length*100):0;
    document.getElementById('pack').innerHTML='<div class="pack-title">Packliste</div><div class="pack-summary">'+packedCount+' von '+items.length+' Positionen gepackt</div><div class="pack-progress"><div style="width:'+pct+'%"></div></div><div class="items">'+items.map(function(p,i){var pk=packFor(p);var checked=pk.gepackt?' checked':'';var cls=pk.gepackt?' packed':'';return '<label class="item'+cls+'"><input type="checkbox" data-pack-index="'+i+'"'+checked+'><div><div class="item-name">'+esc(p.bezeichnung)+'</div><div class="item-code">'+esc(p.artikelnummer||p.strichcode||'')+'</div></div><div>'+esc(p.menge)+' '+esc(p.einheit||'')+'</div><div style="text-align:right">'+money(p.positionspreis||((p.einzelpreis||0)*(p.menge||0)))+'</div></label>';}).join('')+'</div>';
    document.querySelectorAll('[data-status]').forEach(function(b){b.addEventListener('click',function(){updateOrder({status:Number(b.getAttribute('data-status')),anmerkungen:document.getElementById('note').value});});});
    document.getElementById('save-pack').addEventListener('click',function(){
      var packedCount=0;
      var pack={gepackt_von:'shop-admin',gepackt_um:new Date().toISOString(),items:items.map(function(p,i){
        var checked=!!document.querySelector('[data-pack-index="'+i+'"]').checked;
        if(checked)packedCount++;
        return {artikelnummer:p.artikelnummer||p.strichcode||'',strichcode:p.strichcode||'',bezeichnung:p.bezeichnung,gepackt:checked,gepackt_menge:checked?p.menge:0,menge:p.menge,einheit:p.einheit||'',scan_zeit:checked?new Date().toISOString():''};
      })};
      var nextStatus=o.status;
      if(packedCount===0&&o.status===2) nextStatus=1;
      else if(packedCount>0&&packedCount<items.length&&o.status===0) nextStatus=1;
      else if(items.length&&packedCount===items.length) nextStatus=2;
      updateOrder({status:nextStatus,pack_json:pack,anmerkungen:document.getElementById('note').value});
    });
  }
  function updateOrder(data){data.id=selected.id;fetch(API,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();}).then(function(res){if(!res.success)throw new Error(res.error||'Fehler');toast('Gespeichert');loadOrders();selectOrder(selected.id);}).catch(function(e){toast('Fehler: '+e.message);});}
  document.querySelectorAll('[data-stat-filter]').forEach(function(el){el.addEventListener('click',function(){activeStatFilter=el.getAttribute('data-stat-filter');document.getElementById('status-filter').value='all';renderOrders();});});document.getElementById('refresh-btn').addEventListener('click',loadDashboard);document.getElementById('load-orders').addEventListener('click',loadOrders);document.getElementById('search').addEventListener('keydown',function(e){if(e.key==='Enter')loadOrders();});document.getElementById('status-filter').addEventListener('change',loadOrders);
  loadDashboard();
})();
</script>
</body>
</html>
