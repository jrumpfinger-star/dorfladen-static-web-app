<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiosk – Dorfladen Oberornau</title>
  <style>
    :root{--c-pri:#2d5016;--c-green:#2e7d4f;--c-green-light:#dcfce7;--c-red:#dc2626;--c-orange:#e65100;--c-yellow:#f59e0b;--c-bg:#f0f2f5;--c-card:#fff;--c-text:#1f2937;--c-muted:#6b7280;--c-border:#e5e7eb;--radius:14px;--touch-min:56px}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden;touch-action:manipulation}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--c-bg);color:var(--c-text);display:flex;flex-direction:column;user-select:none}

    /* ═══ Header ═══ */
    .k-header{background:linear-gradient(135deg,#2d5016 0%,#3a6b1e 100%);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0}
    .k-header h1{font-size:20px;font-weight:800;flex:1}
    .k-header .k-clock{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
    .k-header .k-date{font-size:13px;opacity:.85}

    /* ═══ Tab bar ═══ */
    .k-tabs{display:flex;background:#fff;border-bottom:2px solid var(--c-border);flex-shrink:0}
    .k-tab{flex:1;padding:14px 8px;text-align:center;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--touch-min)}
    .k-tab:hover{background:#f9fafb}
    .k-tab.active{border-bottom-color:var(--c-green);color:var(--c-green);background:#f0fdf4}
    .k-tab .k-tab-icon{font-size:22px}
    .k-tab .k-tab-badge{background:var(--c-orange);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:10px;min-width:20px;display:none}
    .k-tab .k-tab-badge.show{display:inline-block}

    /* ═══ Main content ═══ */
    .k-main{flex:1;overflow:hidden;position:relative}
    .k-panel{position:absolute;inset:0;overflow-y:auto;padding:12px 16px;display:none}
    .k-panel.active{display:block}

    /* ═══ Stats bar ═══ */
    .k-stats{display:flex;gap:10px;margin-bottom:12px}
    .k-stat{background:var(--c-card);border-radius:12px;padding:12px 16px;flex:1;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .k-stat-val{font-size:28px;font-weight:800}
    .k-stat-label{font-size:11px;font-weight:700;color:var(--c-muted);text-transform:uppercase;letter-spacing:.3px}
    .k-stat.green .k-stat-val{color:var(--c-green)}
    .k-stat.orange .k-stat-val{color:var(--c-orange)}
    .k-stat.red .k-stat-val{color:var(--c-red)}

    /* ═══ Dish summary bar ═══ */
    .k-dish-summary{background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .k-dish-summary h3{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--c-muted)}
    .k-dish-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:15px}
    .k-dish-row .k-dish-name{flex:1;font-weight:600}
    .k-dish-row .k-dish-count{font-weight:800;font-size:20px;color:var(--c-green);min-width:50px;text-align:right}

    /* ═══ Order cards ═══ */
    .k-order{background:#fff;border-radius:var(--radius);box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:10px;overflow:hidden;border-left:5px solid transparent;display:flex;align-items:stretch}
    .k-order.st-0{border-left-color:var(--c-yellow)}
    .k-order.st-1{border-left-color:var(--c-green)}
    .k-order.st-2{border-left-color:var(--c-red)}
    .k-order.st-3{border-left-color:#9ca3af}
    .k-order-info{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
    .k-order-top{display:flex;align-items:center;gap:10px}
    .k-order-name{font-size:16px;font-weight:700;flex:1}
    .k-order-src{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
    .src-online{background:#dbeafe;color:#1d4ed8}
    .src-telefon{background:#fef3c7;color:#92400e}
    .src-personal{background:#f3e8ff;color:#7c3aed}
    .k-order-dish{font-size:14px;color:var(--c-text)}
    .k-order-meta{font-size:12px;color:var(--c-muted);display:flex;gap:12px;flex-wrap:wrap}
    .k-order-note{font-size:12px;color:#92400e;font-style:italic}
    .k-order-mitnehmen{font-size:11px;background:#dbeafe;color:#1d4ed8;padding:2px 8px;border-radius:4px;font-weight:700}
    .k-order-qty{display:flex;align-items:center;gap:6px;padding:8px 12px;border-left:1px solid var(--c-border)}
    .k-order-qty .qty-display{font-size:24px;font-weight:800;min-width:36px;text-align:center}
    .k-order-actions{display:flex;flex-direction:column;gap:4px;padding:8px;border-left:1px solid var(--c-border);justify-content:center}
    .k-btn{min-height:var(--touch-min);min-width:var(--touch-min);padding:8px 18px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .1s;white-space:nowrap}
    .k-btn:active{transform:scale(.96)}
    .k-btn-confirm{background:var(--c-green);color:#fff}
    .k-btn-pickup{background:#2563eb;color:#fff}
    .k-btn-cancel{background:var(--c-red);color:#fff;font-size:12px}
    .k-btn-sm{min-height:40px;padding:6px 12px;font-size:12px}
    .k-btn-outline{background:#fff;color:var(--c-text);border:2px solid var(--c-border)}
    .k-btn-lg{min-height:64px;padding:12px 28px;font-size:16px;border-radius:14px}

    /* ═══ Bottom action bar ═══ */
    .k-bottom{background:#fff;border-top:1px solid var(--c-border);padding:10px 16px;display:flex;gap:10px;flex-shrink:0}
    .k-bottom .k-btn{flex:1}

    /* ═══ Modal ═══ */
    .k-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center}
    .k-modal-bg.open{display:flex}
    .k-modal{background:#fff;border-radius:20px;width:95%;max-width:560px;max-height:90vh;overflow-y:auto;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .k-modal-head{padding:20px 24px 0;display:flex;align-items:center;gap:12px}
    .k-modal-head h2{font-size:20px;font-weight:800;flex:1}
    .k-modal-close{width:44px;height:44px;border:none;background:#f3f4f6;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .k-modal-body{padding:20px 24px}
    .k-modal-footer{padding:0 24px 24px;display:flex;gap:10px}

    /* ═══ Form fields ═══ */
    .k-field{margin-bottom:16px}
    .k-field label{font-size:13px;font-weight:700;color:var(--c-muted);margin-bottom:6px;display:block}
    .k-field input,.k-field textarea,.k-field select{width:100%;padding:14px 16px;border:2px solid var(--c-border);border-radius:12px;font-size:16px;font-family:inherit;outline:none}
    .k-field input:focus,.k-field textarea:focus,.k-field select:focus{border-color:var(--c-green)}
    .k-field textarea{resize:vertical;min-height:60px}
    .k-field select{background:#fff;appearance:auto}

    /* ═══ Search results ═══ */
    .k-search-results{border:1px solid var(--c-border);border-radius:10px;max-height:180px;overflow-y:auto;margin-top:4px;display:none}
    .k-search-results.show{display:block}
    .k-search-item{padding:12px 14px;cursor:pointer;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:10px;min-height:var(--touch-min)}
    .k-search-item:hover,.k-search-item:active{background:#f0fdf4}
    .k-search-item:last-child{border-bottom:none}
    .k-search-item .si-name{font-weight:700;flex:1}
    .k-search-item .si-phone{font-size:13px;color:var(--c-muted)}

    /* ═══ Qty selector ═══ */
    .k-qty-sel{display:flex;align-items:center;justify-content:center;gap:20px;margin:8px 0}
    .k-qty-btn{width:56px;height:56px;border-radius:50%;border:2px solid var(--c-green);background:#fff;color:var(--c-green);font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .k-qty-btn:active{background:var(--c-green);color:#fff}
    .k-qty-val{font-size:36px;font-weight:800;min-width:50px;text-align:center}

    /* ═══ Gericht-Auswahl (Radio-Karten) ═══ */
    .k-dish-pick{display:flex;flex-direction:column;gap:6px}
    .k-dish-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--c-border);border-radius:12px;cursor:pointer;min-height:var(--touch-min);transition:border-color .1s}
    .k-dish-opt.selected{border-color:var(--c-green);background:#f0fdf4}
    .k-dish-opt .do-name{flex:1;font-weight:600;font-size:15px}
    .k-dish-opt .do-day{font-size:12px;color:var(--c-muted)}
    .k-dish-opt .do-price{font-weight:700;color:var(--c-green);font-size:15px}

    /* ═══ Toast ═══ */
    .k-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:14px 28px;border-radius:14px;font-size:16px;font-weight:700;z-index:999;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90%}
    .k-toast.show{display:block;animation:toastIn .3s ease}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* ═══ Empty state ═══ */
    .k-empty{text-align:center;padding:60px 20px;color:var(--c-muted);font-size:16px}
    .k-empty .k-empty-icon{font-size:48px;margin-bottom:12px}

    /* ═══ Print ═══ */
    @media print{
      .k-header,.k-tabs,.k-bottom,.k-order-actions,.k-btn,.k-modal-bg,.k-toast{display:none!important}
      html,body{height:auto;overflow:auto}
      .k-main,.k-panel,.k-panel.active{position:static;overflow:visible;display:block!important}
      .k-order{break-inside:avoid;border:1px solid #999;margin-bottom:6px}
      body{background:#fff;font-size:12px}
      .k-stats{display:none}
      .k-dish-summary{border:1px solid #999;box-shadow:none;margin-bottom:8px}
      .k-dish-summary h3{font-size:16px;font-weight:800;margin-bottom:4px}
      .k-dish-row{font-size:14px}
      @page{margin:1cm}
    }
  </style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="k-header">
  <h1>🏪 Dorfladen Kiosk</h1>
  <div>
    <div class="k-date" id="k-date"></div>
    <div class="k-clock" id="k-clock"></div>
  </div>
</div>

<!-- ═══ Tab bar ═══ -->
<div class="k-tabs">
  <div class="k-tab active" data-tab="mittag" onclick="K.switchTab('mittag')">
    <span class="k-tab-icon">🍽</span> Mittagstisch
    <span class="k-tab-badge" id="badge-mittag"></span>
  </div>
  <div class="k-tab" data-tab="abhol" onclick="K.switchTab('abhol')">
    <span class="k-tab-icon">🛒</span> Abholungen
    <span class="k-tab-badge" id="badge-abhol"></span>
  </div>
  <div class="k-tab" data-tab="kunden" onclick="K.switchTab('kunden')">
    <span class="k-tab-icon">👥</span> Stammkunden
  </div>
  <div class="k-tab" data-tab="plan" onclick="K.switchTab('plan')">
    <span class="k-tab-icon">📋</span> Speiseplan
  </div>
</div>

<!-- ═══ Panels ═══ -->
<div class="k-main">

  <!-- ── Mittagstisch ── -->
  <div class="k-panel active" id="panel-mittag">
    <div class="k-stats" id="mittag-stats"></div>
    <div class="k-dish-summary" id="mittag-dish-summary"></div>
    <div id="mittag-orders"><div class="k-empty"><div class="k-empty-icon">⏳</div>Laden…</div></div>
  </div>

  <!-- ── Shop-Abholungen ── -->
  <div class="k-panel" id="panel-abhol">
    <div class="k-empty"><div class="k-empty-icon">🛒</div>Shop-Abholungen (Phase 2)</div>
  </div>

  <!-- ── Stammkunden ── -->
  <div class="k-panel" id="panel-kunden">
    <div class="k-field" style="margin-bottom:8px">
      <input type="text" id="kunden-search" placeholder="🔍 Kunde suchen (Name oder Telefon)…" oninput="K.searchKunden()">
    </div>
    <div id="kunden-list"><div class="k-empty"><div class="k-empty-icon">👥</div>Suchbegriff eingeben oder alle laden…</div></div>
  </div>

  <!-- ── Speiseplan ── -->
  <div class="k-panel" id="panel-plan">
    <div id="plan-content"><div class="k-empty"><div class="k-empty-icon">📋</div>Laden…</div></div>
  </div>

</div>

<!-- ═══ Bottom bar ═══ -->
<div class="k-bottom">
  <button class="k-btn k-btn-lg k-btn-confirm" onclick="K.openNewOrder()">☎ Neue Telefonbestellung</button>
  <button class="k-btn k-btn-lg k-btn-outline" onclick="K.printKitchen()">🖨 Küchenliste</button>
  <button class="k-btn k-btn-lg k-btn-outline" onclick="K.refresh()">🔄</button>
</div>

<!-- ═══ New order modal ═══ -->
<div class="k-modal-bg" id="modal-order">
  <div class="k-modal">
    <div class="k-modal-head">
      <h2>☎ Neue Bestellung</h2>
      <button class="k-modal-close" onclick="K.closeModal('modal-order')">✕</button>
    </div>
    <div class="k-modal-body">
      <!-- Step 1: Kunde -->
      <div class="k-field">
        <label>Kunde *</label>
        <input type="text" id="no-kunde-search" placeholder="Name oder Telefon eingeben…" oninput="K.searchOrderKunde()">
        <div class="k-search-results" id="no-kunde-results"></div>
      </div>
      <div id="no-kunde-selected" style="display:none;background:#f0fdf4;padding:12px;border-radius:10px;margin-bottom:16px">
        <strong id="no-kunde-name"></strong> <span id="no-kunde-phone" style="color:#6b7280"></span>
        <button class="k-btn k-btn-sm k-btn-outline" onclick="K.clearOrderKunde()" style="float:right">✕ Ändern</button>
      </div>
      <div id="no-kunde-new" style="display:none;margin-bottom:16px">
        <div style="display:flex;gap:8px">
          <div class="k-field" style="flex:1"><label>Name *</label><input type="text" id="no-new-name" placeholder="Vor- und Nachname"></div>
          <div class="k-field" style="flex:1"><label>Telefon</label><input type="tel" id="no-new-phone" placeholder="08082…"></div>
        </div>
      </div>

      <!-- Step 2: Gericht -->
      <div class="k-field">
        <label>Gericht *</label>
        <div class="k-dish-pick" id="no-dishes"></div>
      </div>

      <!-- Step 3: Menge -->
      <div class="k-field">
        <label>Menge</label>
        <div class="k-qty-sel">
          <button class="k-qty-btn" onclick="K.noQty(-1)">−</button>
          <div class="k-qty-val" id="no-qty">1</div>
          <button class="k-qty-btn" onclick="K.noQty(1)">+</button>
        </div>
      </div>

      <!-- Step 4: Anmerkung -->
      <div class="k-field">
        <label>Anmerkung (optional)</label>
        <textarea id="no-note" placeholder="z.B. ohne Zwiebeln…"></textarea>
      </div>

      <div class="k-field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="no-mitnehmen" style="width:22px;height:22px;accent-color:var(--c-green)">
          📦 Zum Mitnehmen
        </label>
      </div>
    </div>
    <div class="k-modal-footer">
      <button class="k-btn k-btn-lg k-btn-outline" style="flex:1" onclick="K.closeModal('modal-order')">Abbrechen</button>
      <button class="k-btn k-btn-lg k-btn-confirm" style="flex:2" onclick="K.submitNewOrder()">✅ Bestellung aufnehmen</button>
    </div>
  </div>
</div>

<!-- ═══ New customer modal ═══ -->
<div class="k-modal-bg" id="modal-kunde">
  <div class="k-modal">
    <div class="k-modal-head">
      <h2>👤 Neuer Stammkunde</h2>
      <button class="k-modal-close" onclick="K.closeModal('modal-kunde')">✕</button>
    </div>
    <div class="k-modal-body">
      <div class="k-field"><label>Name *</label><input type="text" id="nk-name" placeholder="Vor- und Nachname"></div>
      <div class="k-field"><label>Telefon *</label><input type="tel" id="nk-phone" placeholder="08082…"></div>
      <div class="k-field"><label>E-Mail</label><input type="email" id="nk-email" placeholder="optional"></div>
      <div class="k-field"><label>Notiz</label><textarea id="nk-note" placeholder="z.B. Stammgast, immer Freitags…"></textarea></div>
    </div>
    <div class="k-modal-footer">
      <button class="k-btn k-btn-lg k-btn-outline" style="flex:1" onclick="K.closeModal('modal-kunde')">Abbrechen</button>
      <button class="k-btn k-btn-lg k-btn-confirm" style="flex:2" onclick="K.submitNewKunde()">✅ Kunde anlegen</button>
    </div>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div class="k-toast" id="k-toast"></div>

<script>
var K = (function(){
  var API = '/api';
  var orders = [];
  var dishes = [];
  var kunden = [];
  var selectedKunde = null;
  var selectedDish = null;
  var noQty = 1;
  var refreshTimer = null;

  var STATUS = {0:'Neu',1:'Bestätigt',2:'Storniert',3:'Abgeholt'};
  var SRC_LABELS = {0:'Online',1:'Telefon',2:'Personal'};
  var SRC_CLASS = {0:'src-online',1:'src-telefon',2:'src-personal'};
  var DAY_FULL = {101000:'Montag',101001:'Dienstag',101002:'Mittwoch',101003:'Donnerstag',101004:'Freitag',101005:'Samstag'};

  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
  function today(){return new Date().toISOString().split('T')[0];}

  // ── Clock ──
  function updateClock(){
    var now = new Date();
    document.getElementById('k-clock').textContent = now.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    document.getElementById('k-date').textContent = now.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Tabs ──
  function switchTab(id){
    document.querySelectorAll('.k-tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===id);});
    document.querySelectorAll('.k-panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+id);});
    if(id==='kunden' && kunden.length===0) searchKunden();
    if(id==='plan' && dishes.length===0) loadDishes();
  }

  // ══════════════════════════════════════════════════
  //  MITTAGSTISCH
  // ══════════════════════════════════════════════════

  function loadOrders(){
    fetch(API+'/lunch-order?datum='+today())
      .then(function(r){return r.json();})
      .then(function(res){
        if(!res.success) return;
        orders = res.orders || [];
        renderOrders();
        renderStats();
        updateBadge('mittag', orders.filter(function(o){return o.status===0;}).length);
      })
      .catch(function(){});
  }

  function renderStats(){
    var neu = orders.filter(function(o){return o.status===0;}).length;
    var ok = orders.filter(function(o){return o.status===1;}).length;
    var abgeholt = orders.filter(function(o){return o.status===3;}).length;
    var portionen = orders.filter(function(o){return o.status!==2;}).reduce(function(s,o){return s+(o.menge||1);},0);
    var umsatz = orders.filter(function(o){return o.status!==2;}).reduce(function(s,o){return s+(o.preis||0)*(o.menge||1);},0);

    document.getElementById('mittag-stats').innerHTML =
      '<div class="k-stat orange"><div class="k-stat-val">'+neu+'</div><div class="k-stat-label">Offen</div></div>'+
      '<div class="k-stat green"><div class="k-stat-val">'+ok+'</div><div class="k-stat-label">Bestätigt</div></div>'+
      '<div class="k-stat"><div class="k-stat-val">'+abgeholt+'</div><div class="k-stat-label">Abgeholt</div></div>'+
      '<div class="k-stat"><div class="k-stat-val">'+portionen+'</div><div class="k-stat-label">Portionen</div></div>'+
      '<div class="k-stat green"><div class="k-stat-val">'+umsatz.toFixed(0)+'€</div><div class="k-stat-label">Umsatz</div></div>';
  }

  function renderDishSummary(){
    var active = orders.filter(function(o){return o.status!==2;});
    var byDish = {};
    active.forEach(function(o){
      var name = o.gericht || '?';
      if(!byDish[name]) byDish[name] = {count:0,preis:o.preis||0};
      byDish[name].count += (o.menge||1);
    });
    var keys = Object.keys(byDish).sort();
    if(keys.length===0){
      document.getElementById('mittag-dish-summary').style.display='none';
      return;
    }
    document.getElementById('mittag-dish-summary').style.display='';
    var html = '<h3>📊 Zusammenfassung pro Gericht</h3>';
    keys.forEach(function(name){
      html += '<div class="k-dish-row"><span class="k-dish-name">'+esc(name)+'</span><span class="k-dish-count">'+byDish[name].count+'×</span></div>';
    });
    document.getElementById('mittag-dish-summary').innerHTML = html;
  }

  function renderOrders(){
    renderDishSummary();
    if(orders.length===0){
      document.getElementById('mittag-orders').innerHTML = '<div class="k-empty"><div class="k-empty-icon">📭</div>Keine Bestellungen für heute</div>';
      return;
    }
    // Sort: neu first, then bestätigt, then rest
    var sorted = orders.slice().sort(function(a,b){
      var prio = {0:0,1:1,3:2,2:3};
      return (prio[a.status]||9) - (prio[b.status]||9);
    });
    var html = '';
    sorted.forEach(function(o){
      var srcLabel = SRC_LABELS[o.quelle]||'Online';
      var srcCls = SRC_CLASS[o.quelle]||'src-online';
      html += '<div class="k-order st-'+o.status+'">';
      html += '<div class="k-order-info">';
      html += '<div class="k-order-top">';
      html += '<span class="k-order-name">'+esc(o.name)+'</span>';
      html += '<span class="k-order-src '+srcCls+'">'+srcLabel+'</span>';
      if(o.mitnehmen) html += ' <span class="k-order-mitnehmen">📦 Mitnehmen</span>';
      html += '</div>';
      html += '<div class="k-order-dish">'+esc(o.gericht)+'</div>';
      html += '<div class="k-order-meta">';
      html += '<span>'+esc(o.bestellnummer||'')+'</span>';
      if(o.telefon) html += '<span>☎ '+esc(o.telefon)+'</span>';
      if(o.preis) html += '<span>'+((o.preis*(o.menge||1)).toFixed(2).replace('.',','))+' €</span>';
      html += '</div>';
      if(o.anmerkung) html += '<div class="k-order-note">💬 '+esc(o.anmerkung)+'</div>';
      html += '</div>';

      // Qty
      html += '<div class="k-order-qty"><div class="qty-display">'+((o.menge||1))+'×</div></div>';

      // Actions
      html += '<div class="k-order-actions">';
      if(o.status===0){
        html += '<button class="k-btn k-btn-confirm k-btn-sm" onclick="K.setStatus(\''+o.id+'\',1)">✅ Bestätigen</button>';
        html += '<button class="k-btn k-btn-cancel k-btn-sm" onclick="K.setStatus(\''+o.id+'\',2)">❌</button>';
      } else if(o.status===1){
        html += '<button class="k-btn k-btn-pickup k-btn-sm" onclick="K.setStatus(\''+o.id+'\',3)">📦 Abgeholt</button>';
      } else if(o.status===3){
        html += '<span style="font-size:20px">✅</span>';
      }
      html += '</div>';
      html += '</div>';
    });
    document.getElementById('mittag-orders').innerHTML = html;
  }

  function setStatus(id, status){
    fetch(API+'/lunch-order/'+id,{
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status:status})
    })
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.success){
        toast(status===1?'✅ Bestätigt':status===3?'📦 Abgeholt':'❌ Storniert');
        loadOrders();
      } else {
        toast('Fehler: '+(res.error||''));
      }
    })
    .catch(function(e){toast('Fehler: '+e.message);});
  }

  // ══════════════════════════════════════════════════
  //  WOCHENPLAN / DISHES
  // ══════════════════════════════════════════════════

  function loadDishes(){
    fetch(API+'/wochenplan')
      .then(function(r){return r.json();})
      .then(function(data){
        dishes = (data.data||[]).filter(function(d){return d.dl_gericht && d.dl_preis;});
        renderPlan();
      })
      .catch(function(){});
  }

  function renderPlan(){
    if(dishes.length===0){
      document.getElementById('plan-content').innerHTML = '<div class="k-empty"><div class="k-empty-icon">📋</div>Kein Speiseplan verfügbar</div>';
      return;
    }
    var byDay = {};
    dishes.forEach(function(d){
      var dc = d.dl_wochentag;
      if(!byDay[dc]) byDay[dc]=[];
      byDay[dc].push(d);
    });
    var html = '';
    [101000,101001,101002,101003,101004,101005].forEach(function(dc){
      var dayMeals = byDay[dc]||[];
      if(!dayMeals.length) return;
      html += '<div class="k-dish-summary"><h3>'+(DAY_FULL[dc]||'?')+'</h3>';
      dayMeals.forEach(function(m){
        var p = m.dl_preis?(m.dl_preis.toFixed(2).replace('.',',')+' €'):'';
        html += '<div class="k-dish-row"><span class="k-dish-name">'+esc(m.dl_gericht)+'</span><span class="k-dish-count">'+p+'</span></div>';
      });
      html += '</div>';
    });
    document.getElementById('plan-content').innerHTML = html;
  }

  // ══════════════════════════════════════════════════
  //  STAMMKUNDEN
  // ══════════════════════════════════════════════════

  var kundenSearchTimer = null;
  function searchKunden(){
    clearTimeout(kundenSearchTimer);
    kundenSearchTimer = setTimeout(function(){
      var q = document.getElementById('kunden-search').value.trim();
      var url = API+'/stammkunden'+(q?'?q='+encodeURIComponent(q):'');
      fetch(url)
        .then(function(r){return r.json();})
        .then(function(res){
          if(!res.success) return;
          kunden = res.customers||[];
          renderKunden();
        })
        .catch(function(){});
    }, 300);
  }

  function renderKunden(){
    if(kunden.length===0){
      document.getElementById('kunden-list').innerHTML = '<div class="k-empty"><div class="k-empty-icon">👤</div>Keine Kunden gefunden</div>'+
        '<div style="text-align:center;margin-top:12px"><button class="k-btn k-btn-confirm k-btn-lg" onclick="K.openNewKunde()">➕ Neuen Stammkunden anlegen</button></div>';
      return;
    }
    var html = '';
    kunden.forEach(function(c){
      html += '<div class="k-order" style="border-left-color:var(--c-green)">';
      html += '<div class="k-order-info" style="padding:14px 16px">';
      html += '<div class="k-order-top"><span class="k-order-name">'+esc(c.name)+'</span><span style="font-size:12px;color:var(--c-muted)">'+esc(c.stammkunde_nr)+'</span></div>';
      html += '<div class="k-order-meta">';
      if(c.telefon) html += '<span>☎ '+esc(c.telefon)+'</span>';
      if(c.email) html += '<span>✉ '+esc(c.email)+'</span>';
      if(c.notiz) html += '<span>📝 '+esc(c.notiz)+'</span>';
      html += '</div></div>';
      html += '<div class="k-order-actions">';
      html += '<button class="k-btn k-btn-confirm k-btn-sm" onclick="K.orderForKunde(\''+c.id+'\',\''+esc(c.name).replace(/'/g,"\\'")+'\',\''+esc(c.telefon).replace(/'/g,"\\'")+'\')">🍽 Bestellen</button>';
      html += '</div></div>';
    });
    html += '<div style="text-align:center;margin-top:12px"><button class="k-btn k-btn-confirm k-btn-lg" onclick="K.openNewKunde()">➕ Neuen Stammkunden anlegen</button></div>';
    document.getElementById('kunden-list').innerHTML = html;
  }

  // ══════════════════════════════════════════════════
  //  NEW ORDER MODAL
  // ══════════════════════════════════════════════════

  function openNewOrder(){
    selectedKunde = null;
    selectedDish = null;
    noQty = 1;
    document.getElementById('no-kunde-search').value = '';
    document.getElementById('no-kunde-results').classList.remove('show');
    document.getElementById('no-kunde-selected').style.display = 'none';
    document.getElementById('no-kunde-new').style.display = 'none';
    document.getElementById('no-kunde-search').style.display = '';
    document.getElementById('no-qty').textContent = '1';
    document.getElementById('no-note').value = '';
    document.getElementById('no-mitnehmen').checked = false;

    // Load dishes for picker
    if(dishes.length===0){
      fetch(API+'/wochenplan')
        .then(function(r){return r.json();})
        .then(function(data){
          dishes = (data.data||[]).filter(function(d){return d.dl_gericht && d.dl_preis;});
          renderDishPicker();
        });
    } else {
      renderDishPicker();
    }
    openModal('modal-order');
  }

  function renderDishPicker(){
    // Filter to today's weekday
    var todayDay = new Date().getDay(); // 0=Sun,1=Mon...6=Sat
    var dvDay = todayDay===0?null:(100999+todayDay); // 101000=Mo,...101005=Sa
    var todayDishes = dvDay ? dishes.filter(function(d){return d.dl_wochentag===dvDay;}) : [];
    if(todayDishes.length===0) todayDishes = dishes; // Fallback: show all

    var html = '';
    todayDishes.forEach(function(d,i){
      var p = d.dl_preis?(d.dl_preis.toFixed(2).replace('.',',')+' €'):'';
      var day = DAY_FULL[d.dl_wochentag]||'';
      html += '<div class="k-dish-opt" data-idx="'+i+'" onclick="K.pickDish('+i+')">';
      html += '<span class="do-name">'+esc(d.dl_gericht)+'</span>';
      if(day && todayDishes.length>2) html += '<span class="do-day">'+day+'</span>';
      html += '<span class="do-price">'+p+'</span>';
      html += '</div>';
    });
    document.getElementById('no-dishes').innerHTML = html;
    // Store reference
    window._noDishes = todayDishes;
  }

  function pickDish(idx){
    selectedDish = window._noDishes[idx];
    document.querySelectorAll('.k-dish-opt').forEach(function(el,i){
      el.classList.toggle('selected',i===idx);
    });
  }

  function noQtyChange(d){
    noQty = Math.max(1, Math.min(99, noQty+d));
    document.getElementById('no-qty').textContent = noQty;
  }

  // Search kunden in order modal
  var noKundeTimer = null;
  function searchOrderKunde(){
    clearTimeout(noKundeTimer);
    noKundeTimer = setTimeout(function(){
      var q = document.getElementById('no-kunde-search').value.trim();
      if(q.length<2){
        document.getElementById('no-kunde-results').classList.remove('show');
        return;
      }
      fetch(API+'/stammkunden?q='+encodeURIComponent(q))
        .then(function(r){return r.json();})
        .then(function(res){
          var list = res.customers||[];
          var el = document.getElementById('no-kunde-results');
          if(list.length===0){
            el.innerHTML = '<div class="k-search-item" onclick="K.newOrderKunde()"><span class="si-name">➕ Neuen Kunden anlegen: "'+esc(q)+'"</span></div>';
          } else {
            var html = '';
            list.forEach(function(c){
              html += '<div class="k-search-item" onclick="K.selectOrderKunde(\''+c.id+'\',\''+esc(c.name).replace(/'/g,"\\'")+'\',\''+esc(c.telefon).replace(/'/g,"\\'")+'\')"><span class="si-name">'+esc(c.name)+'</span><span class="si-phone">'+esc(c.telefon)+'</span></div>';
            });
            html += '<div class="k-search-item" onclick="K.newOrderKunde()"><span class="si-name">➕ Neuen Kunden anlegen</span></div>';
            el.innerHTML = html;
          }
          el.classList.add('show');
        });
    }, 300);
  }

  function selectOrderKunde(id, name, phone){
    selectedKunde = {id:id, name:name, telefon:phone};
    document.getElementById('no-kunde-search').style.display = 'none';
    document.getElementById('no-kunde-results').classList.remove('show');
    document.getElementById('no-kunde-selected').style.display = '';
    document.getElementById('no-kunde-name').textContent = name;
    document.getElementById('no-kunde-phone').textContent = phone?('☎ '+phone):'';
    document.getElementById('no-kunde-new').style.display = 'none';
  }

  function clearOrderKunde(){
    selectedKunde = null;
    document.getElementById('no-kunde-search').style.display = '';
    document.getElementById('no-kunde-search').value = '';
    document.getElementById('no-kunde-selected').style.display = 'none';
    document.getElementById('no-kunde-new').style.display = 'none';
  }

  function newOrderKunde(){
    document.getElementById('no-kunde-results').classList.remove('show');
    document.getElementById('no-kunde-search').style.display = 'none';
    document.getElementById('no-kunde-new').style.display = '';
    document.getElementById('no-new-name').value = document.getElementById('no-kunde-search').value.trim();
    document.getElementById('no-new-phone').value = '';
    selectedKunde = null;
  }

  function orderForKunde(id, name, phone){
    switchTab('mittag');
    openNewOrder();
    setTimeout(function(){
      selectOrderKunde(id, name, phone);
    }, 100);
  }

  function submitNewOrder(){
    // Validate
    var kundenName = '';
    var kundenPhone = '';
    var stammkundeId = '';

    if(selectedKunde){
      kundenName = selectedKunde.name;
      kundenPhone = selectedKunde.telefon;
      stammkundeId = selectedKunde.id;
    } else if(document.getElementById('no-kunde-new').style.display!=='none'){
      kundenName = document.getElementById('no-new-name').value.trim();
      kundenPhone = document.getElementById('no-new-phone').value.trim();
      if(!kundenName){toast('❌ Name eingeben!');return;}
      // Create Stammkunde first
      fetch(API+'/stammkunden',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:kundenName,telefon:kundenPhone})
      })
      .then(function(r){return r.json();})
      .then(function(res){
        if(res.success){
          stammkundeId = res.customer.id;
          doSubmitOrder(kundenName, kundenPhone, stammkundeId);
        } else if(res.existing){
          stammkundeId = res.existing.id;
          doSubmitOrder(kundenName, kundenPhone, stammkundeId);
        } else {
          toast('❌ Kunde konnte nicht angelegt werden');
        }
      });
      return;
    } else {
      toast('❌ Bitte Kunden auswählen!');
      return;
    }
    if(!selectedDish){toast('❌ Bitte Gericht auswählen!');return;}
    doSubmitOrder(kundenName, kundenPhone, stammkundeId);
  }

  function doSubmitOrder(name, phone, skId){
    if(!selectedDish){toast('❌ Bitte Gericht auswählen!');return;}
    var payload = {
      name: name,
      email: '',
      telefon: phone,
      gericht: selectedDish.dl_gericht,
      gericht_id: selectedDish.dl_wochenplanid||'',
      menge: noQty,
      preis: selectedDish.dl_preis||0,
      datum: selectedDish.dl_datum||today(),
      anmerkung: document.getElementById('no-note').value.trim(),
      wochentag_label: DAY_FULL[selectedDish.dl_wochentag]||'',
      mitnehmen: document.getElementById('no-mitnehmen').checked,
      quelle: 1, // Telefon
      stammkunde_id: skId||''
    };

    fetch(API+'/lunch-order',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    })
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.success){
        toast('✅ Bestellung aufgenommen: '+res.bestellnummer);
        closeModal('modal-order');
        loadOrders();
      } else {
        toast('❌ '+(res.errors?res.errors.join(', '):res.error||'Fehler'));
      }
    })
    .catch(function(e){toast('❌ '+e.message);});
  }

  // ══════════════════════════════════════════════════
  //  NEW CUSTOMER MODAL
  // ══════════════════════════════════════════════════

  function openNewKunde(){
    document.getElementById('nk-name').value = '';
    document.getElementById('nk-phone').value = '';
    document.getElementById('nk-email').value = '';
    document.getElementById('nk-note').value = '';
    openModal('modal-kunde');
  }

  function submitNewKunde(){
    var name = document.getElementById('nk-name').value.trim();
    var phone = document.getElementById('nk-phone').value.trim();
    var email = document.getElementById('nk-email').value.trim();
    var note = document.getElementById('nk-note').value.trim();
    if(!name){toast('❌ Name eingeben!');return;}
    if(!phone){toast('❌ Telefon eingeben!');return;}

    fetch(API+'/stammkunden',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,telefon:phone,email:email,notiz:note})
    })
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.success){
        toast('✅ Kunde angelegt: '+res.customer.stammkunde_nr);
        closeModal('modal-kunde');
        searchKunden();
      } else {
        toast('❌ '+(res.errors?res.errors.join(', '):res.error||'Fehler'));
      }
    })
    .catch(function(e){toast('❌ '+e.message);});
  }

  // ══════════════════════════════════════════════════
  //  KITCHEN PRINT
  // ══════════════════════════════════════════════════

  function printKitchen(){
    window.print();
  }

  // ══════════════════════════════════════════════════
  //  UTILS
  // ══════════════════════════════════════════════════

  function openModal(id){document.getElementById(id).classList.add('open');}
  function closeModal(id){document.getElementById(id).classList.remove('open');}

  function updateBadge(tab, count){
    var el = document.getElementById('badge-'+tab);
    if(!el) return;
    if(count>0){el.textContent=count;el.classList.add('show');}
    else{el.classList.remove('show');}
  }

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('k-toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){el.classList.remove('show');}, 3000);
  }

  function refresh(){
    loadOrders();
    toast('🔄 Aktualisiert');
  }

  // ══════════════════════════════════════════════════
  //  INIT
  // ══════════════════════════════════════════════════

  loadOrders();
  loadDishes();
  // Auto-refresh every 30s
  refreshTimer = setInterval(loadOrders, 30000);

  // Public API
  return {
    switchTab: switchTab,
    setStatus: setStatus,
    openNewOrder: openNewOrder,
    pickDish: pickDish,
    noQty: noQtyChange,
    searchOrderKunde: searchOrderKunde,
    selectOrderKunde: selectOrderKunde,
    clearOrderKunde: clearOrderKunde,
    newOrderKunde: newOrderKunde,
    submitNewOrder: submitNewOrder,
    orderForKunde: orderForKunde,
    openNewKunde: openNewKunde,
    submitNewKunde: submitNewKunde,
    searchKunden: searchKunden,
    printKitchen: printKitchen,
    openModal: openModal,
    closeModal: closeModal,
    refresh: refresh
  };
})();
</script>
</body>
</html>
