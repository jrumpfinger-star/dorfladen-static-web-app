    .tp-item-order{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#2e7d4f;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;text-decoration:none;transition:background .12s}

    .tp-grid-card .card-name{font-size:12px;font-weight:600;color:#1f2937;line-height:1.2;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .tp-grid-card .card-price{font-size:13px;font-weight:700;color:#2e7d4f}

    /* Dark-Mode-Feinschliff */

    .mt-popup-close{position:absolute;top:10px;right:10px;z-index:10;width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
    .mt-popup-close:hover{background:rgba(0,0,0,.7)}
    .mt-popup-iframe{border:none;width:100%;flex:1;min-height:0;border-radius:16px}

      .mt-popup-iframe{border-radius:0}

    body.overlay-open{position:fixed;top:var(--scroll-y,0);left:0;right:0;width:100%;overflow:hidden}

<script>
/* === Scroll-Lock (leichtgewichtig) === */
window._dlScrollLocks=window._dlScrollLocks||0;
window.dlLockScroll=function(){
  if(window._dlScrollLocks===0){
    document.documentElement.style.setProperty('--scroll-y','-'+window.scrollY+'px');
    document.body.classList.add('overlay-open');
  }
  window._dlScrollLocks++;
};
window.dlUnlockScroll=function(){
  window._dlScrollLocks=Math.max(0,window._dlScrollLocks-1);
  if(window._dlScrollLocks===0){
    document.body.classList.remove('overlay-open');
    var y=parseInt(document.documentElement.style.getPropertyValue('--scroll-y')||'0')*-1;
    document.documentElement.style.removeProperty('--scroll-y');
    var de=document.documentElement, prev=de.style.scrollBehavior;
    de.style.scrollBehavior='auto';
    window.scrollTo(0,y);
    de.style.scrollBehavior=prev;
  }
};

/* === Bild-Popup === */
window.dlImagePopup=function(src,alt,fallbackSrc){
  if(!src)return;
  var existing=document.getElementById('dl-img-popup');
  if(existing) existing.remove();
  var ov=document.createElement('div');
  ov.id='dl-img-popup';
  ov.style.cssText='position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:pointer';
  var img=document.createElement('img');
  img.src=src; img.alt=alt||'';
  img.style.cssText='max-width:90vw;max-height:80vh;object-fit:contain;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5)';
  if(fallbackSrc && fallbackSrc!==src){
    img.addEventListener('error',function onErr(){img.removeEventListener('error',onErr);img.src=fallbackSrc;});
  }
  img.addEventListener('click',function(e){e.stopPropagation();});
  ov.appendChild(img);
  if(alt){var cap=document.createElement('div');cap.textContent=alt;cap.style.cssText='color:#fff;font-size:15px;font-weight:600;margin-top:12px;text-align:center;max-width:90vw;word-break:break-word';ov.appendChild(cap);}
  var cls=document.createElement('button');
  cls.innerHTML='&#10005;';
  cls.style.cssText='position:absolute;top:12px;right:16px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center';
  ov.appendChild(cls);
  document.body.appendChild(ov);
  if(window.dlLockScroll) dlLockScroll();
  if(!_dlImgHist){ _dlImgHist=true; try{ history.pushState({dlImg:true},''); }catch(e){} }
  function _imgClose(_fromPop){ov.remove();if(window.dlUnlockScroll) dlUnlockScroll();if(_dlImgHist){_dlImgHist=false;if(!_fromPop){try{history.back();}catch(e){}}}}
  ov.addEventListener('click',function(){_imgClose();});
  cls.addEventListener('click',function(e){e.stopPropagation();_imgClose();});
  document.addEventListener('keydown',function onKey(e){if(e.key==='Escape'){_imgClose();document.removeEventListener('keydown',onKey);}});
};
var _dlImgHist=false;

/* === Bestell-Popup (iframe auf /mittagstisch-bestellen) === */
var _mtPopupHist=false;
function openMittagPopup(url){
  var iframe=document.getElementById('mt-popup-iframe');
  var sep=url.indexOf('?')>=0?'&':'?';
  iframe.src=url+sep+'_cb='+Date.now();
  document.getElementById('mt-popup-overlay').classList.add('open');
  if(window.dlLockScroll) dlLockScroll(); else document.body.style.overflow='hidden';
  // Android-/Browser-Zurueck soll den Dialog schliessen statt die App/Seite zu verlassen.
  if(!_mtPopupHist){ _mtPopupHist=true; try{ history.pushState({dlMittagPopup:true},''); }catch(e){} }
}
function closeMittagPopup(_fromPop){
  document.getElementById('mt-popup-overlay').classList.remove('open');
  document.getElementById('mt-popup-iframe').src='';
  if(window.dlUnlockScroll) dlUnlockScroll();
  document.body.style.overflow='';
  if(_mtPopupHist){ _mtPopupHist=false; if(!_fromPop){ try{ history.back(); }catch(e){} } }
}
window.addEventListener('popstate',function(){
  // Zuerst das Bild-Popup (oberste Ebene) schliessen, falls offen.
  var ip=document.getElementById('dl-img-popup');
  if(ip){ ip.remove(); if(window.dlUnlockScroll) dlUnlockScroll(); _dlImgHist=false; return; }
  if(document.getElementById('mt-popup-overlay').classList.contains('open')) closeMittagPopup(true);
});
function openBestellstatus(nr){ openMittagPopup('/bestellstatus?nr='+encodeURIComponent(nr||'')); }

// Seite schliessen: Wenn per Link/App in eigenem Tab geoeffnet, Tab schliessen.
// Sonst (normale Navigation) zurueck bzw. zur Startseite.
function tiClosePage(){
  // Ist ein Bestell-Popup offen? Dann nur dieses schliessen.
  var ov=document.getElementById('mt-popup-overlay');
  if(ov&&ov.classList.contains('open')){ closeMittagPopup(); return; }
  // Versuch, den Tab/das Fenster zu schliessen (funktioniert bei per Script/App
  // geoeffneten Tabs, z.B. aus WhatsApp).
  try{ window.close(); }catch(e){}
  // Fallback nach kurzer Zeit: wenn der Tab noch da ist, zur Startseite.
  setTimeout(function(){ location.href='/'; }, 150);
}

window.addEventListener('message',function(e){
  if(e.data==='closeMittagPopup'){ closeMittagPopup(); }
  else if(e.data==='mittagOrderDone'){ closeMittagPopup(); _reloadLunchMarkers(); }
});
</script>

<script>
(function(){
  var WOCHENTAGE=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  var MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  function fmtDate(d){return WOCHENTAGE[d.getDay()]+', '+d.getDate()+'. '+MONATE[d.getMonth()];}
  function fmtPreis(p){var n=parseFloat(p);if(isNaN(n))return p;return n.toFixed(2).replace('.',',')+' €';}
  function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  var _isTomorrow=false;
  var _tpTodayPost=null,_tpTomorrowPost=null;

  // Bestellbar/echtes Tagesgericht = stammt aus dem Wochenplan (id "wp-...").
  // Katalog-/Freitext-Artikel (auch versehentlich als "Mittagessen" kategorisiert)
  // sind KEINE Tagesgerichte -> sie erscheinen unter "Theke & Kuchen" und sind
  // nicht bestellbar. Verhindert versehentliche Bestellbarkeit bei Kategorie-Vertippern.
  function isLunchDish(it){
    return String((it&&it.id)||'').indexOf('wp-')===0;
  }

  function catIcon(kat){
    var k=(kat||'').toLowerCase();
    var s='width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
    if(k.indexOf('mittag')>=0)return '<svg '+s+'><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>';
    if(k.indexOf('kuchen')>=0||k.indexOf('back')>=0||k.indexOf('torte')>=0)return '<svg '+s+'><path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="12" cy="11" r="3"/><path d="M12 8V2"/></svg>';
    if(k.indexOf('theke')>=0||k.indexOf('salat')>=0)return '<svg '+s+'><path d="M15.2 22H8.8a2 2 0 0 1-2-1.79L5 3h14l-1.81 17.21A2 2 0 0 1 15.2 22Z"/><path d="M6 12a5 5 0 0 1 6 0 5 5 0 0 0 6 0"/></svg>';
    if(k.indexOf('getr')>=0)return '<svg '+s+'><path d="m6 8 1.75 12.28a2 2 0 0 0 2 1.72h4.54a2 2 0 0 0 2-1.72L18 8"/><path d="M5 8h14"/></svg>';
    return '<svg '+s+'><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>';
  }

  function mealIconTile(cls,size){
    return '<div class="tp-item-img no-img'+(cls?(' '+cls):'')+'" style="padding:4px;background:#f0fdf4;'+(size?('width:'+size+'px;height:'+size+'px;'):'')+'"><img src="/images/mittagessen-icon.png" alt="" style="width:100%;height:100%;object-fit:contain"></div>';
  }

  function tpFullImg(it){
    return it.bild_datei ? ('/api/tagesbild?datei='+encodeURIComponent(it.bild_datei)) : (it.bild_url||'');
  }
  function itemCard(it,showOrder){
    var isMittag=isLunchDish(it);
    var _full=tpFullImg(it);
    var img=it.bild_url?'<img class="tp-item-img" src="'+esc(it.bild_url)+'" alt="" onclick="dlImagePopup(\''+esc(_full).replace(/'/g,"\\'")+'\',\''+esc(it.name||'').replace(/'/g,"\\'")+'\',this.src)" style="cursor:zoom-in">':(isMittag?mealIconTile('',0):'<div class="tp-item-img no-img">'+catIcon(it.kategorie)+'</div>');
    var preis=it.preis?fmtPreis(it.preis):'';
    var orderBtn='';
    if(showOrder&&isLunchDish(it)){
      var href,tip;
      if(_isTomorrow){
        var _qp=[];
        if(it.id)_qp.push('gericht_id='+encodeURIComponent(it.id));
        if(it.name)_qp.push('gericht='+encodeURIComponent(it.name));
        if(it.preis)_qp.push('preis='+it.preis);
        href='/mittagstisch-bestellen'+(_qp.length?'?'+_qp.join('&'):'');
        tip='F\u00fcr morgen vorbestellen';
      }else{
        var _now=new Date(), _bsCutoff=window._dlBestellschluss||10.5, _canOrderToday=(_now.getHours()+_now.getMinutes()/60)<_bsCutoff;
        href=_canOrderToday
          ?'/mittagstisch-bestellen?heute=1'+(it.id?'&gericht_id='+encodeURIComponent(it.id):'')+(it.name?'&gericht='+encodeURIComponent(it.name):'')+(it.preis?'&preis='+it.preis:'')
          :'/mittagstisch-bestellen';
        tip=_canOrderToday?'Jetzt f\u00fcr heute bestellen':'Mittagessen bestellen';
      }
      orderBtn='<a class="tp-item-order" href="javascript:void(0)" onclick="openMittagPopup(\''+esc(href).replace(/'/g,"\\'")+'\')" title="'+tip+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></a>';
    }
    var abBadge=it.ab_uhr?'<span class="tp-ab-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>ab '+esc(it.ab_uhr)+'</span>':'';
    var showCat=!showOrder&&it.kategorie;
    var gerichtAttr=(showOrder&&it.name)?' data-gericht="'+esc(it.name)+'"':'';
    var hasRow2=preis||orderBtn||abBadge;
    var row2=hasRow2?'<div class="tp-item-row2">'+(preis?'<div class="tp-item-price">'+preis+'</div>':'')+(abBadge||'')+'<div style="flex:1"></div>'+orderBtn+'</div>':'';
    return '<div class="tp-item"'+gerichtAttr+'>'+img+'<div class="tp-item-info"><div class="tp-item-name">'+esc(it.name||'')+'</div>'+(showCat?'<div class="tp-item-cat">'+esc(it.kategorie)+'</div>':'')+'</div>'+row2+'</div>';
  }

  function gridCard(it){
    var isMittag=isLunchDish(it);
    var _full=tpFullImg(it);
    var img=it.bild_url?'<img src="'+esc(it.bild_url)+'" alt="" onclick="dlImagePopup(\''+esc(_full).replace(/'/g,"\\'")+'\',\''+esc(it.name||'').replace(/'/g,"\\'")+'\',this.src)" style="cursor:zoom-in">':(isMittag?'<div style="width:64px;height:64px;border-radius:8px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;padding:5px"><img src="/images/mittagessen-icon.png" alt="" style="width:100%;height:100%;object-fit:contain"></div>':'<div style="width:64px;height:64px;border-radius:8px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#9ca3af;margin:0 auto 4px">'+catIcon(it.kategorie)+'</div>');
    var preis=it.preis?fmtPreis(it.preis):'';
    var abBadge=it.ab_uhr?'<span class="tp-ab-badge" style="margin-top:2px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>ab '+esc(it.ab_uhr)+'</span>':'';
    return '<div class="tp-grid-card">'+img+'<div class="card-name">'+esc(it.name||'')+'</div>'+(preis?'<div class="card-price">'+preis+'</div>':'')+(abBadge||'')+'</div>';
  }

  function renderPost(post,isTomorrow){
    _isTomorrow=!!isTomorrow;
    var pTitel=(post.titel||'TagesInfo').replace(/Aktuelles/gi,'TagesInfo');
    if(!_isTomorrow){pTitel=pTitel.replace(/^Morgen/i,'Heute');}
    var titleEl=document.getElementById('tp-title');
    titleEl.textContent=pTitel;
    if(_isTomorrow&&pTitel){titleEl.textContent='Morgen: '+pTitel.replace(/^Heute/i,'').replace(/^\s*[:–-]\s*/,'');}
    var d=new Date(post.datum);
    document.getElementById('tp-datum').textContent=(_isTomorrow?'Vorschau – ':'')+fmtDate(d);

    var items=post.items||[];
    if(typeof items==='string'){try{items=JSON.parse(items);}catch(e){items=[];}}
    if(!Array.isArray(items))items=[];

    var _now2=new Date(), nowH=_now2.getHours(), nowM=_now2.getMinutes();
    var lunchOver=_isTomorrow?false:(nowH>12||(nowH===12&&nowM>=30));

    var mittagessen=lunchOver?[]:items.filter(isLunchDish);
    var theke=items.filter(function(i){return !isLunchDish(i);});
    var visibleItems=mittagessen.length+theke.length;

    var html='';
    if(post.text){html+='<div class="tp-freitext">'+esc(post.text)+'</div>';}

    if(mittagessen.length){
      html+='<div class="tp-section"><div class="tp-section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg> Mittagessen</div>';
      mittagessen.forEach(function(it){html+=itemCard(it,true);});
      html+='</div>';
    }
    if(theke.length){
      html+='<div class="tp-section"><div class="tp-section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M2 21a8 8 0 0 1 13.292-6"/><circle cx="12" cy="11" r="3"/><path d="M6.58 18.5A8 8 0 0 1 2 21"/><path d="M22 21a8 8 0 0 0-5-7.5"/><path d="M12 8V2"/><path d="m4.93 10.93 1.41 1.41"/><path d="m19.07 10.93-1.41 1.41"/></svg> Theke & Kuchen</div>';
      if(theke.length<=3){theke.forEach(function(it){html+=itemCard(it);});}
      else{html+='<div class="tp-grid">';theke.forEach(function(it){html+=gridCard(it);});html+='</div>';}
      html+='</div>';
    }
    if(!mittagessen.length&&!theke.length&&items.length){
      html+='<div class="tp-section"><div class="tp-section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg> Produkte</div>';
      items.forEach(function(it){html+=itemCard(it);});
      html+='</div>';
    }
    if(!visibleItems){
      html='<div class="tp-empty">Aktuell liegt keine TagesInfo vor.<br>Schauen Sie später noch einmal vorbei.</div>';
    }

    document.getElementById('tp-body').innerHTML=html;
    if(!_isTomorrow){loadMyLunchOrderMarkers();}
    return visibleItems;
  }

  window.tpSwitchDay=function(day){
    var bH=document.getElementById('tp-tab-heute'),bM=document.getElementById('tp-tab-morgen');
    if(day==='morgen'&&_tpTomorrowPost){
      renderPost(_tpTomorrowPost,true);
      if(bH){bH.style.borderBottomColor='transparent';bH.style.color='#6b7280';}
      if(bM){bM.style.borderBottomColor='#16a34a';bM.style.color='#16a34a';}
    } else if(_tpTodayPost){
      renderPost(_tpTodayPost,false);
      if(bH){bH.style.borderBottomColor='#16a34a';bH.style.color='#16a34a';}
      if(bM){bM.style.borderBottomColor='transparent';bM.style.color='#6b7280';}
    }
  };

  /* === "bestellt"-Markierungen fuer eigene Mittagsbestellungen (nur heute) === */
  function _ensureLunchOrderP(){
    if(window._dlLunchOrderP) return window._dlLunchOrderP;
    var email=(localStorage.getItem('bs_email')||'').trim();
    var dev=(localStorage.getItem('dl_push_device_id')||'').trim();
    var q = email ? ('email='+encodeURIComponent(email)) : (dev ? ('device_id='+encodeURIComponent(dev)) : '');
    if(!q) return null;
    window._dlLunchOrderP=fetch('/api/lunch-order?mode=my&'+q)
      .then(function(r){return r.json();}).catch(function(){return {success:false};});
    return window._dlLunchOrderP;
  }
  function loadMyLunchOrderMarkers(){
    var p=_ensureLunchOrderP();
    if(!p)return;
    p.then(function(res){
      if(!res||!res.success)return;
      var orders=res.orders||[];
      var today=new Date().toISOString().substring(0,10);
      var todayOrders=orders.filter(function(o){return (o.datum||'').substring(0,10)===today;});
      if(!todayOrders.length)return;
      var byGericht={};
      todayOrders.forEach(function(o){
        var g=(o.gericht||'').trim().toLowerCase();
        // Stornierte Bestellung: als storniert markieren (auch wenn es sonst keine offene gibt)
        if(o.status===2){
          if(!byGericht[g]) byGericht[g]={count:0,nr:o.bestellnummer||'',status:2,unread:false,storniert:true};
          else byGericht[g].storniert=true;
          return;
        }
        if(!byGericht[g])byGericht[g]={count:0,nr:o.bestellnummer||'',status:o.status,unread:false};
        byGericht[g].count+=(o.menge||1);
        byGericht[g].status=o.status;
        byGericht[g].nr=o.bestellnummer||byGericht[g].nr;
        if(o.personal_antwort && localStorage.getItem('dl_msg_seen_'+(o.bestellnummer||''))!==o.personal_antwort){
          byGericht[g].unread=true;
          byGericht[g].nr=o.bestellnummer||byGericht[g].nr;
        }
      });
      document.querySelectorAll('.tp-item[data-gericht]').forEach(function(el){
        if(el.querySelector('[data-bs-nr]'))return;
        var g=el.getAttribute('data-gericht').toLowerCase();
        if(!byGericht[g])return;
        var info=byGericht[g];
        var lbl, col, bg;
        if(info.count>0){
          lbl=info.count>1?info.count+'x bestellt':'bestellt';
          col=info.status===1?'#16a34a':'#d97706';
          bg=info.status===1?'#dcfce7':'#fef3c7';
        } else {
          // nur stornierte Bestellung(en) fuer dieses Gericht
          lbl='storniert';
          col='#dc2626'; bg='#fee2e2';
        }
        var badge=document.createElement('a');
        badge.href='javascript:void(0)';
        badge.setAttribute('data-bs-nr',info.nr);
        badge.style.cssText='display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:'+bg+';color:'+col+';border-radius:6px;font-size:10px;font-weight:700;text-decoration:none;margin-left:auto;flex-shrink:0;white-space:nowrap';
        var _icon = info.count>0
          ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
          : '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        badge.innerHTML=_icon+lbl;
        badge.onclick=function(e){e.stopPropagation();e.preventDefault();openBestellstatus(this.getAttribute('data-bs-nr'));};
        el.appendChild(badge);
        if(info.storniert && info.count>0){
          var sb=document.createElement('span');
          sb.style.cssText='display:inline-flex;align-items:center;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:6px;font-size:10px;font-weight:700;margin-left:6px;flex-shrink:0;white-space:nowrap';
          sb.textContent='+ storniert';
          el.appendChild(sb);
        }
        if(info.unread){
          var msg=document.createElement('a');
          msg.href='javascript:void(0)';
          msg.setAttribute('data-bs-nr',info.nr);
          msg.style.cssText='display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:6px;font-size:10px;font-weight:700;text-decoration:none;margin-left:6px;flex-shrink:0;white-space:nowrap;animation:dlPulse 1.6s ease-in-out infinite';
          msg.innerHTML='\ud83d\udcac Neue Nachricht';
          msg.onclick=function(e){e.stopPropagation();e.preventDefault();openBestellstatus(this.getAttribute('data-bs-nr'));};
          el.appendChild(msg);
        }
      });
    }).catch(function(){});
  }
  // Nach einer Bestellung: Order-Cache verwerfen und Markierungen neu laden
  window._reloadLunchMarkers=function(){
    window._dlLunchOrderP=null;
    if(!_isTomorrow) loadMyLunchOrderMarkers();
  };

  function showEmpty(){
    document.getElementById('tp-body').innerHTML='<div class="tp-empty">Aktuell liegt keine TagesInfo vor.<br>Schauen Sie später noch einmal vorbei.</div>';
  }

  /* === Laden === */
  var _tpP=window._tpEarlyP||fetch('/api/tagespost').then(function(r){return r.json();}).catch(function(){return null;});
  _tpP.then(function(res){
    if(!res||!res.success||!res.post){ showEmpty(); return; }
    _tpTodayPost=res.today_post||null;
    _tpTomorrowPost=res.tomorrow_post||null;

    // Day-Tabs anzeigen, wenn beide Posts existieren
    var dayTabs=document.getElementById('tp-day-tabs');
    if(dayTabs&&_tpTodayPost&&_tpTomorrowPost){
      dayTabs.style.display='';
      var bH=document.getElementById('tp-tab-heute'),bM=document.getElementById('tp-tab-morgen');
      if(res.is_tomorrow){
        if(bH){bH.style.borderBottomColor='transparent';bH.style.color='#6b7280';}
        if(bM){bM.style.borderBottomColor='#16a34a';bM.style.color='#16a34a';}
      }
    }
    renderPost(res.post,res.is_tomorrow);
  }).catch(function(){ showEmpty(); });
})();
</script>

<script>
  /* Standard-Dorfladen-Logo in den Header laden (Fallback: Sprossen-Icon + Text) */
  (function(){
    var el=document.getElementById('ti-logo');
    if(!el) return;
    fetch((window.API_BASE||'/api')+'/logo')
      .then(function(r){return r.json();})
      .then(function(res){
        if(!res||!res.success||!res.logo) return;
        el.innerHTML='<img src="'+res.logo+'" alt="Dorfladen Oberornau" style="height:40px;width:auto;display:block">';
      })
      .catch(function(){});
  })();
</script>
